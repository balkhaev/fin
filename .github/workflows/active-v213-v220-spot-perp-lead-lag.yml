name: Active V213-V220 spot-perpetual lead-lag research

on:
  push:
    branches: [agent/active-v213-v220-spot-perp-lead-lag]
    paths:
      - 'research/active_v213_v220/**'
      - '.github/workflows/active-v213-v220-spot-perp-lead-lag.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/active_v213_v220/**'
      - '.github/workflows/active-v213-v220-spot-perp-lead-lag.yml'
  workflow_dispatch:

concurrency:
  group: active-v213-v220-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/active-v213-v220-spot-perp-lead-lag

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize readable frozen source
        run: |
          set -euxo pipefail
          python research/active_v213_v220/bootstrap_payload.py
          test -s research/active_v213_v220/config.py
          test -s research/active_v213_v220/data.py
          test -s research/active_v213_v220/engine.py
          test -s research/active_v213_v220/run_research.py

      - name: Install, compile and causal self-test
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r research/active_v213_v220/requirements.txt
          python -m compileall -q research/active_v213_v220
          cd research/active_v213_v220
          python run_research.py --self-test

      - name: Restore immutable public archive cache
        uses: actions/cache@v4
        with:
          path: .cache/v213_spot_perp
          key: v213-binance-spot-perp-5m-202101-202606-v1

      - name: Run frozen 144-policy research
        run: |
          set -euxo pipefail
          rm -rf research/active_v213_v220/results \
                 research/active_v213_v220/MANIFEST.json \
                 docs/checkpoints/v220
          python research/active_v213_v220/run_research.py \
            --root research/active_v213_v220 \
            --cache .cache/v213_spot_perp \
            2>&1 | tee research/active_v213_v220/run.log

      - name: Materialize V220 checkpoint
        run: |
          set -euxo pipefail
          test -s research/active_v213_v220/results/summary.json
          test -s research/active_v213_v220/results/FROZEN_DECISION.json
          test -s research/active_v213_v220/results/coverage_gate.json
          test -s research/active_v213_v220/results/selection_proof_before_validation.json
          test -s research/active_v213_v220/results/REPORT_RU.md
          mkdir -p docs/checkpoints/v220
          cp research/active_v213_v220/results/summary.json docs/checkpoints/v220/CHECKPOINT_V220.json
          cp research/active_v213_v220/results/REPORT_RU.md docs/checkpoints/v220/RESEARCH_CHECKPOINT_V220_RU.md
          if test -s research/active_v213_v220/results/ANNUAL_RETURNS.csv; then
            cp research/active_v213_v220/results/ANNUAL_RETURNS.csv docs/checkpoints/v220/ANNUAL_RETURNS.csv
          fi

      - name: Verify frozen evidence and safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/active_v213_v220')
          summary = json.loads((root / 'results/summary.json').read_text())
          proof = json.loads((root / 'results/selection_proof_before_validation.json').read_text())
          assert proof['selection_uses_2024'] is False
          assert proof['selection_uses_2025'] is False
          assert proof['selection_uses_2026'] is False
          assert summary['live_ready'] is False
          assert summary['real_leverage_authorized'] is False
          assert summary['profitability_proven'] is False
          print(json.dumps(summary, indent=2))
          PY
          find research/active_v213_v220 docs/checkpoints/v220 -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find research/active_v213_v220 docs/checkpoints/v220 -type f -name '*.pyc' -delete || true

      - name: Commit readable source and frozen decision
        if: github.event_name != 'pull_request'
        run: |
          set -euxo pipefail
          rm -f research/active_v213_v220/bootstrap_payload.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A research/active_v213_v220 docs/checkpoints/v220
          if git diff --cached --quiet; then
            echo 'No V213-V220 changes'
          else
            git commit -m 'Archive V213-V220 spot-perp lead-lag evidence [skip ci]'
            git push origin HEAD:agent/active-v213-v220-spot-perp-lead-lag
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-v213-v220-spot-perp-lead-lag
          path: |
            research/active_v213_v220/results
            research/active_v213_v220/run.log
            docs/checkpoints/v220
          if-no-files-found: warn
          retention-days: 30
