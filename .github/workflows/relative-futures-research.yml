name: Relative futures research
on:
  push:
    branches: [research/relative-futures-20260906]
    paths:
      - research/relative_futures/*.py
      - tests/test_relative*.py
      - .github/workflows/relative-futures-research.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: relative-futures-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -e . -r research/clock_phase/requirements.txt
      - name: Signed accounting and causal signals, including known-defect quarantine test
        run: |
          python -m pytest -q tests/test_relative*.py --junitxml=relative-tests.xml
          python -m pytest -q tests --junitxml=root-tests.xml > root-tests.log 2>&1 || { tail -n 100 root-tests.log; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34033698128
          name: relative-futures-source
          path: source
      - name: Fixed futures cashflow experiments, no real orders
        run: python -m research.relative_futures.study --data source/data --out report > research.log 2>&1 || { tail -n 120 research.log; exit 1; }
      - name: All outcomes and source problems retained
        run: |
          cat source/data/audit.json
          cat research.log
          tail -n 2 root-tests.log
      - name: Preserve original reference and source defects without rewriting them
        if: always()
        run: |
          mkdir -p delivery/research delivery/tests
          cp -r research/relative_futures research/funding_crowding research/annual_rotation delivery/research/
          cp tests/test_relative*.py delivery/tests/
          cp research/btc_flow/requirements.txt delivery/requirements.txt
          git rev-parse HEAD > delivery/TESTED_COMMIT.txt
          find delivery -type d -name __pycache__ -prune -exec rm -rf '{}' +
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relative-futures-research-evidence
          path: |
            delivery/
            source/data/
            source/raw/
            report/
            research.log
            relative-tests.xml
            root-tests.xml
            root-tests.log
          retention-days: 90
  reproduce:
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r research/btc_flow/requirements.txt
      - uses: actions/download-artifact@v4
        with: {name: relative-futures-research-evidence, path: first}
      - run: python -m research.relative_futures.study --data first/source/data --out repeated > repeat.log 2>&1 || { tail -n 100 repeat.log; exit 1; }
      - name: Compare full outputs and every signed fill and funding ledger
        run: |
          python - <<'PY'
          import pathlib,json
          p=pathlib.Path
          a=json.loads(p('first/report/results.json').read_text());b=json.loads(p('repeated/results.json').read_text())
          assert a==b,'Full result mismatch'
          for suffix in ('_fills.csv','_funding.csv','_episodes.csv','_equity.csv.gz'):
              files=list(p('first/report').glob('*'+suffix));assert len(files)==62
              for f in files:assert f.read_bytes()==(p('repeated')/f.name).read_bytes(),f.name
          v=json.loads(p('repeated/verification.json').read_text())
          v.update(all62_reports_exact=True,all62_fills_funding_episodes_equity_files_exact=True,
              independent_execution=True,independent_implementation=False,local_execution=False,
              known_valuation_defect_unpatched=True,live_ready=False)
          p('REPRODUCTION.json').write_text(json.dumps(v,indent=2));print(json.dumps(v))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relative-futures-independent-reproduction
          path: |
            REPRODUCTION.json
            repeated/comparison.csv
            repeated/annual.csv
            repeat.log
          retention-days: 90
