name: BTC Pressure health validation
on:
  push:
    branches: [research/btc-pressure-feed-health]
    paths:
      - research/btc_pressure/*health*.py
      - research/btc_pressure/health_sources.json
      - tests/test_btc_pressure_health.py
      - .github/workflows/btc-pressure-health-validation.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btc-pressure-health-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . -r research/btc_flow/requirements.txt -r research/btc_pressure/requirements-event.txt scipy
      - run: python -m pytest -q tests/test_btc_pressure*.py --junitxml=health-tests.xml > health-tests.log 2>&1
      - run: python -m pytest -q tests --junitxml=full-tests.xml > full-tests.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-pressure-health-tests
          path: |
            health-tests.xml
            health-tests.log
            full-tests.xml
            full-tests.log
          retention-days: 90
  replay:
    needs: tests
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        day: ['2025-09-01','2026-03-01','2026-08-01','2026-09-01','2026-04-01','2026-07-01']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DAY: ${{ matrix.day }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r research/btc_pressure/requirements-event.txt
      - run: python -m research.btc_pressure.download_health_sources --out data --dates "$DAY"
      - run: python -m research.btc_pressure.health_study --data data --out report --date "$DAY" > replay.log 2>&1
      - name: Verify ledger and prior four-date control, never annualize
        run: |
          python - <<'PY'
          import json,math,os,pathlib
          root=pathlib.Path('report');day=os.environ['DAY']
          rows=json.loads((root/'results.json').read_text())['sessions']
          assert len(rows)==4
          for r in rows:
              report=json.loads((root/f"{r['execution_scenario']}_{r['health_policy']}.json").read_text())
              assert report['ledger_reconciled'] and report['independent_audit']['cashflows_reconciled']
              assert report['annual_return_pct'] is None and report['cagr_pct'] is None
              assert report['live_ready'] is False and report['target_achieved'] is False
          old=json.loads(pathlib.Path('research/btc_pressure/account_summary.json').read_text())
          expected=[r for r in old['sessions'] if r['date']==day and r['scenario']=='original_passive']
          if expected:
              actual=next(x for x in rows if x['health_policy']=='original' and x['execution_scenario']=='base')
              for key in ('net_closed','gross_closed','fees_closed','completed_trade_count','submitted_orders'):
                  assert math.isclose(actual[key],expected[0][key],abs_tol=1e-9),(key,actual[key],expected[0][key])
          pathlib.Path('TESTED_COMMIT.txt').write_text(os.environ['GITHUB_SHA'])
          print('Accounting and original control verified. No annual profitability claim.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-pressure-health-${{ matrix.day }}
          path: |
            report/
            data/manifest.json
            replay.log
            TESTED_COMMIT.txt
          retention-days: 90
