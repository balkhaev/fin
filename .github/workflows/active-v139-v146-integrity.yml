name: Active V139-V146 integrity

on:
  push:
    branches: [main]
    paths:
      - 'research/active_v139_v146/**'
      - 'docs/checkpoints/v146/**'
      - '.github/workflows/active-v139-v146-integrity.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/active_v139_v146/**'
      - 'docs/checkpoints/v146/**'
      - '.github/workflows/active-v139-v146-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/active_v139_v146/requirements.txt
      - run: python -m compileall -q research/active_v139_v146/source research/active_v139_v146/postprocess_rejected.py
      - run: python research/active_v139_v146/source/run_research.py --self-test
      - name: Verify frozen negative decision and annual control
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('research/active_v139_v146')
          summary=json.loads((root/'results/summary.json').read_text())
          proof=json.loads((root/'results/selection_proof_before_2021.json').read_text())
          assert summary['policy_count'] == 192
          assert summary['eligible_policy_count'] == 0
          assert summary['standalone_selection_passed'] is False
          assert summary['integration_permitted'] is False
          assert summary['promoted_candidates'] == []
          assert summary['live_ready'] is False
          assert summary['real_leverage_authorized'] is False
          assert proof['selection_uses_2021_or_later'] is False
          annual=(root/'results/ANNUAL_RETURNS.csv').read_text().splitlines()
          assert annual and annual[0].startswith('year,V75_original,V142_futures_proxy')
          ranking=root/'results/selection_ranking_before_2021.csv'
          assert hashlib.sha256(ranking.read_bytes()).hexdigest() == summary['artifact_provenance']['ranking_sha256']
          print(json.dumps(summary,indent=2))
          PY
      - name: Reject opaque canonical evidence
        run: |
          bad=$(find research/active_v139_v146 docs/checkpoints/v146 -type f \( -name '*.zip' -o -name '*.tar' -o -name '*.xz' -o -name '*.b64' -o -name '*.pyfrag' \) -print || true)
          test -z "$bad" || { printf '%s\n' "$bad"; exit 1; }
