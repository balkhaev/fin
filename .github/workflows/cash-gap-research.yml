name: Cash-gap complementary spot research
on:
  push:
    branches: [research/cash-gap-20260906]
    paths:
      - research/cash_gap/*.py
      - tests/test_cash_gap.py
      - .github/workflows/cash-gap-research.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cash-gap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . -r research/clock_phase/requirements.txt
      - name: Causal target composition and full regression suite
        run: |
          python -m pytest -q tests/test_cash_gap.py --junitxml=cash-gap-tests.xml
          python -m pytest -q tests --junitxml=root-tests.xml > root-tests.log 2>&1 || { tail -n 100 root-tests.log; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34024683190
          name: rotation-transfer-research-evidence
          path: source
      - name: All fixed variants, one account each, immutable legacy executor
        run: python -m research.cash_gap.study --source source --out report > research.log 2>&1 || { tail -n 100 research.log; exit 1; }
      - name: Complete outcome table including losing and incomplete accounts
        run: |
          cat research.log
          tail -n 2 root-tests.log
      - name: Preserve runnable code, data and every filled-order ledger
        if: always()
        run: |
          mkdir -p delivery/research delivery/tests
          cp -r research/cash_gap research/annual_rotation research/rotation_stability research/rotation_venue_transfer research/guard_execution_audit delivery/research/
          cp tests/test_cash_gap.py delivery/tests/
          cp research/btc_flow/requirements.txt delivery/requirements.txt
          git rev-parse HEAD > delivery/TESTED_COMMIT.txt
          find delivery -type d -name __pycache__ -prune -exec rm -rf '{}' +
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cash-gap-research-evidence
          path: |
            delivery/
            report/
            source/prior/rotation-data/
            source/new-source/okx-data/
            source/prior/static-report/results.json
            cash-gap-tests.xml
            root-tests.xml
            root-tests.log
            research.log
          retention-days: 90
  reproduce:
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r research/btc_flow/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: cash-gap-research-evidence
          path: first
      - name: Recompute full study on independent clean runner
        run: python -m research.cash_gap.study --source first/source --out repeated > repeat.log 2>&1 || { tail -n 100 repeat.log; exit 1; }
      - name: Compare all98 results, actual quantities and cashflow files
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path
          assert json.loads(p('first/report/results.json').read_text())==json.loads(p('repeated/results.json').read_text())
          files=sorted(p('first/report').glob('*_fills.csv'));assert len(files)==98
          for f in files:assert f.read_bytes()==(p('repeated')/f.name).read_bytes(),f.name
          curves=sorted(p('first/report').glob('*_equity.csv'));assert len(curves)==98
          for f in curves:assert f.read_bytes()==(p('repeated')/f.name).read_bytes(),f.name
          v=json.loads(p('repeated/verification.json').read_text())
          assert v['report_count']==98 and v['exact_controls']==4
          v.update(full_result_exact=True,all98_fill_files_exact=True,all98_equity_files_exact=True,
            independent_execution=True,independent_model_implementation=False,unseen_market_data=False,
            local_execution=False,real_orders=0)
          p('REPRODUCTION.json').write_text(json.dumps(v,indent=2));print(json.dumps(v))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cash-gap-reproduction
          path: |
            REPRODUCTION.json
            repeated/comparison.csv
            repeated/annual.csv
            repeat.log
          retention-days: 90
