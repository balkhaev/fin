name: BTC Flow continuous data
on:
  push:
    branches: [research/btc-flow-continuous]
    paths: [.github/workflows/btc-flow-continuous-data.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Collect public archives and attempt exact realized settlement marks
        run: python -m research.btc_flow_continuous.download --out continuous-data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-flow-continuous-data
          path: continuous-data/
          retention-days: 14
          compression-level: 0
