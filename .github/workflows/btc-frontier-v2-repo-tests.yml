name: BTC Frontier V2 repository tests
on:
  push:
    branches: [research/btc-frontier-v2]
    paths:
      - .github/workflows/btc-frontier-v2-repo-tests.yml
      - research/btc_frontier_v2/**
      - tests/test_btc_frontier_v2.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btc-frontier-v2-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . -r research/btc_flow/requirements.txt scipy
      - name: Full root test suite
        run: python -m pytest tests -q --junitxml=full-tests.xml > full-tests.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-frontier-v2-repository-tests
          path: |
            full-tests.xml
            full-tests.log
          retention-days: 90
