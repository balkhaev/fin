name: Active V230-V236 USD-M calendar spread research

on:
  push:
    branches: [agent/active-v229-v236-perp-calendar-spread]
    paths:
      - 'research/active_v229_v236/**'
      - '.github/workflows/active-v230-v236-usdm-calendar-research.yml'
  workflow_dispatch:

concurrency:
  group: active-v230-v236-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/active-v229-v236-perp-calendar-spread

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize readable frozen source
        run: |
          set -euxo pipefail
          python research/active_v229_v236/bootstrap_full_research.py
          test -s research/active_v229_v236/data.py
          test -s research/active_v229_v236/engine.py
          test -s research/active_v229_v236/run_research.py

      - name: Install, compile and causal self-test
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r research/active_v229_v236/requirements.txt
          python -m compileall -q research/active_v229_v236
          cd research/active_v229_v236
          python run_research.py --self-test

      - name: Restore immutable public archive cache
        uses: actions/cache@v4
        with:
          path: .cache/v230_usdm_calendar
          key: v230-usdm-perp-quarterly-1h-202101-202606-v1

      - name: Run frozen 144-policy research
        run: |
          set -euxo pipefail
          rm -rf research/active_v229_v236/results \
                 research/active_v229_v236/MANIFEST.json \
                 docs/checkpoints/v236
          python research/active_v229_v236/run_research.py \
            --root research/active_v229_v236 \
            --cache .cache/v230_usdm_calendar \
            2>&1 | tee research/active_v229_v236/run.log

      - name: Materialize V236 checkpoint
        run: |
          set -euxo pipefail
          test -s research/active_v229_v236/results/summary.json
          test -s research/active_v229_v236/results/FROZEN_DECISION.json
          test -s research/active_v229_v236/results/coverage_gate.json
          test -s research/active_v229_v236/results/selection_proof_before_validation.json
          test -s research/active_v229_v236/results/REPORT_RU.md
          mkdir -p docs/checkpoints/v236
          cp research/active_v229_v236/results/summary.json docs/checkpoints/v236/CHECKPOINT_V236.json
          cp research/active_v229_v236/results/REPORT_RU.md docs/checkpoints/v236/RESEARCH_CHECKPOINT_V236_RU.md
          if test -s research/active_v229_v236/results/ANNUAL_RETURNS.csv; then
            cp research/active_v229_v236/results/ANNUAL_RETURNS.csv docs/checkpoints/v236/ANNUAL_RETURNS.csv
          fi

      - name: Verify frozen evidence and safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/active_v229_v236')
          summary = json.loads((root / 'results/summary.json').read_text())
          proof = json.loads((root / 'results/selection_proof_before_validation.json').read_text())
          assert proof['selection_uses_2024'] is False
          assert proof['selection_uses_2025'] is False
          assert proof['selection_uses_2026'] is False
          assert summary['live_ready'] is False
          assert summary['real_leverage_authorized'] is False
          assert summary['profitability_proven'] is False
          assert summary['integration_permitted'] is False
          print(json.dumps(summary, indent=2))
          PY
          find research/active_v229_v236 docs/checkpoints/v236 -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find research/active_v229_v236 docs/checkpoints/v236 -type f -name '*.pyc' -delete || true

      - name: Commit readable source and frozen results
        run: |
          set -euxo pipefail
          rm -f research/active_v229_v236/bootstrap_full_research.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A research/active_v229_v236 docs/checkpoints/v236
          if git diff --cached --quiet; then
            echo 'No V230-V236 changes'
          else
            git commit -m 'Archive V230-V236 USD-M calendar spread evidence [skip ci]'
            git push origin HEAD:agent/active-v229-v236-perp-calendar-spread
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-v230-v236-usdm-calendar-spread
          path: |
            research/active_v229_v236/results
            research/active_v229_v236/run.log
            docs/checkpoints/v236
          if-no-files-found: warn
          retention-days: 30

# Activated after the immutable V229 data gate passed.
