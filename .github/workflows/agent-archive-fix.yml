name: Validate archive-only recent history

on:
  push:
    branches: [agent/fix-backtests-dyn-profiles]
    paths:
      - 'scripts/apply_agent_archive_only_fix.py'
      - '.github/workflows/agent-archive-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-backtests-dyn-profiles
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply, validate and publish
        shell: bash
        run: |
          set +e
          log=agent-production-validation.log
          : >"$log"

          run_check() {
            title="$1"
            shift
            {
              echo
              echo "===== ${title} ====="
              "$@"
            } >>"$log" 2>&1
            status=$?
            echo "exit_status=${status}" >>"$log"
            return $status
          }

          status=0
          run_check "apply archive-only patch" python scripts/apply_agent_archive_only_fix.py || status=$?
          if [ "$status" -eq 0 ]; then
            rm scripts/apply_agent_archive_only_fix.py
            rm .github/workflows/agent-archive-fix.yml
            run_check "git diff check" git diff --check || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_check "compile" python -m compileall -q \
              src/finruntime/observability \
              src/finruntime/strategies \
              scripts/run_paper_stack.py \
              tests/runtime || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_check "runtime tests" python -m unittest discover -s tests/runtime -v || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_check "runtime verification" python scripts/verify_runtime.py --full || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_check "Consensus archive fallback" python - <<'PY'
          from datetime import date
          from finruntime.observability.factor_backtests import run_consensus_backtest

          result = run_consensus_backtest(date(2026, 6, 15), date(2026, 7, 31))
          diagnostics = result['diagnostics']
          assert diagnostics['wif_klines'] > 0
          assert diagnostics['wif_premium_klines'] > 0
          assert diagnostics['dot_klines'] > 0
          print({
              'missing_archives': len(diagnostics['archive_missing_urls']),
              'wif_klines': diagnostics['wif_klines'],
              'dot_klines': diagnostics['dot_klines'],
              'trades': len(result['trades']),
              'ending_nav': result['metrics']['ending_nav_usd'],
          })
          PY
            status=$?
          fi

          git config user.name 'OpenAI Agent'
          git config user.email 'openai-agent@users.noreply.github.com'
          if [ "$status" -eq 0 ]; then
            rm -f "$log"
            git add -A
            git commit -m 'Use daily archives for recent factor history'
          else
            rm -f scripts/apply_agent_archive_only_fix.py
            rm -f .github/workflows/agent-archive-fix.yml
            git add -A
            git commit -m 'Record archive validation failure'
          fi
          git push origin HEAD:agent/fix-backtests-dyn-profiles
          exit "$status"
