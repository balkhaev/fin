name: DS-40/180 T50-C3 v2 paper worker

on:
  push:
    branches: [main, agent/ds40180-forward-ab]
    paths:
      - 'src/finruntime/strategies/ds40180_t50c3_paper.py'
      - 'src/finruntime/strategies/_ds40180_*.py'
      - 'src/finruntime/observability/strategy_hub.py'
      - 'src/finruntime/observability/server.py'
      - 'src/finruntime/registry.py'
      - 'config/strategies/ds40180_t50c3_okx_paper.json'
      - 'docs/checkpoints/runtime-v1/STRATEGY_REGISTRY.json'
      - 'scripts/check_paper_stack.py'
      - 'tests/runtime/test_ds40180_t50c3_paper.py'
      - 'tests/runtime/test_ds40180_ab.py'
      - 'tests/runtime/test_strategy_hub.py'
      - 'docs/DS40180_T50C3_PAPER_RU.md'
      - '.github/workflows/ds40180-paper.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/finruntime/strategies/ds40180_t50c3_paper.py'
      - 'src/finruntime/strategies/_ds40180_*.py'
      - 'src/finruntime/observability/strategy_hub.py'
      - 'src/finruntime/observability/server.py'
      - 'src/finruntime/registry.py'
      - 'config/strategies/ds40180_t50c3_okx_paper.json'
      - 'docs/checkpoints/runtime-v1/STRATEGY_REGISTRY.json'
      - 'scripts/check_paper_stack.py'
      - 'tests/runtime/test_ds40180_t50c3_paper.py'
      - 'tests/runtime/test_ds40180_ab.py'
      - 'tests/runtime/test_strategy_hub.py'
      - 'docs/DS40180_T50C3_PAPER_RU.md'
      - '.github/workflows/ds40180-paper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-worker:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile v2 and A-B implementation
        run: |
          python -m compileall -q \
            src/finruntime/strategies/ds40180_t50c3_paper.py \
            src/finruntime/strategies/_ds40180_*.py \
            src/finruntime/observability/strategy_hub.py \
            src/finruntime/observability/server.py \
            scripts/check_paper_stack.py \
            tests/runtime/test_ds40180_t50c3_paper.py \
            tests/runtime/test_ds40180_ab.py \
            tests/runtime/test_strategy_hub.py

      - name: Run deterministic strategy, A-B and hub tests
        run: |
          python -m unittest discover -s tests/runtime -p 'test_ds40180_t50c3_paper.py' -v
          python -m unittest discover -s tests/runtime -p 'test_ds40180_ab.py' -v
          python -m unittest tests.runtime.test_strategy_hub -v

      - name: Verify runtime registry contract
        run: python scripts/verify_runtime.py --full

      - name: Enforce paper-only surface
        run: |
          set -euxo pipefail
          python -m finruntime.strategies.ds40180_t50c3_paper --help >/tmp/help.txt
          grep -F -- '--verify-journal' /tmp/help.txt
          grep -F -- '--ab-snapshot' /tmp/help.txt
          grep -F -- '--ab-journal' /tmp/help.txt
          ! grep -R -E 'submit_order|create_order|place_order|apiKey|secretKey' \
            src/finruntime/strategies/ds40180_t50c3_paper.py \
            src/finruntime/strategies/_ds40180_*.py
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(
              Path('config/strategies/ds40180_t50c3_okx_paper.json').read_text()
          )
          assert config['strategy_version'] == 'okx-paper-v2'
          assert config['allowed_modes'] == ['paper', 'shadow']
          assert config['live_ready'] is False
          assert config['real_leverage_authorized'] is False
          assert config['exchange_submission_available'] is False
          assert config['risk']['paper_gross_cap_absolute'] == 1.50
          assert config['execution']['persistent_append_only_ledger'] is True
          assert config['market']['crisis_bar'] == '4H'
          ab = config['observability']['forward_ab']
          assert ab['enabled'] is True
          assert ab['study_id'] == 'ds40180_v1_v2_forward_ab'
          assert ab['legacy_reference_version'] == 'okx-paper-v1'
          assert ab['legacy_source_commit'] == 'cb942798acdd0f27867b923476dc9b50eb67984f'
          assert ab['legacy_source_blob'] == 'dd573280ddec0e2ae50e33941d4f0154525d4809'
          assert ab['preferred_review_days'] == 90
          assert ab['automatic_winner_promotion'] is False
          PY

  okx-public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build two consecutive live public-data snapshots
        run: |
          set -euxo pipefail
          snapshot="${RUNNER_TEMP}/ds40180-okx-paper.json"
          timeout 540 python -m finruntime.strategies.ds40180_t50c3_paper \
            --snapshot "${snapshot}" \
            --reset-date 2026-07-31 \
            --starting-cash 10000 \
            --once
          timeout 540 python -m finruntime.strategies.ds40180_t50c3_paper \
            --snapshot "${snapshot}" \
            --reset-date 2026-07-31 \
            --starting-cash 10000 \
            --once
          SNAPSHOT_PATH="${snapshot}" python - <<'PY'
          import json
          import os
          from datetime import date
          from pathlib import Path

          snapshot = json.loads(Path(os.environ['SNAPSHOT_PATH']).read_text())
          assert snapshot['schema_version'] == 2
          assert snapshot['strategyId'] == 'ds40180_t50c3_okx_paper'
          assert snapshot['strategyVersion'] == 'okx-paper-v2'
          assert snapshot['status'] == 'ready'
          assert snapshot['mode'] == 'paper'
          assert len(snapshot['assets']) >= 8
          assert date.fromisoformat(snapshot['effectiveDate']) > date.fromisoformat(snapshot['asOf'])
          assert snapshot['targetGross'] <= snapshot['dynamicGrossCap'] + 1e-12
          assert snapshot['dynamicGrossCap'] <= 1.50 + 1e-12
          assert snapshot['paper']['navUsd'] > 0
          assert snapshot['persistence']['journal']['valid'] is True
          assert snapshot['persistence']['journal']['events'] >= 1
          assert Path(snapshot['persistence']['statePath']).is_file()
          assert Path(snapshot['persistence']['journalPath']).is_file()
          assert not any('4h fallback' in warning for warning in snapshot['warnings'])

          comparison = snapshot['comparison']
          assert comparison['schema_version'] == 1
          assert comparison['studyId'] == 'ds40180_v1_v2_forward_ab'
          assert comparison['mode'] == 'paper_observability'
          assert comparison['status'] == 'collecting'
          assert comparison['quality']['matched'] is True
          assert comparison['quality']['v1SourcePinned'] is True
          assert comparison['quality']['v2Persistent'] is True
          assert comparison['forwardObservationDays'] == 1
          assert comparison['minimumReviewDays'] == 30
          assert comparison['preferredReviewDays'] == 90
          assert comparison['matchedHistoricalPoints'] >= 1
          assert comparison['interpretation']['winnerDeclared'] is False
          assert comparison['arms']['legacyV1Reference']['strategyVersion'] == 'okx-paper-v1'
          assert comparison['arms']['legacyV1Reference']['sourceCommit'] == 'cb942798acdd0f27867b923476dc9b50eb67984f'
          assert comparison['arms']['forwardV2']['strategyVersion'] == 'okx-paper-v2'
          assert comparison['persistence']['journal']['valid'] is True
          assert comparison['persistence']['journal']['events'] == 1
          assert Path(comparison['persistence']['snapshotPath']).is_file()
          assert Path(comparison['persistence']['journalPath']).is_file()
          assert comparison['exchange_submission_available'] is False
          assert comparison['live_ready'] is False
          assert comparison['real_leverage_authorized'] is False

          assert snapshot['exchange_submission_available'] is False
          assert snapshot['live_ready'] is False
          assert snapshot['real_leverage_authorized'] is False
          print(json.dumps({
              'asOf': snapshot['asOf'],
              'effectiveDate': snapshot['effectiveDate'],
              'assets': snapshot['assets'],
              'failedAssets': snapshot['failedAssets'],
              'targetGross': snapshot['targetGross'],
              'targetNet': snapshot['targetNet'],
              'dynamicGrossCap': snapshot['dynamicGrossCap'],
              'grossCapRegime': snapshot['grossCapRegime'],
              'riskScale': snapshot['riskScale'],
              'regime': snapshot['regime'],
              'crisis4h': snapshot['overlays']['crisis4h'],
              'navUsd': snapshot['paper']['navUsd'],
              'journalEvents': snapshot['persistence']['journal']['events'],
              'warnings': snapshot['warnings'],
              'forwardAB': {
                  'status': comparison['status'],
                  'observations': comparison['forwardObservationDays'],
                  'matchedHistoricalPoints': comparison['matchedHistoricalPoints'],
                  'v1': comparison['arms']['legacyV1Reference'],
                  'v2': comparison['arms']['forwardV2'],
                  'deltasV2MinusV1': comparison['deltasV2MinusV1'],
                  'journal': comparison['persistence']['journal'],
              },
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ds40180-v2-forward-ab-okx-smoke
          path: |
            ${{ runner.temp }}/ds40180-okx-paper.json
            ${{ runner.temp }}/ds40180_t50c3_paper_state.json
            ${{ runner.temp }}/ds40180_t50c3_paper_events.jsonl
            ${{ runner.temp }}/ds40180_t50c3_ab_snapshot.json
            ${{ runner.temp }}/ds40180_t50c3_ab_events.jsonl
          if-no-files-found: warn
          retention-days: 14
