name: Apply DS-40/180 OKX 4H correction

on:
  push:
    branches: [agent/ds40180-v2-improvements]
    paths:
      - '.github/workflows/ds40180-paper.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ds40180-paper.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ds40180-4h-correction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correct-and-commit:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ds40180-v2-improvements
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct source and contracts
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('src/finruntime/strategies/_ds40180_common.py'),
              Path('src/finruntime/observability/strategy_hub.py'),
              Path('config/strategies/ds40180_t50c3_okx_paper.json'),
              Path('docs/DS40180_T50C3_PAPER_RU.md'),
              Path('tests/runtime/test_ds40180_t50c3_paper.py'),
              Path('tests/runtime/test_strategy_hub.py'),
          ]
          changed = []
          for path in paths:
              text = path.read_text(encoding='utf-8')
              updated = text.replace('4Hutc', '4H')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          assert 'src/finruntime/strategies/_ds40180_common.py' in changed
          assert 'config/strategies/ds40180_t50c3_okx_paper.json' in changed
          print({'changed': changed})
          PY
          ! grep -R --line-number --fixed-strings '4Hutc' \
            src/finruntime/strategies \
            src/finruntime/observability \
            config/strategies \
            docs/DS40180_T50C3_PAPER_RU.md \
            tests/runtime/test_ds40180_t50c3_paper.py \
            tests/runtime/test_strategy_hub.py
      - name: Validate corrected source
        run: |
          set -euxo pipefail
          python -m compileall -q src/finruntime tests/runtime
          python -m unittest discover -s tests/runtime -p 'test_ds40180_t50c3_paper.py' -v
          python -m unittest tests.runtime.test_strategy_hub -v
          python scripts/verify_runtime.py --full
      - name: Commit non-workflow source changes
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/finruntime/strategies/_ds40180_common.py \
            src/finruntime/observability/strategy_hub.py \
            config/strategies/ds40180_t50c3_okx_paper.json \
            docs/DS40180_T50C3_PAPER_RU.md \
            tests/runtime/test_ds40180_t50c3_paper.py \
            tests/runtime/test_strategy_hub.py
          if git diff --cached --quiet; then
            echo 'No interval correction required'
          else
            git commit -m 'Fix OKX 4H crisis data interval'
            git push origin HEAD:agent/ds40180-v2-improvements
          fi
