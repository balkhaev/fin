name: Active V148 Cboe dated VIX access probe

on:
  push:
    branches: [agent/active-v147-v154-cme-dated-contracts]
    paths:
      - 'research/active_v147_v154/cboe_access_probe.py'
      - 'research/active_v147_v154/requirements.txt'
      - '.github/workflows/active-v148-cboe-access-probe.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/active_v147_v154/cboe_access_probe.py'
      - 'research/active_v147_v154/requirements.txt'
      - '.github/workflows/active-v148-cboe-access-probe.yml'
  workflow_dispatch:

concurrency:
  group: active-v148-cboe-access-probe
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/active-v147-v154-cme-dated-contracts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and compile
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/active_v147_v154/requirements.txt
          python -m py_compile research/active_v147_v154/cboe_access_probe.py
      - name: Probe official Cboe dated-contract datasets
        id: probe
        continue-on-error: true
        run: |
          rm -rf artifacts/v148_cboe_probe
          mkdir -p artifacts/v148_cboe_probe
          python research/active_v147_v154/cboe_access_probe.py \
            --output artifacts/v148_cboe_probe \
            2>&1 | tee artifacts/v148_probe.log
      - name: Materialize and validate direct evidence
        if: always()
        run: |
          set -euxo pipefail
          rm -rf research/active_v147_v154/cboe_probe_results
          mkdir -p research/active_v147_v154/cboe_probe_results
          cp -r artifacts/v148_cboe_probe/. research/active_v147_v154/cboe_probe_results/ 2>/dev/null || true
          cp artifacts/v148_probe.log research/active_v147_v154/cboe_probe_results/run.log 2>/dev/null || true
          test -s research/active_v147_v154/cboe_probe_results/summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('research/active_v147_v154/cboe_probe_results/summary.json').read_text())
          assert value['status'] in {
              'official_cboe_dated_contract_access_confirmed',
              'official_cboe_dated_contract_access_blocked',
          }
          assert value['live_ready'] is False
          assert value['real_leverage_authorized'] is False
          print(json.dumps(value,indent=2))
          PY
          find research/active_v147_v154 -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find research/active_v147_v154 -type f -name '*.pyc' -delete || true
      - name: Commit direct probe evidence
        if: always()
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/active_v147_v154
          if git diff --cached --quiet; then
            echo 'No probe changes to commit'
          else
            git commit -m 'Record V148 official Cboe access evidence [skip ci]'
            git push origin HEAD:agent/active-v147-v154-cme-dated-contracts
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-v148-cboe-dated-vix-access-probe
          path: |
            artifacts/v148_cboe_probe
            artifacts/v148_probe.log
          if-no-files-found: warn
          retention-days: 30
