name: Harden migration JSON type validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/agent-harden-migration-json-types.yml'

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce schema-equivalent Python types
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/finruntime/provenance/migration.py')
          text = path.read_text(encoding='utf-8')

          old = '        output[path] = require_sha256(raw_hash, field=f"{field}.{path}")\n'
          new = (
              '        if not isinstance(raw_hash, str):\n'
              '            raise ContractError(f"{field}.{path} must be a SHA-256 string")\n'
              '        output[path] = require_sha256(raw_hash, field=f"{field}.{path}")\n'
          )
          if text.count(old) != 1:
              raise SystemExit('hash manifest normalization marker changed')
          text = text.replace(old, new, 1)

          old = (
              '    for path, digest in value.items():\n'
              '        _require_repository_path(path, field=f"{field} path")\n'
              '        normalized = require_sha256(digest, field=f"{field}.{path}")\n'
          )
          new = (
              '    for path, digest in value.items():\n'
              '        _require_repository_path(path, field=f"{field} path")\n'
              '        if not isinstance(digest, str):\n'
              '            raise ContractError(f"{field}.{path} must be a SHA-256 string")\n'
              '        normalized = require_sha256(digest, field=f"{field}.{path}")\n'
          )
          if text.count(old) != 1:
              raise SystemExit('hash manifest validation marker changed')
          text = text.replace(old, new, 1)

          marker = (
              '    canonical_json_bytes(output)\n'
              '    return dict(sorted(output.items()))\n\n\n'
              '@dataclass'
          )
          replacement = (
              '    canonical_json_bytes(output)\n'
              '    return dict(sorted(output.items()))\n\n\n'
              'def _validate_parameters(value: Mapping[str, Any], *, field: str) -> None:\n'
              '    if not isinstance(value, Mapping):\n'
              '        raise ContractError(f"{field} must be an object")\n'
              '    if any(not isinstance(key, str) or not key for key in value):\n'
              '        raise ContractError(f"{field} must contain non-empty string keys")\n'
              '    canonical_json_bytes(value)\n\n\n'
              '@dataclass'
          )
          if text.count(marker) != 1:
              raise SystemExit('parameter validation insertion marker changed')
          text = text.replace(marker, replacement, 1)

          old = (
              '        require_sha256(self.migration_id, field="migration_id")\n'
              '        if self.migration_kind not in MIGRATION_KINDS:\n'
              '            raise ContractError(f"unsupported migration kind: {self.migration_kind}")\n'
              '        if self.status not in MIGRATION_STATUSES:\n'
              '            raise ContractError(f"unsupported migration status: {self.status}")\n'
          )
          new = (
              '        if not isinstance(self.migration_id, str):\n'
              '            raise ContractError("migration_id must be a SHA-256 string")\n'
              '        require_sha256(self.migration_id, field="migration_id")\n'
              '        if not isinstance(self.migration_kind, str):\n'
              '            raise ContractError("migration_kind must be a string")\n'
              '        if self.migration_kind not in MIGRATION_KINDS:\n'
              '            raise ContractError(f"unsupported migration kind: {self.migration_kind}")\n'
              '        if not isinstance(self.status, str):\n'
              '            raise ContractError("migration status must be a string")\n'
              '        if self.status not in MIGRATION_STATUSES:\n'
              '            raise ContractError(f"unsupported migration status: {self.status}")\n'
          )
          if text.count(old) != 1:
              raise SystemExit('migration identity validation marker changed')
          text = text.replace(old, new, 1)

          old = (
              '        format_utc(self.created_at_utc)\n'
              '        if not isinstance(self.reason, str) or not self.reason:\n'
          )
          new = (
              '        if not isinstance(self.created_at_utc, str):\n'
              '            raise ContractError("created_at_utc must be a UTC string")\n'
              '        format_utc(self.created_at_utc)\n'
              '        if not isinstance(self.reason, str) or not self.reason:\n'
          )
          if text.count(old) != 1:
              raise SystemExit('migration timestamp validation marker changed')
          text = text.replace(old, new, 1)

          old = (
              '        canonical_json_bytes(self.inherited_parameters)\n'
              '        canonical_json_bytes(self.changed_parameters)\n'
          )
          new = (
              '        _validate_parameters(\n'
              '            self.inherited_parameters,\n'
              '            field="inherited_parameters",\n'
              '        )\n'
              '        _validate_parameters(\n'
              '            self.changed_parameters,\n'
              '            field="changed_parameters",\n'
              '        )\n'
          )
          if text.count(old) != 1:
              raise SystemExit('migration parameter validation marker changed')
          text = text.replace(old, new, 1)

          marker = (
              '        if (\n'
              '            self.capital_authorization_carried_forward\n'
          )
          replacement = (
              '        for field_name in (\n'
              '            "forward_clock_reset",\n'
              '            "successor_provenance_complete",\n'
              '            "capital_authorization_carried_forward",\n'
              '            "live_ready",\n'
              '            "real_leverage_authorized",\n'
              '            "exchange_submission_available",\n'
              '        ):\n'
              '            if type(getattr(self, field_name)) is not bool:\n'
              '                raise ContractError(f"{field_name} must be a JSON boolean")\n\n'
              '        if (\n'
              '            self.capital_authorization_carried_forward\n'
          )
          if text.count(marker) != 1:
              raise SystemExit('boolean validation insertion marker changed')
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          PYTHONPATH=src python -m compileall -q src/finruntime tests/runtime
          PYTHONPATH=src python -m unittest discover -s tests/runtime -p 'test_*.py' -v
          python scripts/verify_runtime.py --contracts-only
          rm .github/workflows/agent-harden-migration-json-types.yml
          git config user.name 'OpenAI Agent'
          git config user.email 'agent@openai.com'
          git add -A
          git commit -m 'Enforce strict migration JSON types'
          git push origin HEAD:"$HEAD_REF"
