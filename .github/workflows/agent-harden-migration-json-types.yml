name: Harden migration JSON type validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/agent-harden-migration-json-types.yml'

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce schema-equivalent Python types
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/finruntime/provenance/migration.py')
          text = path.read_text(encoding='utf-8')

          old = '''        output[path] = require_sha256(raw_hash, field=f"{field}.{path}")
          '''
          new = '''        if not isinstance(raw_hash, str):
              raise ContractError(f"{field}.{path} must be a SHA-256 string")
          output[path] = require_sha256(raw_hash, field=f"{field}.{path}")
          '''
          if text.count(old) != 1:
              raise SystemExit('hash manifest normalization marker changed')
          text = text.replace(old, new, 1)

          old = '''    for path, digest in value.items():
              _require_repository_path(path, field=f"{field} path")
              normalized = require_sha256(digest, field=f"{field}.{path}")
          '''
          new = '''    for path, digest in value.items():
              _require_repository_path(path, field=f"{field} path")
              if not isinstance(digest, str):
                  raise ContractError(f"{field}.{path} must be a SHA-256 string")
              normalized = require_sha256(digest, field=f"{field}.{path}")
          '''
          if text.count(old) != 1:
              raise SystemExit('hash manifest validation marker changed')
          text = text.replace(old, new, 1)

          marker = '''    canonical_json_bytes(output)
              return dict(sorted(output.items()))


          @dataclass'''
          replacement = '''    canonical_json_bytes(output)
              return dict(sorted(output.items()))


          def _validate_parameters(value: Mapping[str, Any], *, field: str) -> None:
              if not isinstance(value, Mapping):
                  raise ContractError(f"{field} must be an object")
              if any(not isinstance(key, str) or not key for key in value):
                  raise ContractError(f"{field} must contain non-empty string keys")
              canonical_json_bytes(value)


          @dataclass'''
          if text.count(marker) != 1:
              raise SystemExit('parameter validation insertion marker changed')
          text = text.replace(marker, replacement, 1)

          old = '''        require_sha256(self.migration_id, field="migration_id")
              if self.migration_kind not in MIGRATION_KINDS:
                  raise ContractError(f"unsupported migration kind: {self.migration_kind}")
              if self.status not in MIGRATION_STATUSES:
                  raise ContractError(f"unsupported migration status: {self.status}")
          '''
          new = '''        if not isinstance(self.migration_id, str):
                  raise ContractError("migration_id must be a SHA-256 string")
              require_sha256(self.migration_id, field="migration_id")
              if not isinstance(self.migration_kind, str):
                  raise ContractError("migration_kind must be a string")
              if self.migration_kind not in MIGRATION_KINDS:
                  raise ContractError(f"unsupported migration kind: {self.migration_kind}")
              if not isinstance(self.status, str):
                  raise ContractError("migration status must be a string")
              if self.status not in MIGRATION_STATUSES:
                  raise ContractError(f"unsupported migration status: {self.status}")
          '''
          if text.count(old) != 1:
              raise SystemExit('migration identity validation marker changed')
          text = text.replace(old, new, 1)

          old = '''        format_utc(self.created_at_utc)
              if not isinstance(self.reason, str) or not self.reason:
          '''
          new = '''        if not isinstance(self.created_at_utc, str):
                  raise ContractError("created_at_utc must be a UTC string")
              format_utc(self.created_at_utc)
              if not isinstance(self.reason, str) or not self.reason:
          '''
          if text.count(old) != 1:
              raise SystemExit('migration timestamp validation marker changed')
          text = text.replace(old, new, 1)

          old = '''        canonical_json_bytes(self.inherited_parameters)
              canonical_json_bytes(self.changed_parameters)
          '''
          new = '''        _validate_parameters(
                  self.inherited_parameters,
                  field="inherited_parameters",
              )
              _validate_parameters(
                  self.changed_parameters,
                  field="changed_parameters",
              )
          '''
          if text.count(old) != 1:
              raise SystemExit('migration parameter validation marker changed')
          text = text.replace(old, new, 1)

          marker = '''        if (
                  self.capital_authorization_carried_forward
          '''
          replacement = '''        for field_name in (
                  "forward_clock_reset",
                  "successor_provenance_complete",
                  "capital_authorization_carried_forward",
                  "live_ready",
                  "real_leverage_authorized",
                  "exchange_submission_available",
              ):
                  if type(getattr(self, field_name)) is not bool:
                      raise ContractError(f"{field_name} must be a JSON boolean")

              if (
                  self.capital_authorization_carried_forward
          '''
          if text.count(marker) != 1:
              raise SystemExit('boolean validation insertion marker changed')
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')

          tests = Path('tests/runtime/test_strategy_migration.py')
          text = tests.read_text(encoding='utf-8')
          old = 'from finruntime.canonical import ContractError\n'
          new = 'from finruntime.canonical import ContractError, sha256_id\n'
          if text.count(old) != 1:
              raise SystemExit('test import marker changed')
          text = text.replace(old, new, 1)

          marker = '''    def test_cli_validates_record_and_reports_safety_state(self) -> None:
          '''
          method = '''    def test_parsed_json_uses_strict_schema_types(self) -> None:
              record = self.reconstruction()

              def rehash(raw: dict[str, object]) -> dict[str, object]:
                  raw["migration_id"] = sha256_id(
                      {
                          key: value
                          for key, value in raw.items()
                          if key != "migration_id"
                      }
                  )
                  return raw

              for field in (
                  "forward_clock_reset",
                  "successor_provenance_complete",
                  "capital_authorization_carried_forward",
                  "live_ready",
                  "real_leverage_authorized",
                  "exchange_submission_available",
              ):
                  with self.subTest(field=field):
                      raw = record.to_dict()
                      raw[field] = 1 if raw[field] is True else 0
                      with self.assertRaises(ContractError):
                          parse_strategy_migration(rehash(raw))

              raw = record.to_dict()
              raw["inherited_parameters"] = []
              with self.assertRaises(ContractError):
                  parse_strategy_migration(rehash(raw))

              raw = record.to_dict()
              raw["source_audits"] = {"docs/audit.json": 7}
              with self.assertRaises(ContractError):
                  parse_strategy_migration(rehash(raw))

              raw = record.to_dict()
              raw["migration_kind"] = []
              with self.assertRaises(ContractError):
                  parse_strategy_migration(rehash(raw))

          '''
          if text.count(marker) != 1:
              raise SystemExit('strict type test insertion marker changed')
          tests.write_text(text.replace(marker, method + marker, 1), encoding='utf-8')
          PY
          git diff --check
          PYTHONPATH=src python -m compileall -q src/finruntime tests/runtime
          PYTHONPATH=src python -m unittest discover -s tests/runtime -p 'test_*.py' -v
          python scripts/verify_runtime.py --contracts-only
          rm .github/workflows/agent-harden-migration-json-types.yml
          git config user.name 'OpenAI Agent'
          git config user.email 'agent@openai.com'
          git add -A
          git commit -m 'Enforce strict migration JSON types'
          git push origin HEAD:"$HEAD_REF"
