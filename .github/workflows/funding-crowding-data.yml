name: Funding crowding public source
on:
  push:
    branches: [research/funding-crowding-20260906]
    paths: [.github/workflows/funding-crowding-data.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r research/btc_flow/requirements.txt
      - run: python -m pytest -q tests/test_funding_crowding_data.py --junitxml=funding-tests.xml
      - name: Read-only official rates and published checksums
        run: python -m research.funding_crowding.data --out funding-data > download.log 2>&1 || { tail -n 100 download.log; exit 1; }
      - run: cat funding-data/audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: funding-crowding-source
          path: |
            funding-data/
            funding-tests.xml
            download.log
          retention-days: 90
