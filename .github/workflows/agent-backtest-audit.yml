name: Agent isolated backtest audit

on:
  push:
    branches: [agent/backtest-audit-20260801]
    paths:
      - 'research/agent_backtest_audit_20260801.py'
      - 'research/agent_backtest_ablations_20260801.py'
      - 'research/agent_dyn_ablations_20260801.py'
      - 'research/agent_ds_order_deadband_20260801.py'
      - '.github/workflows/agent-backtest-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/agent_backtest_audit_20260801.py'
      - 'research/agent_backtest_ablations_20260801.py'
      - 'research/agent_dyn_ablations_20260801.py'
      - 'research/agent_ds_order_deadband_20260801.py'
      - '.github/workflows/agent-backtest-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile audit and strategy modules
        run: |
          python -m compileall -q \
            research/agent_backtest_audit_20260801.py \
            src/finruntime/observability \
            src/finruntime/strategies

      - name: Run relevant deterministic tests
        run: |
          python -m unittest discover -s tests/runtime -p 'test_backtests.py' -v
          python -m unittest discover -s tests/runtime -p 'test_ds40180_t50c3_paper.py' -v

      - name: Run Atlas, DYN-IV113 and DS-40/180 audits
        run: |
          mkdir -p audit-results
          python research/agent_backtest_audit_20260801.py \
            --suite core \
            --output audit-results/core.json

      - name: Upload core audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-backtest-core-20260801
          path: audit-results/core.json
          if-no-files-found: warn
          retention-days: 14

  factor-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run public factor replays
        run: |
          mkdir -p audit-results
          python research/agent_backtest_audit_20260801.py \
            --suite factors \
            --output audit-results/factors.json

      - name: Upload factor audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-backtest-factors-20260801
          path: audit-results/factors.json
          if-no-files-found: warn
          retention-days: 14

  ablation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile ablation harness
        run: python -m compileall -q research/agent_backtest_ablations_20260801.py

      - name: Run DYN-IV113 and DS-40/180 ablations
        run: |
          mkdir -p audit-results
          python research/agent_backtest_ablations_20260801.py \
            --output audit-results/ablations.json

      - name: Upload ablation audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-backtest-ablations-20260801
          path: audit-results/ablations.json
          if-no-files-found: warn
          retention-days: 14

  dyn-ablation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run corrected DYN-IV113 ablations
        run: |
          mkdir -p audit-results
          python research/agent_dyn_ablations_20260801.py \
            --output audit-results/dyn-ablations.json

      - name: Upload DYN audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-dyn-ablations-20260801
          path: audit-results/dyn-ablations.json
          if-no-files-found: warn
          retention-days: 14

  ds-deadband-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run DS order-level deadband audit
        run: |
          mkdir -p audit-results
          python research/agent_ds_order_deadband_20260801.py \
            --output audit-results/ds-deadband.json

      - name: Upload DS deadband audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-ds-deadband-20260801
          path: audit-results/ds-deadband.json
          if-no-files-found: warn
          retention-days: 14
