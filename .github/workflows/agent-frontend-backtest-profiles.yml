name: Apply frontend backtest profiles

on:
  push:
    branches: [agent/frontend-backtest-profiles]
    paths:
      - 'frontend/backtest-profiles.js'
      - 'frontend/backtest-profiles.css'
      - 'scripts/apply_frontend_backtest_profiles.py'
      - '.github/workflows/agent-frontend-backtest-profiles.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/backtest-profiles.js'
      - 'frontend/backtest-profiles.css'
      - 'scripts/apply_frontend_backtest_profiles.py'
      - '.github/workflows/agent-frontend-backtest-profiles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontend-backtest-profiles
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply, validate and publish frontend diff
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/apply_frontend_backtest_profiles.py
          rm scripts/apply_frontend_backtest_profiles.py
          git diff --check
          python -m unittest discover -s tests/frontend -p 'test_*.py' -v
          node --check frontend/live.js
          node --check frontend/backtest-profiles.js
          ! grep -R -E 'https?://(cdn|unpkg|jsdelivr)' frontend
          ! grep -R -E 'submit_order|create_order|/api/v1/orders' frontend
          git config user.name 'OpenAI Agent'
          git config user.email 'openai-agent@users.noreply.github.com'
          git add -A
          git commit -m 'Expose backtest profiles in Strategy Hub'
          git push origin HEAD:agent/frontend-backtest-profiles
