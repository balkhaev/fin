name: Audit V28 provenance closure

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/agent-runtime-v28-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify direct archive and inspect dependency closure
        run: |
          set -euxo pipefail
          python research/active_v26_v28/verify_archive.py
          python - <<'PY'
          from __future__ import annotations

          import ast
          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path

          ROOT = Path.cwd()
          BASE = ROOT / 'research/active_v26_v28'
          DIRECT = (
              'v28_exact8h_engine.py',
              'v28_run_research.py',
              'v28_frozen_candidate.json',
              'v28_summary.json',
              'v26_v27_compact_evidence.json',
              'delivery_basis_rejection.json',
              'verify_archive.py',
          )
          DEPENDENCY_BASENAMES = (
              'inputs.py',
              'signals.py',
              'engine.py',
              'execution_policy.py',
              'v35_funding_carry.py',
              'v36_cash_carry.py',
              'v50_exact8h_audit.py',
              'v43_exact8h_fast.py',
              'run_research.py',
          )

          def run(*args: str) -> str:
              return subprocess.check_output(args, cwd=ROOT, text=True).strip()

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          direct = {}
          for name in DIRECT:
              path = BASE / name
              direct[name] = {
                  'bytes': path.stat().st_size,
                  'sha256': sha256(path),
                  'git_blob_sha': run('git', 'hash-object', str(path)),
              }

          tree_paths = run(
              'git', 'ls-tree', '-r', '--name-only', 'HEAD', '--',
              'research/active_v26_v28'
          ).splitlines()

          object_lines = run('git', 'rev-list', '--objects', '--all').splitlines()
          path_rows = []
          for line in object_lines:
              sha, separator, path = line.partition(' ')
              if separator:
                  path_rows.append((sha, path))

          dependency_candidates = {}
          for basename in DEPENDENCY_BASENAMES:
              rows = []
              seen = set()
              for blob_sha, path in path_rows:
                  if Path(path).name != basename:
                      continue
                  key = (blob_sha, path)
                  if key in seen:
                      continue
                  seen.add(key)
                  try:
                      payload = subprocess.check_output(
                          ['git', 'cat-file', 'blob', blob_sha], cwd=ROOT
                      )
                  except subprocess.CalledProcessError:
                      continue
                  rows.append(
                      {
                          'path': path,
                          'git_blob_sha': blob_sha,
                          'bytes': len(payload),
                          'sha256': hashlib.sha256(payload).hexdigest(),
                      }
                  )
              dependency_candidates[basename] = sorted(
                  rows, key=lambda row: (row['path'], row['git_blob_sha'])
              )[:100]

          source_details = {}
          for name in ('v28_exact8h_engine.py', 'v28_run_research.py'):
              text = (BASE / name).read_text(encoding='utf-8')
              tree = ast.parse(text)
              imports = []
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imports.extend(alias.name for alias in node.names)
                  elif isinstance(node, ast.ImportFrom):
                      imports.append(node.module or '')
              source_details[name] = {
                  'imports': sorted(set(imports)),
                  'absolute_mnt_data_literals': sorted(
                      set(re.findall(r"['\"](/mnt/data[^'\"]*)['\"]", text))
                  ),
                  'sys_path_mutations': [
                      line.strip()
                      for line in text.splitlines()
                      if 'sys.path' in line
                  ],
              }

          fixture_hints = []
          for blob_sha, path in path_rows:
              lowered = path.lower()
              if 'v28' not in lowered:
                  continue
              if not any(
                  token in lowered
                  for token in (
                      'target', 'weight', 'equity', 'account', 'metric',
                      'summary', 'candidate', 'bootstrap', 'result'
                  )
              ):
                  continue
              fixture_hints.append({'path': path, 'git_blob_sha': blob_sha})
          fixture_hints = sorted(
              { (row['path'], row['git_blob_sha']) for row in fixture_hints }
          )

          report = {
              'schema_version': '1.0',
              'repository': 'balkhaev/fin',
              'head_commit': run('git', 'rev-parse', 'HEAD'),
              'direct_archive_files': direct,
              'active_v26_v28_tree_paths': tree_paths,
              'source_details': source_details,
              'dependency_candidates_by_basename': dependency_candidates,
              'fixture_path_hints': [
                  {'path': path, 'git_blob_sha': blob_sha}
                  for path, blob_sha in fixture_hints[:300]
              ],
              'closure_complete': False,
          }
          print(json.dumps(report, indent=2, ensure_ascii=False, allow_nan=False))
          PY
