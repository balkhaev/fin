name: BTC Pressure one-account validation
on:
  push:
    branches: [research/btc-pressure-account-replay, main]
    paths:
      - research/btc_pressure/**
      - tests/test_btc_pressure*.py
      - .github/workflows/btc-pressure-account-validation.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btc-pressure-account-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . -r research/btc_flow/requirements.txt -r research/btc_pressure/requirements-event.txt scipy
      - name: Verify exact tested source, including unchanged signal engine
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          for name in ('account_source_lock.json','event_source_lock.json'):
              for path,want in json.loads(pathlib.Path('research/btc_pressure',name).read_text()).items():
                  assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==want,path
          PY
      - name: BTC Pressure and account regression tests
        run: python -m pytest -q tests/test_btc_pressure.py tests/test_btc_pressure_audit.py tests/test_btc_pressure_account.py --junitxml=account-tests.xml > account-tests.log 2>&1
      - name: Full root repository suite
        run: python -m pytest -q tests --junitxml=full-tests.xml > full-tests.log 2>&1
      - name: Download all 24 frozen public sources again
        run: python -m research.btc_pressure.download_account_samples --out account-data
      - name: Reproduce 20 one-account scenarios, no exchange orders
        run: python -m research.btc_pressure.account_study --data account-data --out account-report > account-replay.log 2>&1
      - name: Compare all balances and every order/fill ledger
        run: |
          python - <<'PY'
          import hashlib,json,math,pathlib
          p=pathlib.Path
          expected=json.loads(p('research/btc_pressure/account_summary.json').read_text())
          actual=json.loads(p('account-report/results.json').read_text())
          digest=lambda x:hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          assert actual['source_sha256']==expected['source_sha256']
          assert digest(actual)==expected['canonical_results_sha256']
          ledgers=[]
          for want in expected['sessions']:
              got=next(r for r in actual['sessions'] if r['date']==want['date'] and r['scenario']==want['scenario'])
              for key,value in want.items():
                  if isinstance(value,bool) or isinstance(value,str):assert got[key]==value
                  else:assert math.isclose(got[key],value,abs_tol=1e-9),(key,got[key],value)
              report=json.loads(p(f"account-report/{want['date']}_{want['scenario']}_report.json").read_text())
              assert report['ledger_reconciled'] and not report['live_ready']
              assert report['annual_return_pct'] is None
              ledgers.append({k:report[k] for k in ('date','scenario','closed_trades','events')})
          assert digest(ledgers)==expected['order_and_trade_ledgers_sha256']
          assert sum(x['input_records'] for x in actual['data_audit'])==expected['source_records']
          assert [x['raw_signals'] for x in actual['data_audit']]==expected['raw_signals_by_day']
          assert actual['continuous_days']==1 and actual['observed_sample_days']==4
          assert actual['target_achieved'] is False and actual['cagr_pct'] is None
          print('All 20 scenarios and complete order/fill ledgers reproduced. Profitability target did NOT pass.')
          PY
      - name: Bundle tested implementation and reports without large vendor tapes
        if: always()
        run: |
          mkdir -p account-delivery/research account-delivery/tests
          cp -r research/btc_pressure account-delivery/research/
          cp tests/test_btc_pressure*.py account-delivery/tests/
          find account-delivery -type d -name __pycache__ -prune -exec rm -rf '{}' +
          git rev-parse HEAD > account-delivery/TESTED_COMMIT.txt
          cp account-data/manifest.json account-delivery/SOURCE_MANIFEST.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-pressure-account-verified
          path: |
            account-delivery/
            account-report/
            account-tests.xml
            account-tests.log
            full-tests.xml
            full-tests.log
            account-replay.log
          retention-days: 90
