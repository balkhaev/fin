name: Guard evidence and table review
on:
  push:
    branches: [research/funding-crowding-20260906]
    paths:
      - .github/workflows/guard-evidence-review.yml
      - research/guard_execution_audit/verified_summary.json
      - research/guard_execution_audit/cadence_comparison.csv
      - research/guard_execution_audit/budget_comparison.csv
      - research/guard_execution_audit/README_RU.md
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: guard-evidence-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34030758810
          name: guard-execution-evidence
          path: package/original
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34030758810
          name: guard-execution-reproduction
          path: package/proofs/initial
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34030984895
          name: guard-budget-followup-evidence
          path: package/budget
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34030984895
          name: guard-budget-followup-reproduction
          path: package/proofs/budget
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34031202441
          name: guard25-robustness-evidence
          path: package/candidate
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34031202441
          name: guard25-robustness-reproduction
          path: package/proofs/candidate
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34030533921
          name: funding-crowding-source
          path: package/funding_source
      - name: Compare every compact table number and primary summary against original evidence
        run: |
          python - <<'PY'
          import csv,json,math,hashlib,pathlib,io
          p=pathlib.Path
          digest=lambda x:hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          original=json.loads(p('package/original/report/results.json').read_text())
          budget=json.loads(p('package/budget/report/results.json').read_text())
          candidate=json.loads(p('package/candidate/report/results.json').read_text())
          s=json.loads(p('research/guard_execution_audit/verified_summary.json').read_text())
          for name,result in [('cadence',original),('budget',budget),('candidate',candidate)]:
              assert digest(result)==s['hashes'][name+'_result'],name
              assert result['ledger_sha256']==s['hashes'][name+'_ledger']
          maps={'full_CAGR_pct':('full','cagr_pct'),'full_close_DD_pct':('full','max_close_drawdown_pct'),
                'later_return_pct':('later','return_pct'),'later_close_DD_pct':('later','max_close_drawdown_pct'),
                'later_fills':('later','order_fills'),'later_double_cost_return_pct':('later_double_costs','return_pct'),
                'later_delay_return_pct':('later_delay','return_pct'),'later_OKX_return_pct':('later_okx','return_pct'),
                'full_accounting_complete':('full','accounting_complete')}
          problems=[];checked=0
          def check(key,actual,declared):
              global checked
              checked+=1
              if isinstance(actual,bool) or actual is None:good=actual==declared
              else:good=declared is not None and math.isclose(float(actual),float(declared),rel_tol=1e-11,abs_tol=1e-9)
              if not good:problems.append(dict(field=key,actual=actual,declared=declared))
          def parse(text):
              if text=='':return None
              if text in ('true','false'):return text=='true'
              return float(text)
          for label,result,idcol in [('cadence',original,'policy'),('budget',budget,'allocation')]:
              path=p('research/guard_execution_audit',label+'_comparison.csv')
              with path.open() as f:table=list(csv.DictReader(f))
              assert len(table)==(16 if label=='cadence' else 12)
              reference=[]
              for entry in table:
                  identity=entry[idcol] if idcol=='policy' else float(entry[idcol]);freq=int(entry['cadence_days'])
                  rows={r['period']:r for r in result['rows'] if r[idcol]==identity and r['cadence_days']==freq and r['period']!='start365'}
                  actual={idcol:identity,'cadence_days':freq}
                  for field,(period,key) in maps.items():
                      actual[field]=rows[period][key]
                      check(f'{label}.{identity}.{freq}.{field}',actual[field],parse(entry[field]))
                  reference.append(actual)
              stream=io.StringIO();writer=csv.DictWriter(stream,fieldnames=list(table[0]));writer.writeheader()
              for r in reference:writer.writerow({k:('true' if v is True else 'false' if v is False else '' if v is None else v) for k,v in r.items()})
              p('package',label+'_reference.csv').write_text(stream.getvalue())
              print(label.upper()+'_EXACT_REFERENCE\n'+stream.getvalue())
          cp=s['post_result_candidate']
          for period in ('full','later'):
              r=next(x for x in candidate['rows'] if x['case']==period and x['excluded'] is None)
              for suffix,key in [('return_pct','return_pct'),('CAGR_pct','cagr_pct'),('close_DD_pct','max_close_drawdown_pct'),
                  ('worst365_pct','worst_rolling_365_pct'),('fills','order_fills'),('rebalance_days','rebalance_days'),
                  ('closed_asset_positions','closed_asset_positions'),('fees','fees'),('positive_months','positive_months'),
                  ('zero_months','zero_months'),('negative_months','negative_months')]:
                  check('candidate.'+period+'_'+suffix,r[key],cp[period+'_'+suffix])
          r=next(x for x in candidate['rows'] if x['case']=='full')
          for declared in cp['annual_segments']:
              actual=next(x for x in r['annual'] if x['year']==declared['year'])
              check('year'+str(declared['year']),actual['return_pct'],declared['return_pct'])
          for declared in cp['stress']:
              actual=next(x for x in candidate['rows'] if x['case']==declared['case'])
              for dk,ak in [('return_pct','return_pct'),('CAGR_pct','cagr_pct'),('close_DD_pct','max_close_drawdown_pct')]:
                  if dk in declared:check(declared['case']+'.'+dk,actual[ak],declared[dk])
          coverage={label:dict(reports=len(r['rows']),complete=sum(x['accounting_complete'] for x in r['rows']))
                    for label,r in [('initial',original),('budget',budget),('candidate',candidate)]}
          report=dict(comparisons=checked,failures=problems,source_hashes_verified=True,
              original_report_counts=coverage,all_tables_and_candidate_summary_reconciled=not problems,
              no_new_trading_simulation=True,independent_market_evidence=False)
          p('package/EVIDENCE_REVIEW.json').write_text(json.dumps(report,indent=2))
          print('EVIDENCE_REVIEW',json.dumps(report))
          assert not problems,'Repository transcription needs correction; computed artifacts unchanged'
          PY
      - name: Include current reusable code and reports without modifying original evidence
        if: always()
        run: |
          mkdir -p package/current_code/research package/current_code/tests
          cp -r research/guard_execution_audit research/guard_execution_checks research/funding_crowding research/annual_rotation research/rotation_stability research/rotation_venue_transfer package/current_code/research/
          cp tests/test_guard_execution_audit.py tests/test_funding_crowding_data.py package/current_code/tests/
          cp research/btc_flow/requirements.txt package/current_code/requirements.txt
          cp research/guard_execution_audit/README_RU.md package/REPORT_RU.md
          git rev-parse HEAD > package/REVIEWED_COMMIT.txt
          find package -type d -name __pycache__ -prune -exec rm -rf '{}' +
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard-execution-complete-package
          path: package/
          retention-days: 90
