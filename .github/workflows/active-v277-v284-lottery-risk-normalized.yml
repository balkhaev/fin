name: Active V277-V284 exact low-skew risk-normalized validation

on:
  push:
    branches: [agent/active-v277-v284-lottery-risk-normalized]
    paths:
      - 'research/active_v277_v284/**'
      - '.github/workflows/active-v277-v284-lottery-risk-normalized.yml'
  pull_request:
    branches: [agent/active-v269-v276-lottery-quality]
    paths:
      - 'research/active_v277_v284/**'
      - '.github/workflows/active-v277-v284-lottery-risk-normalized.yml'
  workflow_dispatch:

concurrency:
  group: active-v277-v284-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/active-v277-v284-lottery-risk-normalized

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install, compile and causal self-test
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r research/active_v277_v284/requirements.txt
          python -m compileall -q \
            research/active_v277_v284 \
            research/active_v269_v276 \
            research/active_v253_v260 \
            research/active_v9
          python research/active_v277_v284/run_research.py --self-test

      - name: Restore immutable V9 public archive cache
        uses: actions/cache@v4
        with:
          path: .cache/v9
          key: binance-usdm-daily-fixed-universe-2020-2026-v9

      - name: Run exact-policy development reproof and guarded OOS
        run: |
          set -euxo pipefail
          rm -rf research/active_v277_v284/results \
                 research/active_v277_v284/MANIFEST.json \
                 docs/checkpoints/v284
          python research/active_v277_v284/run_research.py \
            --root research/active_v277_v284 \
            --cache .cache/v9 \
            2>&1 | tee research/active_v277_v284/run.log

      - name: Materialize V284 checkpoint
        run: |
          set -euxo pipefail
          test -s research/active_v277_v284/results/summary.json
          test -s research/active_v277_v284/results/FROZEN_DECISION.json
          test -s research/active_v277_v284/results/coverage_gate.json
          test -s research/active_v277_v284/results/selection_proof_before_oos.json
          test -s research/active_v277_v284/results/REPORT_RU.md
          mkdir -p docs/checkpoints/v284
          cp research/active_v277_v284/results/summary.json docs/checkpoints/v284/CHECKPOINT_V284.json
          cp research/active_v277_v284/results/REPORT_RU.md docs/checkpoints/v284/RESEARCH_CHECKPOINT_V284_RU.md
          if test -s research/active_v277_v284/results/ANNUAL_RETURNS.csv; then
            cp research/active_v277_v284/results/ANNUAL_RETURNS.csv docs/checkpoints/v284/ANNUAL_RETURNS.csv
          fi

      - name: Verify chronology and safety
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/active_v277_v284')
          summary = json.loads((root / 'results/summary.json').read_text())
          proof = json.loads((root / 'results/selection_proof_before_oos.json').read_text())
          if not proof.get('selection_not_run'):
              assert proof['selection_uses_2024'] is False
              assert proof['selection_uses_2025'] is False
              assert proof['selection_uses_2026'] is False
              assert proof['neighboring_scales_tested'] == 0
              assert proof['frozen_target_gross'] == 0.45
          assert summary['integration_permitted'] is False
          assert summary['live_ready'] is False
          assert summary['real_leverage_authorized'] is False
          assert summary['profitability_proven'] is False
          print(json.dumps(summary, indent=2))
          PY
          find research/active_v277_v284 docs/checkpoints/v284 -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find research/active_v277_v284 docs/checkpoints/v284 -type f -name '*.pyc' -delete || true

      - name: Commit readable source and frozen decision
        if: github.event_name != 'pull_request'
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A research/active_v277_v284 docs/checkpoints/v284
          if git diff --cached --quiet; then
            echo 'No V277-V284 changes'
          else
            git commit -m 'Archive V277-V284 exact low-skew OOS evidence [skip ci]'
            git push origin HEAD:agent/active-v277-v284-lottery-risk-normalized
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-v277-v284-lottery-risk-normalized
          path: |
            research/active_v277_v284/results
            research/active_v277_v284/run.log
            docs/checkpoints/v284
          if-no-files-found: warn
          retention-days: 30
