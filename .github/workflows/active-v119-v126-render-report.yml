name: Render Active V119-V126 report

on:
  push:
    branches: [agent/active-v119-v126-robust-trident]
    paths:
      - "research/active_v119_v126/render_report.py"
      - ".github/workflows/active-v119-v126-render-report.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/active-v119-v126-robust-trident
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'pandas>=2.2,<3'
      - name: Render report
        run: |
          set -euxo pipefail
          test -s research/active_v119_v126/results/summary.json
          test -s research/active_v119_v126/results/v126_yearly.csv
          test -s research/active_v119_v126/results/paired_bootstrap.csv
          python research/active_v119_v126/render_report.py
          test -s research/active_v119_v126/REPORT_RU.md
      - name: Commit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/active_v119_v126/REPORT_RU.md
          git commit -m "Document Active V119-V126 result [skip ci]"
          git push origin HEAD:agent/active-v119-v126-robust-trident
