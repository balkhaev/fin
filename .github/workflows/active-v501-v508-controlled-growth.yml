name: Active V501-V508 controlled growth engine

on:
  push:
    branches: [agent/active-v501-v508-controlled-growth]
    paths:
      - 'research/controlled_growth_v501_v508/**'
      - '.github/workflows/active-v501-v508-controlled-growth.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/controlled_growth_v501_v508/**'
      - '.github/workflows/active-v501-v508-controlled-growth.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: active-v501-v508-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/active-v501-v508-controlled-growth

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize exact pinned fixed-universe engine
        run: |
          set -euxo pipefail
          git archive 751b519d74d10f58ee4433783f6d9abd38d1d148 \
            research/active_v9 research/active_v253_v260 | tar -x
          test -s research/active_v9/data.py
          test -s research/active_v9/market.py
          test -s research/active_v253_v260/run_research.py
          echo 'e349fa80c2d75db5d9ec0bcd0ac4c3e8333c031d  research/active_v9/data.py' | sha256sum -c -
          echo 'c8c7f4c598779f49ae01c80bb5baf39cb48267fb  research/active_v9/market.py' | sha256sum -c -
          echo '0a6ff050727f7fd4df61568a6b0f52ac84e1ddaf  research/active_v253_v260/run_research.py' | sha256sum -c -

      - name: Install, compile and causal self-test
        run: |
          set -euxo pipefail
          python -m pip install --retries 3 --timeout 30 \
            -r research/controlled_growth_v501_v508/requirements.txt
          python -m compileall -q \
            research/controlled_growth_v501_v508 \
            research/active_v9 \
            research/active_v253_v260
          python research/controlled_growth_v501_v508/run_research.py --self-test

      - name: Restore immutable Binance public archive cache
        uses: actions/cache@v4
        with:
          path: .cache/v9
          key: binance-usdm-daily-fixed-universe-2020-2026-v9

      - name: Run frozen controlled-growth research
        run: |
          set -euxo pipefail
          rm -rf research/controlled_growth_v501_v508/results \
                 research/controlled_growth_v501_v508/MANIFEST.json \
                 docs/checkpoints/v508
          python research/controlled_growth_v501_v508/run_research.py \
            --root research/controlled_growth_v501_v508 \
            --cache .cache/v9 \
            --state research/market_state_v413_v420/results/market_state_daily.csv \
            2>&1 | tee research/controlled_growth_v501_v508/run.log

      - name: Materialize and verify V508 evidence
        run: |
          set -euxo pipefail
          test -s research/controlled_growth_v501_v508/results/summary.json
          test -s research/controlled_growth_v501_v508/results/FROZEN_DECISION.json
          test -s research/controlled_growth_v501_v508/results/selection_proof_before_oos.json
          test -s research/controlled_growth_v501_v508/results/development_ranking.csv
          test -s research/controlled_growth_v501_v508/results/audit_metrics.csv
          test -s research/controlled_growth_v501_v508/results/REPORT_RU.md
          mkdir -p docs/checkpoints/v508
          cp research/controlled_growth_v501_v508/results/summary.json \
             docs/checkpoints/v508/CHECKPOINT_V508.json
          cp research/controlled_growth_v501_v508/results/REPORT_RU.md \
             docs/checkpoints/v508/RESEARCH_CHECKPOINT_V508_RU.md
          cp research/controlled_growth_v501_v508/results/ANNUAL_RETURNS.csv \
             docs/checkpoints/v508/ANNUAL_RETURNS.csv
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research/controlled_growth_v501_v508/results')
          summary=json.loads((root/'summary.json').read_text())
          proof=json.loads((root/'selection_proof_before_oos.json').read_text())
          assert proof['selection_uses_2024'] is False
          assert proof['selection_uses_2025'] is False
          assert proof['selection_uses_2026'] is False
          assert summary['integration_permitted'] is False
          assert summary['capital_change_authorized'] is False
          assert summary['live_ready'] is False
          assert summary['real_leverage_authorized'] is False
          assert summary['profitability_proven'] is False
          print(json.dumps(summary, indent=2))
          PY

      - name: Remove transient pinned dependencies
        run: |
          rm -rf research/active_v9 research/active_v253_v260
          find research/controlled_growth_v501_v508 docs/checkpoints/v508 \
            -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find research/controlled_growth_v501_v508 docs/checkpoints/v508 \
            -type f -name '*.pyc' -delete || true

      - name: Commit readable evidence
        if: github.event_name != 'pull_request'
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/controlled_growth_v501_v508 docs/checkpoints/v508
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No V501-V508 changes'
          else
            git commit -m 'Add V501-V508 controlled growth results [skip ci]'
            git push origin HEAD:agent/active-v501-v508-controlled-growth
          fi

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-v501-v508-controlled-growth
          path: |
            research/controlled_growth_v501_v508/results
            research/controlled_growth_v501_v508/run.log
            docs/checkpoints/v508
          if-no-files-found: warn
          retention-days: 30
