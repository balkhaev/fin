name: Annual rotation data and incumbent audit
on:
  push:
    branches: [research/annual-target-rotation]
    paths: [.github/workflows/annual-rotation-data.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r research/btc_pressure/requirements-event.txt
      - name: Complete fixed-cohort public data, no exchange credentials
        run: python -m research.annual_rotation.data --out rotation-data
      - name: Recompute the historical incumbent without inheriting its returns
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,shutil,contextlib,traceback
          from research.v75_tristate_guard_v517_v524 import run_research as old
          root=pathlib.Path('incumbent-audit');root.mkdir()
          source=None
          for p in pathlib.Path('research').rglob('*.csv'):
              if p.stat().st_size<2000000 and hashlib.sha256(p.read_bytes()).hexdigest()==old.EXPECTED_V75_SHA256:
                  source=p;break
          if source is None:
              (root/'status.json').write_text(json.dumps({'recomputed':False,'reason':'Hash-pinned V75 source not found'}))
          else:
              shutil.copy(source,root/'v75_input.csv')
              shutil.copytree(pathlib.Path(old.__file__).parent,root/'source')
              with (root/'recompute.log').open('w') as stream,contextlib.redirect_stdout(stream):
                  old.self_test()
                  old.run(source,pathlib.Path(old.__file__).with_name('V517_V524_DESIGN.json'),root/'recomputed')
              (root/'status.json').write_text(json.dumps({'recomputed':True,'source_path':str(source),'account_level_only':True,'live_ready':False}))
              print((root/'recomputed/summary.json').read_text())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: annual-rotation-fixed-data
          path: |
            rotation-data/
            incumbent-audit/
            research/annual_rotation/data.py
            research/annual_rotation/protocol.json
          retention-days: 90
