name: Active V163 current funding dislocation probe

on:
  push:
    branches: [agent/active-v163-v170-funding-evidence]
    paths:
      - 'research/active_v163_v170/**'
      - '.github/workflows/active-v163-current-probe.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/active_v163_v170/**'
      - '.github/workflows/active-v163-current-probe.yml'
  workflow_dispatch:

concurrency:
  group: active-v163-current-probe-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/active-v163-v170-funding-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install funding router and compile probe
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e services/funding_router
          python -m py_compile research/active_v163_v170/current_probe.py
          funding-router --config research/active_v163_v170/scan_config.toml validate
      - name: Run one public scan
        run: |
          rm -rf research/active_v163_v170/probe_results
          mkdir -p research/active_v163_v170/probe_results
          python research/active_v163_v170/current_probe.py \
            --config research/active_v163_v170/scan_config.toml \
            --output research/active_v163_v170/probe_results \
            2>&1 | tee research/active_v163_v170/probe_results/run.log
      - name: Validate evidence
        run: |
          test -s research/active_v163_v170/probe_results/summary.json
          test -s research/active_v163_v170/probe_results/snapshots.json
          test -s research/active_v163_v170/probe_results/MANIFEST.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research/active_v163_v170/probe_results')
          summary=json.loads((root/'summary.json').read_text())
          assert summary['live_ready'] is False
          assert summary['real_leverage_authorized'] is False
          assert summary['profitability_proven'] is False
          print(json.dumps(summary,indent=2))
          PY
          find research/active_v163_v170 -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find research/active_v163_v170 -type f -name '*.pyc' -delete || true
      - name: Commit direct probe evidence
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/active_v163_v170/probe_results
          if git diff --cached --quiet; then
            echo 'No probe changes'
          else
            git commit -m 'Record V163 current funding probe [skip ci]'
            git push origin HEAD:agent/active-v163-v170-funding-evidence
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-v163-current-funding-probe
          path: research/active_v163_v170/probe_results
          if-no-files-found: warn
          retention-days: 30
