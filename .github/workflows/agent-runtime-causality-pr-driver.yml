name: Apply runtime causality patch from PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/agent-runtime-causality-patch.yml'
      - '.github/workflows/agent-runtime-causality-pr-driver.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and validate reviewed runtime changes
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/agent-runtime-causality-patch.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "cat >/tmp/runtime-causality.patch <<'PATCH'" in line)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PATCH')
          indent = len(lines[start]) - len(lines[start].lstrip())
          payload = []
          for line in lines[start + 1:end]:
              payload.append(line[indent:] if line.startswith(' ' * indent) else line)
          Path('/tmp/runtime-causality.patch').write_text('\n'.join(payload) + '\n', encoding='utf-8')

          transform = Path('.github/apply_runtime_causality.py')
          text = transform.read_text(encoding='utf-8')
          old = "replace_once(\n    ACCOUNTING,\n    '''        as_of_utc=as_of_utc,\n''',\n    '''        as_of_utc=normalized_as_of,\n''',\n)"
          new = "replace_once(\n    ACCOUNTING,\n    '''    return PaperAccountState.create(\n        strategy_id=state.strategy_id,\n        sequence=state.sequence + sequence_increment,\n        as_of_utc=as_of_utc,\n''',\n    '''    return PaperAccountState.create(\n        strategy_id=state.strategy_id,\n        sequence=state.sequence + sequence_increment,\n        as_of_utc=normalized_as_of,\n''',\n)"
          if text.count(old) != 1:
              raise SystemExit('account rebuild transformation marker changed')
          transform.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git apply --recount \
            --include='src/finruntime/models.py' \
            --include='src/finruntime/execution/paper_cycle.py' \
            --include='src/finruntime/execution/paper_broker.py' \
            --include='schemas/runtime/market_snapshot.schema.json' \
            --include='tests/runtime/test_journal.py' \
            /tmp/runtime-causality.patch
          python .github/apply_runtime_causality.py
          python - <<'PY'
          from pathlib import Path

          lifecycle = Path('src/finruntime/portfolio/lifecycle.py')
          text = lifecycle.read_text(encoding='utf-8')
          old = '''from finruntime.canonical import parse_utc, require_sha256
          from finruntime.portfolio.accounting import AccountingHalt, PaperAccountState
          '''
          new = '''from finruntime.canonical import parse_utc, require_sha256
          from finruntime.portfolio.accounting import PaperAccountState
          '''
          if text.count(old) != 1:
              raise SystemExit('lifecycle import marker changed')
          text = text.replace(old, new, 1)
          old = '''    state.validate()
              if parse_utc(as_of_utc) < parse_utc(state.as_of_utc):
                  raise AccountingHalt("paper plan activation cannot move account time backward")
              plan_id = require_sha256(plan_id, field="plan_id")
              if state.last_plan_id == plan_id:
                  return state
              return PaperAccountState.create(
          '''
          new = '''    state.validate()
              plan_id = require_sha256(plan_id, field="plan_id")
              if state.last_plan_id == plan_id:
                  return state
              effective_as_of = (
                  state.as_of_utc
                  if parse_utc(as_of_utc) < parse_utc(state.as_of_utc)
                  else as_of_utc
              )
              return PaperAccountState.create(
          '''
          if text.count(old) != 1:
              raise SystemExit('lifecycle activation marker changed')
          text = text.replace(old, new, 1)
          old = '        as_of_utc=as_of_utc,\n'
          new = '        as_of_utc=effective_as_of,\n'
          if text.count(old) != 1:
              raise SystemExit('lifecycle as-of marker changed')
          lifecycle.write_text(text.replace(old, new, 1), encoding='utf-8')

          journal = Path('src/finruntime/journal/atomic.py')
          text = journal.read_text(encoding='utf-8')
          old = '''            previous_time = last_time.get(strategy_id)
              if previous_time is not None and event_time < previous_time:
                  raise JournalCorruptionError(
                      f"journal event time moved backward on line {line_number}"
                  )
              last_sequence[strategy_id] = sequence
              last_time[strategy_id] = event_time

              cycle_key = (strategy_id, sequence)
          '''
          new = '''            last_sequence[strategy_id] = sequence
              if event_type in _RUNTIME_EVENT_PHASES or event_type == "HALT_CLEARED":
                  previous_time = last_time.get(strategy_id)
                  if previous_time is not None and event_time < previous_time:
                      raise JournalCorruptionError(
                          f"journal event time moved backward on line {line_number}"
                      )
                  last_time[strategy_id] = event_time

              cycle_key = (strategy_id, sequence)
          '''
          if text.count(old) != 1:
              raise SystemExit('journal chronology marker changed')
          journal.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          test -z "$(git ls-files -u)"
          git diff --check
          PYTHONPATH=src python -m compileall -q src/finruntime tests/runtime
          PYTHONPATH=src python -m unittest discover -s tests/runtime -p 'test_*.py' -v
          python scripts/verify_runtime.py --contracts-only
          rm .github/workflows/agent-runtime-causality-patch.yml
          rm .github/workflows/agent-runtime-causality-pr-driver.yml
          rm .github/apply_runtime_causality.py
          git config user.name 'OpenAI Agent'
          git config user.email 'agent@openai.com'
          git add -A
          git commit -m 'Add resumable paper progress and journal semantics'
          git push origin HEAD:"$HEAD_REF"
