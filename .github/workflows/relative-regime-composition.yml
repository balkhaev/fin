name: Relative regime composition
on:
  push:
    branches: [research/relative-futures-20260906]
    paths:
      - research/relative_portfolio/*.py
      - tests/test_pair_regime_composition.py
      - .github/workflows/relative-regime-composition.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -e . -r research/clock_phase/requirements.txt
      - name: Daily release-time tests and whole repository regression
        run: |
          python -m pytest -q tests/test_pair_regime_composition.py --junitxml=composition-tests.xml
          python -m pytest -q tests --junitxml=root-tests.xml > root-tests.log 2>&1 || { tail -n 100 root-tests.log; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34034392920
          name: relative-futures-reconciled-evidence
          path: base
      - name: Same signed cash engine, genuinely recomputed combined positions
        run: python -m research.relative_portfolio.study --source base --out report > composition.log 2>&1 || { tail -n 100 composition.log; exit 1; }
      - run: |
          cat composition.log
          tail -n 2 root-tests.log
      - name: Preserve tested composition and known-bug boundaries
        if: always()
        run: |
          mkdir -p delivery/research delivery/tests
          cp -r research/relative_portfolio delivery/research/
          cp tests/test_pair_regime_composition.py delivery/tests/
          git rev-parse HEAD > delivery/TESTED_COMMIT.txt
          find delivery -type d -name __pycache__ -prune -exec rm -rf '{}' +
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relative-regime-composition-evidence
          path: |
            report/
            delivery/
            composition.log
            composition-tests.xml
            root-tests.xml
            root-tests.log
          retention-days: 90
  reproduce:
    needs: study
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r research/btc_flow/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34034392920
          name: relative-futures-reconciled-evidence
          path: base
      - uses: actions/download-artifact@v4
        with: {name: relative-regime-composition-evidence, path: first}
      - run: python -m research.relative_portfolio.study --source base --out repeated > repeat.log 2>&1 || { tail -n 100 repeat.log; exit 1; }
      - name: Compare all41 numerical reports and164 financial files
        run: |
          python - <<'PY'
          import pathlib,json
          p=pathlib.Path
          assert json.loads(p('first/report/results.json').read_text())==json.loads(p('repeated/results.json').read_text())
          for suffix in ('_fills.csv','_funding.csv','_episodes.csv','_equity.csv.gz'):
              files=list(p('first/report').glob('*'+suffix));assert len(files)==41
              for f in files:assert f.read_bytes()==(p('repeated')/f.name).read_bytes(),f.name
          v=json.loads(p('repeated/verification.json').read_text());assert v['reports']==41
          v.update(all41reports_and164files_equal=True,independent_execution=True,
              independent_implementation=False,new_holdout=False,unpatched_account_defect=True,live_ready=False,local_execution=False)
          p('REPRODUCTION.json').write_text(json.dumps(v,indent=2));print(json.dumps(v))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relative-regime-composition-reproduction
          path: |
            REPRODUCTION.json
            repeated/comparison.csv
            repeated/annual.csv
            repeat.log
          retention-days: 90
