name: Legacy V87 handoff marker verification

on:
  push:
    branches: [agent/canonical-research-v87-handoff]
    paths:
      - '.bootstrap_v87/**'
      - '.bootstrap_v87b/**'
      - 'docs/checkpoints/v87/**'
      - '.github/workflows/canonical-v87-public.yml'
  pull_request:
    branches: [main]
    paths:
      - '.bootstrap_v87/**'
      - '.bootstrap_v87b/**'
      - 'docs/checkpoints/v87/**'
      - '.github/workflows/canonical-v87-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the committed V87 handoff markers
        run: |
          set -euxo pipefail
          test -s docs/checkpoints/v87/CANONICAL_REPOSITORY.md
          test -s docs/checkpoints/v87/HANDOFF_STATUS.md
          test -s docs/checkpoints/v87/PUBLISH_MARKER.md
          python - <<'PY'
          from pathlib import Path
          root=Path('docs/checkpoints/v87')
          joined='\n'.join(path.read_text(encoding='utf-8') for path in root.glob('*.md'))
          assert 'balkhaev/fin' in joined
          assert 'live_ready' in joined or 'live' in joined.lower()
          print('legacy V87 handoff markers are present')
          PY
      - name: Verify the superseding direct runtime is present
        run: |
          set -euxo pipefail
          test -s src/finruntime/models.py
          test -s src/finruntime/operations/cycle.py
          test -s src/finruntime/observability/control_room.py
          test -s scripts/verify_runtime.py
          test -s scripts/live_preflight.py
          python -m pip install --disable-pip-version-check -e .
          python scripts/verify_runtime.py --full
          python scripts/live_preflight.py --mode shadow --output /tmp/shadow-preflight.json
      - name: Explain the legacy boundary
        run: |
          cat <<'EOF'
          The original V87 workflow expected AGENTS.md, docs/HANDOFF.md and a direct
          research/active_v69_v76 tree that were never materialized in main. Those
          missing paths are not reconstructed or silently substituted here. The
          committed V87 marker is retained as historical evidence; current runtime
          correctness is verified by the direct finruntime/provenance contracts.
          EOF
