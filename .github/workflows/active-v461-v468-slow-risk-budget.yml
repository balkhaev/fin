name: Active V461-V468 slow market-risk budget

on:
  push:
    branches: [agent/active-v461-v468-slow-risk-budget]
    paths:
      - 'research/slow_risk_budget_v461_v468/**'
      - '.bootstrap_meta_v461_xz/**'
      - '.github/workflows/active-v461-v468-slow-risk-budget.yml'
  workflow_dispatch:

concurrency:
  group: active-v461-v468-slow-risk-budget
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/active-v461-v468-slow-risk-budget

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize exact verified source
        run: |
          set -euxo pipefail
          tr -d '\n\r' < .bootstrap_meta_v461_xz/run_research.py.xz.b64 > /tmp/run_research.py.xz.b64
          echo 'a05e56144af819444444659b2c8dfe80e7137a2009e01c21ecae2c8ce6d08db8  /tmp/run_research.py.xz.b64' | sha256sum -c -
          base64 -d /tmp/run_research.py.xz.b64 > /tmp/run_research.py.xz
          echo '83d50ec87f9446a970b406e039d3fa52efd6ea8beff970e809e1765dd93dcb14  /tmp/run_research.py.xz' | sha256sum -c -
          xz -dc /tmp/run_research.py.xz > research/slow_risk_budget_v461_v468/run_research.py
          echo 'ce8c7240e6f5887bdd046c865b08016026a92f033a580b2896232e885e07a198  research/slow_risk_budget_v461_v468/run_research.py' | sha256sum -c -
          echo '59c10dc2a0b05b39862d39172c5fc11841758591180ce76c1669001afe32fbed  research/meta_ensemble_v453_v460/run_research.py' | sha256sum -c -

      - name: Verify pinned inputs and frozen design
        run: |
          set -euxo pipefail
          test -s research/strategy_anatomy_v437_v444/results/joined_V285_LOW_SKEW_HOURLY_CONTROLLER.csv
          test -s research/strategy_anatomy_v437_v444/results/joined_V365_DOWNSIDE_VOL_COMPRESSION_ENSEMBLE.csv
          test -s research/meta_ensemble_v453_v460/results/summary.json
          test -s research/slow_risk_budget_v461_v468/V461_V468_DESIGN.json
          bad=$(find research/slow_risk_budget_v461_v468 -type f \( -name '*.zip' -o -name '*.b64' -o -name '*.pyfrag' \) -print || true)
          test -z "$bad"

      - name: Install, compile and causal self-test
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r research/slow_risk_budget_v461_v468/requirements.txt
          python -m py_compile research/slow_risk_budget_v461_v468/run_research.py
          python research/slow_risk_budget_v461_v468/run_research.py --self-test

      - name: Run frozen backtest
        run: |
          set -euxo pipefail
          rm -rf research/slow_risk_budget_v461_v468/results
          python research/slow_risk_budget_v461_v468/run_research.py \
            --v285 research/strategy_anatomy_v437_v444/results/joined_V285_LOW_SKEW_HOURLY_CONTROLLER.csv \
            --v365 research/strategy_anatomy_v437_v444/results/joined_V365_DOWNSIDE_VOL_COMPRESSION_ENSEMBLE.csv \
            --design research/slow_risk_budget_v461_v468/V461_V468_DESIGN.json \
            --output research/slow_risk_budget_v461_v468/results \
            2>&1 | tee research/slow_risk_budget_v461_v468/run.log

      - name: Verify frozen decision
        run: |
          set -euxo pipefail
          test -s research/slow_risk_budget_v461_v468/results/summary.json
          test -s research/slow_risk_budget_v461_v468/results/selection_proof_before_oos.json
          test -s research/slow_risk_budget_v461_v468/results/policy_development_ranking.csv
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('research/slow_risk_budget_v461_v468/results/summary.json').read_text())
          assert summary['integration_permitted'] is False
          assert summary['live_ready'] is False
          assert summary['real_leverage_authorized'] is False
          assert summary['profitability_proven'] is False
          assert summary['selection']['selection_uses_2024'] is False
          assert summary['selection']['selection_uses_2025'] is False
          assert summary['selection']['selection_uses_2026'] is False
          print(json.dumps(summary, indent=2))
          PY
          find research/slow_risk_budget_v461_v468 -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find research/slow_risk_budget_v461_v468 -type f -name '*.pyc' -delete || true

      - name: Commit readable source and results
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/slow_risk_budget_v461_v468
          git rm -r .bootstrap_meta_v461_xz
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Add V461-V468 slow risk-budget results [skip ci]'
            git push origin HEAD:agent/active-v461-v468-slow-risk-budget
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-v461-v468-slow-risk-budget
          path: research/slow_risk_budget_v461_v468
          if-no-files-found: warn
          retention-days: 30
