name: Active V40-V41 integrity

on:
  push:
    branches: [agent/active-v40-v41-archive]
    paths:
      - "research/active_v40_v41/**"
      - ".github/workflows/active-v40-v41-integrity.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/active_v40_v41/**"
      - ".github/workflows/active-v40-v41-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen rejection evidence
        run: python research/active_v40_v41/verify_archive.py
