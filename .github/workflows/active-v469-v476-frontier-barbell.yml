name: Active V469-V476 frontier barbell

on:
  push:
    branches: [agent/active-v469-v476-frontier-barbell]
    paths:
      - 'research/frontier_barbell_v469_v476/**'
      - '.bootstrap_meta_v469_xz/**'
      - '.github/workflows/active-v469-v476-frontier-barbell.yml'
  workflow_dispatch:

concurrency:
  group: active-v469-v476-frontier-barbell
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/active-v469-v476-frontier-barbell

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize exact verified source
        run: |
          set -euxo pipefail
          cat .bootstrap_meta_v469_xz/part_*.b64 | tr -d '\n\r' > /tmp/run_research.py.xz.b64
          echo '8182116f627b63cac803fc54e0048f0beec322596b071b2a3ef39e284dcb2094  /tmp/run_research.py.xz.b64' | sha256sum -c -
          base64 -d /tmp/run_research.py.xz.b64 > /tmp/run_research.py.xz
          echo 'c92c53e914338d7282d4eee80d4b3036d6ee80aebaf4bb219b48ef524585b142  /tmp/run_research.py.xz' | sha256sum -c -
          xz -dc /tmp/run_research.py.xz > research/frontier_barbell_v469_v476/run_research.py
          echo '87e255bb99fb44e6351eb1f7fe4d392979d3cb4fafecfbefbf01b927414b0159  research/frontier_barbell_v469_v476/run_research.py' | sha256sum -c -
          echo 'ce8c7240e6f5887bdd046c865b08016026a92f033a580b2896232e885e07a198  research/slow_risk_budget_v461_v468/run_research.py' | sha256sum -c -
          echo '59c10dc2a0b05b39862d39172c5fc11841758591180ce76c1669001afe32fbed  research/meta_ensemble_v453_v460/run_research.py' | sha256sum -c -
          echo '618e14dcf1fef1f54ccb9c4839cb2062fac7b3af16d5515b3cee87e52e1de4ca  research/frontier_barbell_v469_v476/V469_V476_DESIGN.json' | sha256sum -c -

      - name: Verify pinned inputs and parent decisions
        run: |
          set -euxo pipefail
          test -s research/strategy_anatomy_v437_v444/results/joined_V285_LOW_SKEW_HOURLY_CONTROLLER.csv
          test -s research/strategy_anatomy_v437_v444/results/joined_V365_DOWNSIDE_VOL_COMPRESSION_ENSEMBLE.csv
          test -s research/meta_ensemble_v453_v460/results/summary.json
          test -s research/slow_risk_budget_v461_v468/results/summary.json
          bad=$(find research/frontier_barbell_v469_v476 -type f \( -name '*.zip' -o -name '*.b64' -o -name '*.pyfrag' \) -print || true)
          test -z "$bad"

      - name: Install, compile and causal self-test
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r research/frontier_barbell_v469_v476/requirements.txt
          python -m py_compile research/frontier_barbell_v469_v476/run_research.py
          python research/frontier_barbell_v469_v476/run_research.py --self-test

      - name: Run frozen backtest
        run: |
          set -euxo pipefail
          rm -rf research/frontier_barbell_v469_v476/results
          python research/frontier_barbell_v469_v476/run_research.py \
            --v285 research/strategy_anatomy_v437_v444/results/joined_V285_LOW_SKEW_HOURLY_CONTROLLER.csv \
            --v365 research/strategy_anatomy_v437_v444/results/joined_V365_DOWNSIDE_VOL_COMPRESSION_ENSEMBLE.csv \
            --design research/frontier_barbell_v469_v476/V469_V476_DESIGN.json \
            --output research/frontier_barbell_v469_v476/results \
            2>&1 | tee research/frontier_barbell_v469_v476/run.log

      - name: Verify frozen decision
        run: |
          set -euxo pipefail
          test -s research/frontier_barbell_v469_v476/results/summary.json
          test -s research/frontier_barbell_v469_v476/results/selection_proof_before_oos.json
          test -s research/frontier_barbell_v469_v476/results/recipe_development_ranking.csv
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('research/frontier_barbell_v469_v476/results/summary.json').read_text())
          assert summary['integration_permitted'] is False
          assert summary['live_ready'] is False
          assert summary['real_leverage_authorized'] is False
          assert summary['profitability_proven'] is False
          assert summary['selection']['selection_uses_2024'] is False
          assert summary['selection']['selection_uses_2025'] is False
          assert summary['selection']['selection_uses_2026'] is False
          print(json.dumps(summary, indent=2))
          PY
          find research/frontier_barbell_v469_v476 -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find research/frontier_barbell_v469_v476 -type f -name '*.pyc' -delete || true

      - name: Commit readable source and results
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/frontier_barbell_v469_v476
          git rm -r .bootstrap_meta_v469_xz
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Add V469-V476 frontier barbell results [skip ci]'
            git push origin HEAD:agent/active-v469-v476-frontier-barbell
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-v469-v476-frontier-barbell
          path: research/frontier_barbell_v469_v476
          if-no-files-found: warn
          retention-days: 30
