name: Agent DS order deadband audit

on:
  push:
    branches: [agent/backtest-audit-20260801]
    paths:
      - 'research/agent_ds_order_deadband_20260801.py'
      - '.github/workflows/agent-ds-deadband.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/agent_ds_order_deadband_20260801.py'
      - '.github/workflows/agent-ds-deadband.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ds-deadband:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile harness
        run: python -m compileall -q research/agent_ds_order_deadband_20260801.py
      - name: Run order-level deadband backtests
        run: |
          mkdir -p audit-results
          python research/agent_ds_order_deadband_20260801.py \
            --output audit-results/ds-deadband.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-ds-deadband-20260801
          path: audit-results/ds-deadband.json
          if-no-files-found: warn
          retention-days: 14
