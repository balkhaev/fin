name: Guard25 candidate robustness
on:
  push:
    branches: [research/funding-crowding-20260906]
    paths:
      - research/guard_execution_checks/*.py
      - .github/workflows/guard-candidate-robustness.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r research/btc_flow/requirements.txt
      - run: python -m pytest -q tests/test_guard_execution_audit.py --junitxml=audit-tests.xml
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34030758810
          name: guard-execution-evidence
          path: original
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34030984895
          name: guard-budget-followup-evidence
          path: budget
      - run: python -m research.guard_execution_checks.robustness --original original --budget budget --out report > audit.log 2>&1 || { tail -n 100 audit.log; exit 1; }
      - run: cat audit.log
      - name: Retain code and audit identity
        if: always()
        run: |
          mkdir -p delivery/research
          cp -r research/guard_execution_checks research/guard_execution_audit delivery/research/
          git rev-parse HEAD > delivery/TESTED_COMMIT.txt
          find delivery -type d -name __pycache__ -prune -exec rm -rf '{}' +
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard25-robustness-evidence
          path: |
            report/
            delivery/
            audit-tests.xml
            audit.log
          retention-days: 90
  reproduce:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r research/btc_flow/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34030758810
          name: guard-execution-evidence
          path: original
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34030984895
          name: guard-budget-followup-evidence
          path: budget
      - uses: actions/download-artifact@v4
        with:
          name: guard25-robustness-evidence
          path: first
      - run: python -m research.guard_execution_checks.robustness --original original --budget budget --out repeated > repeat.log 2>&1 || { tail -n 100 repeat.log; exit 1; }
      - name: Exact second-run report and every execution CSV
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path
          assert json.loads(p('first/report/results.json').read_text())==json.loads(p('repeated/results.json').read_text())
          files=sorted(p('first/report').glob('*_fills.csv'));assert len(files)==47
          for f in files:assert f.read_bytes()==(p('repeated')/f.name).read_bytes(),f.name
          v=json.loads(p('repeated/verification.json').read_text());assert v['reports']==47
          v.update(full_report_exact=True,all47fills_exact=True,independent_execution=True,
            independent_implementation=False,unseen_market=False,local_execution=False,real_orders=0)
          p('REPRODUCTION.json').write_text(json.dumps(v,indent=2));print(json.dumps(v))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard25-robustness-reproduction
          path: |
            REPRODUCTION.json
            repeated/comparison.csv
            repeated/annual.csv
            repeat.log
          retention-days: 90
