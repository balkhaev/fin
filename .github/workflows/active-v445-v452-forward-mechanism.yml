name: Active V445-V452 forward market mechanism validator

on:
  push:
    branches: [main, agent/forward-evidence-direct-source]
    paths:
      - 'research/forward_mechanism_v445_v452/**'
      - '.github/workflows/active-v445-v452-forward-mechanism.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/forward_mechanism_v445_v452/**'
      - '.github/workflows/active-v445-v452-forward-mechanism.yml'
  workflow_dispatch:

concurrency:
  group: active-v445-v452-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mechanism-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install, compile and deterministic self-test
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check \
            -r research/forward_mechanism_v445_v452/requirements.txt
          python -m compileall -q research/forward_mechanism_v445_v452
          python research/forward_mechanism_v445_v452/evaluate_forward_mechanism.py \
            --design research/forward_mechanism_v445_v452/V445_V452_DESIGN.json \
            --output /tmp/v445-self-test \
            --self-test

      - name: Rebuild and verify frozen no-observation checkpoint
        run: |
          set -euxo pipefail
          rm -rf /tmp/v445-initialize
          python research/forward_mechanism_v445_v452/evaluate_forward_mechanism.py \
            --design research/forward_mechanism_v445_v452/V445_V452_DESIGN.json \
            --output /tmp/v445-initialize \
            --initialize
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/v445-initialize')
          decision = json.loads((root / 'FORWARD_MECHANISM_DECISION.json').read_text())
          definitions = json.loads((root / 'CONTEXT_DEFINITIONS.json').read_text())
          assert decision['status'] == 'forward_mechanism_validator_ready_no_observations'
          assert decision['paper_observation_count'] == 0
          assert set(definitions['primary_mechanism_hypotheses']) == {
              'persistent_regime_non_degradation',
              'switching_regime_execution_benefit',
          }
          assert {'early_state', 'novel', 'high_transition_surprise'} <= set(definitions['diagnostic_contexts'])
          assert decision['market_mechanism_claim_supported'] is False
          assert decision['capital_change_authorized'] is False
          assert decision['strategy_parameter_change_authorized'] is False
          assert decision['new_sleeve_allocation'] == 0.0
          assert decision['v136_capital_allocation'] == 0.0
          assert decision['integration_permitted'] is False
          assert decision['live_ready'] is False
          assert decision['real_leverage_authorized'] is False
          assert decision['profitability_proven'] is False
          print(json.dumps(decision, indent=2))
          PY
          diff -u research/forward_mechanism_v445_v452/results/CONTEXT_DEFINITIONS.json \
            /tmp/v445-initialize/CONTEXT_DEFINITIONS.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-v445-v452-forward-mechanism-validator
          path: |
            /tmp/v445-self-test
            /tmp/v445-initialize
          if-no-files-found: warn
          retention-days: 30
