name: Apply and validate production fixes

on:
  push:
    branches: [agent/fix-backtests-dyn-profiles]
    paths:
      - 'scripts/apply_agent_production_fixes.py'
      - '.github/workflows/agent-production-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-backtests-dyn-profiles
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply, validate and publish or persist diagnostics
        shell: bash
        run: |
          set +e
          log=agent-production-validation.log
          : >"$log"

          run_check() {
            title="$1"
            shift
            {
              echo
              echo "===== ${title} ====="
              "$@"
            } >>"$log" 2>&1
            status=$?
            echo "exit_status=${status}" >>"$log"
            return $status
          }

          status=0
          run_check "apply patch" python scripts/apply_agent_production_fixes.py || status=$?
          if [ "$status" -eq 0 ]; then
            rm scripts/apply_agent_production_fixes.py
            rm .github/workflows/agent-production-fixes.yml
            run_check "git diff check" git diff --check || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_check "compile" python -m compileall -q \
              src/finruntime/observability \
              src/finruntime/strategies \
              scripts/run_paper_stack.py \
              tests/runtime || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_check "runtime tests" python -m unittest discover -s tests/runtime -v || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_check "runtime verification" python scripts/verify_runtime.py --full || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_check "Bybit failover or typed geo-block" python - <<'PY'
          from finruntime.observability.errors import DataUnavailableError
          from finruntime.observability.factor_backtests import _fetch_bybit_json

          try:
              payload = _fetch_bybit_json(
                  '/v5/market/funding/history',
                  {'category': 'linear', 'symbol': 'BTCUSDT', 'limit': '1'},
              )
          except DataUnavailableError as error:
              text = str(error)
              assert 'configured endpoints' in text
              assert '403' in text
              print('Bybit runner is geo-blocked and fails closed:', text)
          else:
              assert int(payload.get('retCode', -1)) == 0, payload
              assert payload.get('result', {}).get('list'), payload
              print('Bybit endpoint failover: ok')
          PY
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_check "Consensus recent-month fallback" python - <<'PY'
          from datetime import date
          from finruntime.observability.factor_backtests import run_consensus_backtest
          result = run_consensus_backtest(date(2026, 6, 15), date(2026, 7, 31))
          diagnostics = result['diagnostics']
          assert diagnostics['wif_klines'] > 0
          assert diagnostics['wif_premium_klines'] > 0
          assert diagnostics['dot_klines'] > 0
          print({
              'missing_archives': len(diagnostics['archive_missing_urls']),
              'wif_klines': diagnostics['wif_klines'],
              'dot_klines': diagnostics['dot_klines'],
              'trades': len(result['trades']),
          })
          PY
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_check "Funding replay availability is explicit" python - <<'PY'
          from datetime import date
          from finruntime.observability.errors import DataUnavailableError
          from finruntime.observability.factor_backtests import run_funding_backtest

          try:
              result = run_funding_backtest(date(2026, 7, 25), date(2026, 7, 31))
          except DataUnavailableError as error:
              assert 'Bybit public market data is unavailable' in str(error)
              print('Funding replay explicitly unavailable:', error)
          else:
              assert len(result['input_sha256']) == 64
              print({
                  'trades': len(result['trades']),
                  'requests': result['market_data_requests'],
                  'ending_nav': result['metrics']['ending_nav_usd'],
              })
          PY
            status=$?
          fi

          git config user.name 'OpenAI Agent'
          git config user.email 'openai-agent@users.noreply.github.com'
          if [ "$status" -eq 0 ]; then
            rm -f "$log"
            git add -A
            git commit -m 'Fix backtest identities and data resilience'
          else
            rm -f scripts/apply_agent_production_fixes.py
            rm -f .github/workflows/agent-production-fixes.yml
            git add -A
            git commit -m 'Record production validation failure'
          fi
          git push origin HEAD:agent/fix-backtests-dyn-profiles
          exit "$status"
