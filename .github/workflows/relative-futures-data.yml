name: Relative futures source
on:
  push:
    branches: [research/relative-futures-20260906]
    paths: [.github/workflows/relative-futures-data.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r research/btc_flow/requirements.txt
      - run: python -m pytest -q tests/test_relative_source.py --junitxml=source-tests.xml
      - name: Public historical archives only, no authenticated exchange calls
        run: python -m research.relative_futures.data --raw raw --out data --download > source.log 2>&1 || { tail -n 100 source.log; exit 1; }
      - run: cat data/audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relative-futures-source
          path: |
            data/
            raw/
            source.log
            source-tests.xml
          retention-days: 90
