name: BTC Pressure event evidence validation
on:
  push:
    branches: [research/btc-pressure-event-audit, main]
    paths:
      - research/btc_pressure/**
      - tests/test_btc_pressure*.py
      - .github/workflows/btc-pressure-event-validation.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btc-pressure-event-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated research dependencies
        run: python -m pip install -e . -r research/btc_flow/requirements.txt -r research/btc_pressure/requirements-event.txt -r research/btc_pressure/requirements.txt scipy
      - name: Verify the exact locally tested source and protocol
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('research/btc_pressure')
          for path,expected in json.loads((root/'event_source_lock.json').read_text()).items():
              actual=hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              assert actual==expected,(path,actual,expected)
          manifest=json.loads((root/'event_sources.json').read_text())
          assert hashlib.sha256((root/'event_audit_protocol.json').read_bytes()).hexdigest()==manifest['protocol_sha256']
          PY
      - name: Regression tests including pre-fix failures
        run: python -m pytest -q tests/test_btc_pressure.py tests/test_btc_pressure_audit.py --junitxml=pressure-audit-tests.xml > pressure-audit-tests.log 2>&1
      - name: Full root repository tests
        if: always()
        run: python -m pytest -q tests --junitxml=full-tests.xml > full-tests.log 2>&1
      - name: Retrieve the frozen public samples without credentials
        run: python -m research.btc_pressure.download_event_samples --out event-samples
      - name: Independently reproduce all three event sessions
        run: python -m research.btc_pressure.event_study --data event-samples --out event-report > event-study.log 2>&1
      - name: Compare numerical evidence (not a profitability acceptance)
        run: |
          python - <<'PY'
          import json,math,pathlib
          import pandas as pd
          e=json.loads(pathlib.Path('research/btc_pressure/event_audit_summary.json').read_text())
          r=json.loads(pathlib.Path('event-report/results.json').read_text())
          assert [s['signals'] for s in r['sessions']]==e['session_signals']
          assert [s['price_gate_pass'] for s in r['sessions']]==e['session_price_gate_pass']
          assert sum(a['rows'] for s in r['sessions'] for a in s['source_audit'].values())==e['source_records']
          assert sum(s['features']['valid_frames'] for s in r['sessions'])==e['valid_frames']
          for expected in e['markout_groups']:
              got=next(g for g in r['markout_groups'] if g['family']==expected['family'] and g['horizon_seconds']==expected['horizon_seconds'])
              for k in ('priced','signals','price_gate_pass'):assert got[k]==expected[k]
              assert got['unpriced']==expected['unpriced']
              assert math.isclose(got['mean_net_bps'],expected['mean_net_bps'],abs_tol=1e-7)
          f=pd.read_csv('event-report/signal_markouts.csv')
          assert f.status.value_counts().to_dict()==e['markout_status_counts']
          for expected in e['price_gate_filtered_groups']:
              net=f.loc[f.price_gate_pass & f.status.eq('priced') & f.family.eq(expected['family']) & f.horizon_seconds.eq(expected['horizon_seconds']),'net_bps']
              assert len(net)==expected['priced']
              assert math.isclose(net.mean(),expected['mean_net_bps'],abs_tol=1e-7)
          assert r['continuous_years']==0 and r['sample_days']==3
          assert r['account_return_pct'] is None and r['cagr_pct'] is None
          assert r['target_achieved'] is False and r['live_ready'] is False
          print('Actual sparse event results reproduced. This is NOT a 500% or profitability pass.')
          PY
      - name: Bundle tested source and results, not the large third-party dataset
        if: always()
        run: |
          mkdir -p event-delivery/research event-delivery/tests
          cp -r research/btc_pressure event-delivery/research/
          cp tests/test_btc_pressure.py tests/test_btc_pressure_audit.py event-delivery/tests/
          find event-delivery -type d -name __pycache__ -prune -exec rm -rf '{}' +
          git rev-parse HEAD > event-delivery/TESTED_COMMIT.txt
          cp event-samples/manifest.json event-delivery/DATA_MANIFEST.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-pressure-event-verified-evidence
          path: |
            event-delivery/
            event-report/
            pressure-audit-tests.xml
            pressure-audit-tests.log
            full-tests.xml
            full-tests.log
            event-study.log
          retention-days: 90
