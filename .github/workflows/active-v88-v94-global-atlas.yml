name: Active V88-V94 Global ATLAS research

on:
  push:
    branches: [agent/active-v88-v94-global-atlas]
    paths:
      - "research/active_v88_v94/**"
      - ".github/workflows/active-v88-v94-global-atlas.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/active_v88_v94/**"
      - ".github/workflows/active-v88-v94-global-atlas.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct readable V88 source
        run: |
          set -euxo pipefail
          cat research/active_v88_v94/source_parts/part_*.txt > /tmp/run_research.py
          echo "c9495ba4b9cd67d950c2489d641763e33e7f8042975a92f3b940503a13b2cde7  /tmp/run_research.py" | sha256sum -c -
          python -m py_compile /tmp/run_research.py
      - name: Reconstruct canonical V87 tree and recover ATLAS inputs
        run: |
          set -euxo pipefail
          mkdir -p /tmp/fin-v87
          cat .bootstrap_v87b/payload/part_*.txt | tr -d '\r\n' | base64 -d > /tmp/fin-v87.tar.xz
          xz -t /tmp/fin-v87.tar.xz
          tar -xJf /tmp/fin-v87.tar.xz -C /tmp/fin-v87
          root=$(dirname "$(find /tmp/fin-v87 -type f -name AGENTS.md | head -1)")
          test -n "$root"
          rsync -a --exclude='.git' "$root/" ./
          mkdir -p research/active_v88_v94/inputs/atlas research/active_v88_v94/source
          cp /tmp/run_research.py research/active_v88_v94/source/run_research.py
          cp research/active_v88_v94/README.md research/active_v88_v94/requirements.txt research/active_v88_v94/source/
          stress=$(find "$root" -type f -path '*/research/active_v69_v76/results/v75/stress_equity.csv' | head -1)
          nocash=$(find "$root" -type f -path '*/research/active_v69_v76/results/v75/no_cash_yield_equity.csv' | head -1)
          test -n "$stress" -a -n "$nocash"
          cp "$stress" research/active_v88_v94/inputs/atlas/v75_stress_equity.csv
          cp "$nocash" research/active_v88_v94/inputs/atlas/v75_no_cash_yield_equity.csv
      - name: Install dependencies and run tests
        run: |
          python -m pip install -r research/active_v88_v94/requirements.txt
          python research/active_v88_v94/source/run_research.py --self-test
          if test -f pyproject.toml; then python -m pip install -e '.[dev]'; python -m pytest -q; fi
      - name: Restore external market-data cache
        uses: actions/cache@v4
        with:
          path: .cache/v88_v94
          key: global-atlas-yahoo-ecb-2007-2026-v1
      - name: Run full V88-V94 research
        run: |
          mkdir -p artifacts/active_v88_v94
          python research/active_v88_v94/source/run_research.py \
            --atlas-stress research/active_v88_v94/inputs/atlas/v75_stress_equity.csv \
            --atlas-no-cash research/active_v88_v94/inputs/atlas/v75_no_cash_yield_equity.csv \
            --cache .cache/v88_v94 \
            --output artifacts/active_v88_v94 | tee artifacts/active_v88_v94/run.log
      - name: Materialize readable canonical data and results
        run: |
          set -euxo pipefail
          rm -rf research/active_v88_v94/results research/active_v88_v94/inputs/external
          mkdir -p research/active_v88_v94/results research/active_v88_v94/inputs/external/raw/yahoo research/active_v88_v94/inputs/external/raw/ecb
          cp -r artifacts/active_v88_v94/. research/active_v88_v94/results/
          cp artifacts/active_v88_v94/etf_adjusted_close.csv research/active_v88_v94/inputs/external/
          cp artifacts/active_v88_v94/fx_reference_prices.csv research/active_v88_v94/inputs/external/
          cp .cache/v88_v94/yahoo/*.json research/active_v88_v94/inputs/external/raw/yahoo/
          cp .cache/v88_v94/ecb/g10_reference_rates.csv research/active_v88_v94/inputs/external/raw/ecb/
          rm -rf research/active_v88_v94/source_parts .bootstrap_v87 .bootstrap_v87b
          rm -f .github/workflows/canonical-v87-public.yml
          find research src tests scripts docs inputs results -type d -name '__pycache__' -prune -exec rm -rf {} + 2>/dev/null || true
          find research src tests scripts docs inputs results -type f -name '*.pyc' -delete 2>/dev/null || true
          find research/active_v69_v76 research/active_v77_v87 -type f \( -name '*.zip' -o -name '*.b64' -o -name '*.pyfrag' \) -delete 2>/dev/null || true
      - name: Verify repository and research result
        run: |
          set -euxo pipefail
          python -m py_compile research/active_v88_v94/source/run_research.py
          python research/active_v88_v94/source/run_research.py --self-test
          test -f research/active_v88_v94/results/summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('research/active_v88_v94/results/summary.json').read_text())
          assert s['live_ready'] is False
          assert s['real_leverage_authorized'] is False
          print(json.dumps(s, indent=2))
          PY
          if test -f scripts/verify_repository.py; then python scripts/verify_repository.py --full; fi
      - name: Commit readable canonical tree and results
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Canonicalize V87 and add V88-V94 Global ATLAS results [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-v88-v94-global-atlas-diagnostic
          path: artifacts/active_v88_v94
          if-no-files-found: warn
          retention-days: 30
