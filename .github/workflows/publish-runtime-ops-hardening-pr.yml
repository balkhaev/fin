name: Publish verified runtime ops hardening from temporary PR

on:
  pull_request:
    branches: [agent/runtime-ops]
    paths:
      - '.runtime-ops-hardening/**'
      - '.github/workflows/publish-runtime-ops-hardening-pr.yml'
  workflow_dispatch:

concurrency:
  group: publish-runtime-ops-hardening-pr
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/runtime-ops-publish-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct, test and publish exact hardened bytes
        run: bash .runtime-ops-hardening/publish.sh
