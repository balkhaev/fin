name: Asymmetric pulse research
on:
  push:
    branches: [research/asymmetric-pulse-20260906]
    paths:
      - research/asymmetric_pulse/*.py
      - tests/test_asymmetric_pulse.py
      - .github/workflows/asymmetric-pulse-research.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: asymmetric-pulse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . -r research/btc_flow/requirements.txt scipy
      - name: Test causality and source-independent invariants before evaluating returns
        run: |
          python -m pytest -q tests/test_asymmetric_pulse.py --junitxml=pulse-tests.xml
          python -m pytest -q tests --junitxml=root-tests.xml > root-tests.log 2>&1 || { tail -n 100 root-tests.log; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34024683190
          name: rotation-transfer-research-evidence
          path: source
      - name: All hypotheses, prior control identity, unchanged cost engine
        run: python -m research.asymmetric_pulse.study --source source --out report > research.log 2>&1 || { tail -n 120 research.log; exit 1; }
      - name: Publish factual results and every loss
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path;r=json.loads(p('report/results.json').read_text())
          print('SELECTION',json.dumps(r['selection']))
          print('COMPARISON_CSV\n'+p('report/comparison.csv').read_text())
          print('ASSET_EXCLUSIONS\n'+p('report/exclusions.csv').read_text())
          for x in r['rows']:
              if x['policy'] in (r['selection']['primary'],r['selection']['challenger'],'early_downside','early_total','early_full','leader_downside'):
                  if x['period']=='full':print('ANNUAL',x['policy'],json.dumps(x['annual']))
          print('CALENDAR500',json.dumps(r['observed_calendar_years_above500']))
          print('TESTS',p('root-tests.log').read_text().splitlines()[-1])
          print('VERIFICATION',p('report/verification.json').read_text())
          PY
      - name: Preserve source, all inputs and filled-order evidence
        if: always()
        run: |
          mkdir -p delivery/research delivery/tests
          cp -r research/asymmetric_pulse research/annual_rotation research/rotation_stability research/rotation_venue_transfer delivery/research/
          cp tests/test_asymmetric_pulse.py delivery/tests/
          cp research/btc_flow/requirements.txt delivery/requirements.txt
          git rev-parse HEAD > delivery/TESTED_COMMIT.txt
          find delivery -type d -name __pycache__ -prune -exec rm -rf '{}' +
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asymmetric-pulse-research-evidence
          path: |
            delivery/
            report/
            source/prior/rotation-data/
            source/new-source/okx-data/
            source/prior/static-report/results.json
            source/prior/delivery/research/annual_rotation/
            pulse-tests.xml
            root-tests.xml
            root-tests.log
            research.log
          retention-days: 90
  reproduce:
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r research/btc_flow/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: asymmetric-pulse-research-evidence
          path: first
      - name: Recompute all reports on a clean second runner
        run: python -m research.asymmetric_pulse.study --source first/source --out reproduced > reproduce.log 2>&1 || { tail -n 120 reproduce.log; exit 1; }
      - name: Exact numeric and execution-ledger comparison
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path
          a=json.loads(p('first/report/results.json').read_text());b=json.loads(p('reproduced/results.json').read_text())
          assert a==b,'Complete result differs'
          old=sorted(p('first/report').glob('*_fills.csv'))
          for f in old:assert f.read_bytes()==(p('reproduced')/f.name).read_bytes(),f.name
          verify=json.loads(p('reproduced/verification.json').read_text())
          assert len(old)==verify['fill_ledgers']
          verify.update(complete_result_exactly_reproduced=True,exported_ledgers_exactly_reproduced=len(old),
              independent_runner=True,independent_model_implementation=False,unseen_market_holdout=False,
              local_execution=False,live_orders=False)
          p('REPRODUCTION.json').write_text(json.dumps(verify,indent=2))
          print(json.dumps(verify))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asymmetric-pulse-reproduction
          path: |
            REPRODUCTION.json
            reproduced/comparison.csv
            reproduced/annual.csv
            reproduced/exclusions.csv
            reproduced/verification.json
            reproduce.log
          retention-days: 90
