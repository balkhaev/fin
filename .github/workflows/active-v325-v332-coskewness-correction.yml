name: Active V325-V332 corrected systematic coskewness replay

on:
  push:
    branches: [agent/active-v325-v332-coskewness-correction]
    paths:
      - 'research/active_v325_v332/**'
      - '.github/workflows/active-v325-v332-coskewness-correction.yml'
  pull_request:
    branches: [agent/active-v301-v308-systematic-tail]
    paths:
      - 'research/active_v325_v332/**'
      - '.github/workflows/active-v325-v332-coskewness-correction.yml'
  workflow_dispatch:

concurrency:
  group: active-v325-v332-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/active-v325-v332-coskewness-correction

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize corrected readable source
        run: |
          set -euxo pipefail
          python research/active_v325_v332/bootstrap_corrected_coskewness.py
          test -s research/active_v325_v332/run_research.py
          grep -q 'e_xy2 - 2.0' research/active_v325_v332/run_research.py
          grep -q 'neighboring_formulas_tested' research/active_v325_v332/run_research.py

      - name: Install, compile and arithmetic-causal self-test
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r research/active_v325_v332/requirements.txt
          python -m compileall -q \
            research/active_v325_v332 \
            research/active_v301_v308 \
            research/active_v269_v276 \
            research/active_v253_v260 \
            research/active_v9
          python research/active_v325_v332/run_research.py --self-test

      - name: Restore immutable V9 public archive cache
        uses: actions/cache@v4
        with:
          path: .cache/v9
          key: binance-usdm-daily-fixed-universe-2020-2026-v9

      - name: Run unchanged 144-policy grid with corrected moment
        run: |
          set -euxo pipefail
          rm -rf research/active_v325_v332/results \
                 research/active_v325_v332/MANIFEST.json \
                 docs/checkpoints/v332
          python research/active_v325_v332/run_research.py \
            --root research/active_v325_v332 \
            --cache .cache/v9 \
            2>&1 | tee research/active_v325_v332/run.log

      - name: Materialize V332 checkpoint
        run: |
          set -euxo pipefail
          test -s research/active_v325_v332/results/summary.json
          test -s research/active_v325_v332/results/FROZEN_DECISION.json
          test -s research/active_v325_v332/results/coverage_gate.json
          test -s research/active_v325_v332/results/selection_proof_before_validation.json
          test -s research/active_v325_v332/results/REPORT_RU.md
          mkdir -p docs/checkpoints/v332
          cp research/active_v325_v332/results/summary.json docs/checkpoints/v332/CHECKPOINT_V332.json
          cp research/active_v325_v332/results/REPORT_RU.md docs/checkpoints/v332/RESEARCH_CHECKPOINT_V332_RU.md
          if test -s research/active_v325_v332/results/ANNUAL_RETURNS.csv; then
            cp research/active_v325_v332/results/ANNUAL_RETURNS.csv docs/checkpoints/v332/ANNUAL_RETURNS.csv
          fi

      - name: Verify correction chronology and safety
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/active_v325_v332')
          summary = json.loads((root / 'results/summary.json').read_text())
          proof = json.loads((root / 'results/selection_proof_before_validation.json').read_text())
          if not proof.get('selection_not_run'):
              assert proof['selection_uses_2024'] is False
              assert proof['selection_uses_2025'] is False
              assert proof['selection_uses_2026'] is False
              assert proof['coskewness_estimator_corrected'] is True
              assert proof['v301_oos_opened'] is False
              assert proof['v317_oos_opened'] is False
              assert proof['neighboring_formulas_tested'] == 0
              assert proof['policy_count'] == 144
              assert proof['promotable_policy_count'] == 108
          assert summary['integration_permitted'] is False
          assert summary['live_ready'] is False
          assert summary['real_leverage_authorized'] is False
          assert summary['profitability_proven'] is False
          print(json.dumps(summary, indent=2))
          PY
          find research/active_v325_v332 docs/checkpoints/v332 -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find research/active_v325_v332 docs/checkpoints/v332 -type f -name '*.pyc' -delete || true

      - name: Commit readable source and frozen decision
        if: github.event_name != 'pull_request'
        run: |
          set -euxo pipefail
          rm -f research/active_v325_v332/bootstrap_corrected_coskewness.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A research/active_v325_v332 docs/checkpoints/v332
          if git diff --cached --quiet; then
            echo 'No V325-V332 changes'
          else
            git commit -m 'Archive V325-V332 corrected coskewness evidence [skip ci]'
            git push origin HEAD:agent/active-v325-v332-coskewness-correction
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-v325-v332-coskewness-correction
          path: |
            research/active_v325_v332/results
            research/active_v325_v332/run.log
            docs/checkpoints/v332
          if-no-files-found: warn
          retention-days: 30
