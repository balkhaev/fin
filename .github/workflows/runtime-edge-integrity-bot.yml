name: Apply runtime edge integrity fixes

on:
  push:
    branches: [agent/runtime-edge-integrity-20260730]
    paths:
      - '.github/workflows/runtime-edge-integrity-bot.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/runtime-edge-integrity-20260730
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch runtime and add regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "src/finruntime/execution/paper_broker.py",
              '''    quote_by_key = _quote_map(quotes)
              state = account_state
          ''',
              '''    quote_by_key = _quote_map(quotes)
              remaining_liquidity = {
                  key: require_decimal_string(
                      quote.available_quantity,
                      field=f"quote.available_quantity.{key[0]}:{key[1]}",
                      minimum=_ZERO,
                  )
                  * policy.participation_rate
                  for key, quote in quote_by_key.items()
              }
              state = account_state
          ''',
          )
          replace_once(
              "src/finruntime/execution/paper_broker.py",
              '''        quote = quote_by_key.get(_quote_key(intent))
          ''',
              '''        quote_key = _quote_key(intent)
                      quote = quote_by_key.get(quote_key)
          ''',
          )
          replace_once(
              "src/finruntime/execution/paper_broker.py",
              '''            available = require_decimal_string(
                          quote.available_quantity,
                          field="quote.available_quantity",
                          minimum=_ZERO,
                      )
                      capacity = available * policy.participation_rate
          ''',
              '''            capacity = remaining_liquidity[quote_key]
          ''',
          )
          replace_once(
              "src/finruntime/execution/paper_broker.py",
              '''        if fill.status in {"partial", "filled"}:
                      progress[intent.intent_id] = already_filled + require_decimal_string(
                          fill.filled_quantity, field="fill.filled_quantity", minimum=_ZERO
                      )
          ''',
              '''        if fill.status in {"partial", "filled"}:
                      filled_quantity = require_decimal_string(
                          fill.filled_quantity,
                          field="fill.filled_quantity",
                          minimum=_ZERO,
                      )
                      progress[intent.intent_id] = already_filled + filled_quantity
                      remaining = remaining_liquidity[quote_key] - filled_quantity
                      if remaining < 0:
                          raise AccountingHalt("paper quote liquidity was over-consumed")
                      remaining_liquidity[quote_key] = remaining
          ''',
          )

          replace_once(
              "src/finruntime/provenance/migration.py",
              '''def _require_strategy_id(value: str, *, field: str) -> str:
          ''',
              '''def _require_string(value: object, *, field: str) -> str:
                  if not isinstance(value, str):
                      raise ContractError(f"{field} must be a string")
                  return value


              def _require_bool(value: object, *, field: str) -> bool:
                  if type(value) is not bool:
                      raise ContractError(f"{field} must be a JSON boolean")
                  return value


              def _require_strategy_id(value: str, *, field: str) -> str:
          ''',
          )
          replace_once(
              "src/finruntime/provenance/migration.py",
              '''    for raw_path, raw_hash in value.items():
                      path = _require_repository_path(str(raw_path), field=f"{field} path")
          ''',
              '''    for raw_path, raw_hash in value.items():
                      if not isinstance(raw_path, str):
                          raise ContractError(f"{field} paths must be strings")
                      path = _require_repository_path(raw_path, field=f"{field} path")
          ''',
          )
          replace_once(
              "src/finruntime/provenance/migration.py",
              '''    normalized = tuple(str(value).strip() for value in values)
                  if any(not value for value in normalized):
                      raise ContractError(f"{field} cannot contain empty values")
                  if len(set(normalized)) != len(normalized):
                      raise ContractError(f"{field} values must be unique")
                  return tuple(sorted(normalized))
          ''',
              '''    normalized: list[str] = []
                  for value in values:
                      if not isinstance(value, str):
                          raise ContractError(f"{field} must contain strings")
                      item = value.strip()
                      if not item:
                          raise ContractError(f"{field} cannot contain empty values")
                      normalized.append(item)
                  if len(set(normalized)) != len(normalized):
                      raise ContractError(f"{field} values must be unique")
                  return tuple(sorted(normalized))
          ''',
          )
          replace_once(
              "src/finruntime/provenance/migration.py",
              '''    output = {str(key): item for key, item in value.items()}
                  if any(not key for key in output):
                      raise ContractError(f"{field} cannot contain an empty key")
                  canonical_json_bytes(output)
                  return dict(sorted(output.items()))
          ''',
              '''    output: dict[str, Any] = {}
                  for key, item in value.items():
                      if not isinstance(key, str) or not key:
                          raise ContractError(
                              f"{field} must contain non-empty string keys"
                          )
                      output[key] = item
                  canonical_json_bytes(output)
                  return dict(sorted(output.items()))
          ''',
          )
          replace_once(
              "src/finruntime/provenance/migration.py",
              '''        normalized_reason = str(reason).strip()
                      provisional = cls(
                          schema_version="1.0",
                          migration_id="sha256:" + "0" * 64,
                          migration_kind=str(migration_kind),
                          status=str(status),
          ''',
              '''        if not isinstance(migration_kind, str):
                          raise ContractError("migration_kind must be a string")
                      if not isinstance(status, str):
                          raise ContractError("migration status must be a string")
                      if not isinstance(created_at_utc, str):
                          raise ContractError("created_at_utc must be a UTC string")
                      normalized_reason = _require_string(reason, field="reason").strip()
                      provisional = cls(
                          schema_version="1.0",
                          migration_id="sha256:" + "0" * 64,
                          migration_kind=migration_kind,
                          status=status,
          ''',
          )
          replace_once(
              "src/finruntime/provenance/migration.py",
              '''            forward_clock_reset=bool(forward_clock_reset),
                          successor_provenance_complete=bool(successor_provenance_complete),
                          capital_authorization_carried_forward=bool(
                              capital_authorization_carried_forward
                          ),
                          live_ready=bool(live_ready),
                          real_leverage_authorized=bool(real_leverage_authorized),
                          exchange_submission_available=bool(exchange_submission_available),
          ''',
              '''            forward_clock_reset=_require_bool(
                              forward_clock_reset,
                              field="forward_clock_reset",
                          ),
                          successor_provenance_complete=_require_bool(
                              successor_provenance_complete,
                              field="successor_provenance_complete",
                          ),
                          capital_authorization_carried_forward=_require_bool(
                              capital_authorization_carried_forward,
                              field="capital_authorization_carried_forward",
                          ),
                          live_ready=_require_bool(live_ready, field="live_ready"),
                          real_leverage_authorized=_require_bool(
                              real_leverage_authorized,
                              field="real_leverage_authorized",
                          ),
                          exchange_submission_available=_require_bool(
                              exchange_submission_available,
                              field="exchange_submission_available",
                          ),
          ''',
          )

          test = '''from __future__ import annotations

          import unittest
          from decimal import Decimal

          from finruntime.canonical import ContractError
          from finruntime.execution import PaperBrokerPolicy, PaperQuote, execute_paper_cycle
          from finruntime.models import ExecutionIntent, ExecutionPlan
          from finruntime.portfolio import PaperAccountState
          from finruntime.provenance import StrategyMigrationRecord

          HASH_A = "sha256:" + "a" * 64


          class SharedQuoteLiquidityTests(unittest.TestCase):
              @staticmethod
              def policy() -> PaperBrokerPolicy:
                  return PaperBrokerPolicy(
                      spot_commission_bps=Decimal("0"),
                      perp_commission_bps=Decimal("0"),
                      proxy_half_spread_bps=Decimal("0"),
                      impact_bps=Decimal("0"),
                      participation_rate=Decimal("1"),
                  )

              @staticmethod
              def plan() -> ExecutionPlan:
                  close = ExecutionIntent.create(
                      instrument="BTC/USDT:USDT",
                      market_type="perpetual",
                      side="sell",
                      reduce_only=True,
                      quantity="2",
                      quantity_unit="base",
                      reference_price="100",
                      max_slippage_bps="0",
                      reason="perpetual_sign_flip_close",
                      not_before_utc="2026-07-30T08:00:00Z",
                      expires_at_utc="2026-07-30T09:00:00Z",
                  )
                  child = ExecutionIntent.create(
                      instrument="BTC/USDT:USDT",
                      market_type="perpetual",
                      side="sell",
                      reduce_only=False,
                      quantity="3",
                      quantity_unit="base",
                      reference_price="100",
                      max_slippage_bps="0",
                      reason="perpetual_sign_flip_open",
                      parent_intent_id=close.intent_id,
                      not_before_utc="2026-07-30T08:00:00Z",
                      expires_at_utc="2026-07-30T09:00:00Z",
                  )
                  return ExecutionPlan.create(
                      strategy_id="v75_atlas_nx",
                      mode="paper",
                      created_at_utc="2026-07-30T08:00:00Z",
                      market_snapshot_id="sha256:" + "1" * 64,
                      state_sequence=1,
                      target_hash="sha256:" + "2" * 64,
                      intents=(close, child),
                  )

              @staticmethod
              def account() -> PaperAccountState:
                  return PaperAccountState.create(
                      strategy_id="v75_atlas_nx",
                      sequence=0,
                      as_of_utc="2026-07-30T08:00:00Z",
                      cash="10000",
                      perp_positions={"BTC/USDT:USDT": "2"},
                      perp_entry_prices={"BTC/USDT:USDT": "100"},
                      equity="10000",
                      high_water="10000",
                  )

              @staticmethod
              def quote(*, available: str, time: str) -> PaperQuote:
                  return PaperQuote(
                      instrument="BTC/USDT:USDT",
                      market_type="perpetual",
                      observed_at_utc=time,
                      source_observation_hash="sha256:" + "3" * 64,
                      bid="100",
                      ask="100",
                      mid="100",
                      available_quantity=available,
                  )

              @staticmethod
              def prices() -> dict[str, dict[str, object]]:
                  return {
                      "spot": {},
                      "perp": {"BTC/USDT:USDT": {"reference_price": "100"}},
                  }

              def test_sign_flip_intents_share_one_quote_capacity(self) -> None:
                  plan = self.plan()
                  first = execute_paper_cycle(
                      plan=plan,
                      account_state=self.account(),
                      quotes=(self.quote(available="3", time="2026-07-30T08:01:00Z"),),
                      mark_prices=self.prices(),
                      policy=self.policy(),
                  )
                  self.assertEqual(
                      [fill.status for fill in first.fill_events],
                      ["filled", "partial"],
                  )
                  self.assertEqual(
                      [fill.filled_quantity for fill in first.fill_events],
                      ["2", "1"],
                  )
                  self.assertEqual(first.total_filled_notional, "300")
                  self.assertEqual(
                      first.account_state.perp_positions["BTC/USDT:USDT"],
                      "-1",
                  )
                  self.assertFalse(first.execution_complete)

                  resumed = execute_paper_cycle(
                      plan=plan,
                      account_state=first.account_state,
                      quotes=(self.quote(available="2", time="2026-07-30T08:02:00Z"),),
                      mark_prices=self.prices(),
                      policy=self.policy(),
                  )
                  self.assertEqual(len(resumed.fill_events), 1)
                  self.assertEqual(resumed.fill_events[0].filled_quantity, "2")
                  self.assertEqual(
                      resumed.account_state.perp_positions["BTC/USDT:USDT"],
                      "-3",
                  )
                  self.assertTrue(resumed.execution_complete)


          class MigrationBuilderStrictTypeTests(unittest.TestCase):
              @staticmethod
              def values() -> dict[str, object]:
                  return {
                      "migration_kind": "reconstruction",
                      "status": "planned",
                      "predecessor_strategy_id": "v75_atlas_nx",
                      "successor_strategy_id": "v75_reconstructed_v1",
                      "created_at_utc": "2026-07-30T08:00:00Z",
                      "reason": "Exact predecessor artifacts are unavailable.",
                      "source_audits": {"docs/audit.json": HASH_A},
                      "changed_components": ("source_reconstruction",),
                      "allowed_modes": ("paper", "shadow"),
                      "forward_clock_reset": True,
                      "successor_provenance_complete": False,
                  }

              def test_create_rejects_non_boolean_values(self) -> None:
                  for field, value in (
                      ("forward_clock_reset", 1),
                      ("successor_provenance_complete", 0),
                      ("capital_authorization_carried_forward", "false"),
                      ("live_ready", None),
                      ("real_leverage_authorized", []),
                      ("exchange_submission_available", {}),
                  ):
                      with self.subTest(field=field):
                          values = self.values()
                          values[field] = value
                          with self.assertRaises(ContractError):
                              StrategyMigrationRecord.create(**values)  # type: ignore[arg-type]

              def test_create_rejects_non_string_json_fields(self) -> None:
                  for field, value in (
                      ("migration_kind", ["reconstruction"]),
                      ("status", 1),
                      ("created_at_utc", 0),
                      ("reason", 7),
                      ("changed_components", ("source_reconstruction", 7)),
                      ("allowed_modes", ("paper", False)),
                      ("source_audits", {7: HASH_A}),
                      ("inherited_parameters", {7: "1.10"}),
                  ):
                      with self.subTest(field=field):
                          values = self.values()
                          values[field] = value
                          with self.assertRaises(ContractError):
                              StrategyMigrationRecord.create(**values)  # type: ignore[arg-type]


          if __name__ == "__main__":
              unittest.main()
          '''
          lines = test.splitlines()
          common = min(
              len(line) - len(line.lstrip())
              for line in lines
              if line.strip()
          )
          normalized = "\n".join(
              line[common:] if line.strip() else ""
              for line in lines
          ) + "\n"
          Path("tests/runtime/test_runtime_composition_integrity.py").write_text(
              normalized,
              encoding="utf-8",
          )
          Path(".github/workflows/runtime-edge-integrity-bot.yml").unlink()
          PY
      - name: Validate full runtime
        env:
          PYTHONPATH: src
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check -e .
          python -m compileall -q src scripts tests
          python -m unittest discover -s tests/runtime -p 'test_*.py' -v
          python scripts/verify_runtime.py --full
      - name: Commit patched runtime
        run: |
          set -euxo pipefail
          git config user.name "openai-runtime-agent"
          git config user.email "runtime-agent@users.noreply.github.com"
          git add src/finruntime/execution/paper_broker.py \
            src/finruntime/provenance/migration.py \
            tests/runtime/test_runtime_composition_integrity.py \
            .github/workflows/runtime-edge-integrity-bot.yml
          git commit -m "Enforce shared liquidity and strict migration builders"
          git push origin HEAD:agent/runtime-edge-integrity-20260730
