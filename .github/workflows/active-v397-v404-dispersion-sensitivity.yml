name: Active V397-V404 fixed-universe dispersion sensitivity

on:
  push:
    branches: [agent/active-v397-v404-dispersion-sensitivity]
    paths:
      - 'research/active_v397_v404/**'
      - '.github/workflows/active-v397-v404-dispersion-sensitivity.yml'
  pull_request:
    branches: [agent/active-v341-v348-volatility-term-structure]
    paths:
      - 'research/active_v397_v404/**'
      - '.github/workflows/active-v397-v404-dispersion-sensitivity.yml'
  workflow_dispatch:

concurrency:
  group: active-v397-v404-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/active-v397-v404-dispersion-sensitivity

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize readable dispersion-sensitivity source
        run: |
          set -euxo pipefail
          python research/active_v397_v404/bootstrap.py
          test -s research/active_v397_v404/run_research.py
          grep -q 'low_high_dispersion_participation' research/active_v397_v404/run_research.py

      - name: Install, compile and causal self-test
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r research/active_v397_v404/requirements.txt
          python -m compileall -q \
            research/active_v397_v404 \
            research/active_v341_v348 \
            research/active_v269_v276 \
            research/active_v253_v260 \
            research/active_v9
          python research/active_v397_v404/run_research.py --self-test

      - name: Restore immutable V9 public archive cache
        uses: actions/cache@v4
        with:
          path: .cache/v9
          key: binance-usdm-daily-fixed-universe-2020-2026-v9

      - name: Run frozen 144-policy dispersion-sensitivity research
        run: |
          set -euxo pipefail
          rm -rf research/active_v397_v404/results \
                 research/active_v397_v404/MANIFEST.json \
                 docs/checkpoints/v404
          python research/active_v397_v404/run_research.py \
            --root research/active_v397_v404 \
            --cache .cache/v9 \
            2>&1 | tee research/active_v397_v404/run.log

      - name: Materialize V404 checkpoint
        run: |
          set -euxo pipefail
          test -s research/active_v397_v404/results/summary.json
          test -s research/active_v397_v404/results/FROZEN_DECISION.json
          test -s research/active_v397_v404/results/coverage_gate.json
          test -s research/active_v397_v404/results/selection_proof_before_validation.json
          test -s research/active_v397_v404/results/REPORT_RU.md
          mkdir -p docs/checkpoints/v404
          cp research/active_v397_v404/results/summary.json docs/checkpoints/v404/CHECKPOINT_V404.json
          cp research/active_v397_v404/results/REPORT_RU.md docs/checkpoints/v404/RESEARCH_CHECKPOINT_V404_RU.md
          if test -s research/active_v397_v404/results/ANNUAL_RETURNS.csv; then
            cp research/active_v397_v404/results/ANNUAL_RETURNS.csv docs/checkpoints/v404/ANNUAL_RETURNS.csv
          fi

      - name: Verify frozen chronology and safety
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/active_v397_v404')
          summary = json.loads((root / 'results/summary.json').read_text())
          proof = json.loads((root / 'results/selection_proof_before_validation.json').read_text())
          if not proof.get('selection_not_run'):
              assert proof['selection_uses_2024'] is False
              assert proof['selection_uses_2025'] is False
              assert proof['selection_uses_2026'] is False
          assert summary['integration_permitted'] is False
          assert summary['live_ready'] is False
          assert summary['real_leverage_authorized'] is False
          assert summary['profitability_proven'] is False
          print(json.dumps(summary, indent=2))
          PY
          find research/active_v397_v404 docs/checkpoints/v404 -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find research/active_v397_v404 docs/checkpoints/v404 -type f -name '*.pyc' -delete || true

      - name: Commit readable source and frozen decision
        if: github.event_name != 'pull_request'
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A research/active_v397_v404 docs/checkpoints/v404
          if git diff --cached --quiet; then
            echo 'No V397-V404 changes'
          else
            git commit -m 'Archive V397-V404 dispersion-sensitivity evidence [skip ci]'
            git push origin HEAD:agent/active-v397-v404-dispersion-sensitivity
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-v397-v404-dispersion-sensitivity
          path: |
            research/active_v397_v404/results
            research/active_v397_v404/run.log
            docs/checkpoints/v404
          if-no-files-found: warn
          retention-days: 30
