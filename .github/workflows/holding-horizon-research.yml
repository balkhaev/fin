name: Holding horizon research
on:
  push:
    branches: [research/holding-horizon-main-20260906]
    paths:
      - research/holding_horizon/*.py
      - tests/test_holding_horizon.py
      - .github/workflows/holding-horizon-research.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: holding-horizon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -e . -r research/clock_phase/requirements.txt
      - name: Main-compatible driver tests and full regression without external accounting imports
        run: |
          python -m pytest -q tests/test_holding_horizon.py --junitxml=holding-tests.xml
          python -m pytest -q tests --junitxml=root-tests.xml > root-tests.log 2>&1 || { tail -n 100 root-tests.log; exit 1; }
          tail -n 2 root-tests.log
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34039211921
          name: opportunity-leverage-complete-evidence
          path: archived
      - name: Explicit offline use of pinned unchanged archived reference on complete prices
        run: python -m research.holding_horizon.study --source archived --out report --allow-archived-reference > research.log 2>&1 || { tail -n 100 research.log; exit 1; }
      - run: |
          cat research.log
          cat report/comparison.csv
      - name: Save reproducible new source without copying experimental engine into main
        if: always()
        run: |
          mkdir -p delivery/research delivery/tests
          cp -r research/holding_horizon delivery/research/
          cp tests/test_holding_horizon.py delivery/tests/
          cp research/btc_flow/requirements.txt delivery/requirements.txt
          git rev-parse HEAD > delivery/TESTED_COMMIT.txt
          find delivery -type d -name __pycache__ -prune -exec rm -rf '{}' +
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holding-horizon-research-evidence
          path: |
            report/
            delivery/
            root-tests.xml
            root-tests.log
            holding-tests.xml
            research.log
          retention-days: 90
  reproduce:
    needs: research
    if: github.ref == 'refs/heads/research/holding-horizon-main-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r research/btc_flow/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34039211921
          name: opportunity-leverage-complete-evidence
          path: archived
      - uses: actions/download-artifact@v4
        with: {name: holding-horizon-research-evidence, path: first}
      - run: python -m research.holding_horizon.study --source archived --out repeated --allow-archived-reference > repeat.log 2>&1 || { tail -n 100 repeat.log; exit 1; }
      - name: Verify every numerical report and all272 financial outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path
          first=json.loads(p('first/report/results.json').read_text());second=json.loads(p('repeated/results.json').read_text())
          assert first==second,'Numerical result mismatch'
          count=0
          for suffix in ('_fills.csv','_funding.csv','_episodes.csv','_equity.csv.gz'):
              files=sorted(p('first/report').glob('*'+suffix));assert len(files)==68
              for f in files:
                  assert f.read_bytes()==(p('repeated')/f.name).read_bytes(),f.name
                  count+=1
          proof=json.loads(p('repeated/verification.json').read_text())
          assert proof['reports']==68 and proof['exact_original_reports']==3
          proof.update(all68_reports_equal=True,all272_financial_files_equal=count==272,
              independent_execution=True,independent_model=False,unseen_market=False,local_execution=False,
              reference_engine_unpatched_outside_main=True,beta_model_not_implemented=True,real_orders=0)
          p('REPRODUCTION.json').write_text(json.dumps(proof,indent=2));print(json.dumps(proof))
          PY
      - name: Publish verified research outputs to this feature branch, never archived engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,shutil,json
          root=Path('research/holding_horizon/results');root.mkdir(exist_ok=True)
          for filename in ('results.json','comparison.csv','annual.csv','verification.json'):
              shutil.copyfile(Path('first/report')/filename,root/filename)
          shutil.copyfile('REPRODUCTION.json',root/'REPRODUCTION.json')
          assert not Path('research/relative_futures/account.py').exists()
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',str(root)],check=True)
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert all(f.startswith('research/holding_horizon/results/') for f in staged)
          if staged:subprocess.run(['git','commit','-m','research(holding): retain verified full results and independent reproduction'],check=True)
          Path('PUBLICATION.json').write_text(json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'paths':staged,'engine_copied':False},indent=2))
          PY
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/research/holding-horizon-main-20260906
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holding-horizon-reproduction
          path: |
            REPRODUCTION.json
            PUBLICATION.json
            repeated/comparison.csv
            repeated/annual.csv
            repeat.log
          retention-days: 90
