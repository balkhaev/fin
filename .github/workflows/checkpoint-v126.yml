name: Build research checkpoint V126

on:
  push:
    branches: [agent/checkpoint-v126]
    paths:
      - "scripts/build_checkpoint_v126.py"
      - ".github/workflows/checkpoint-v126.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/checkpoint-v126
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'pandas>=2.2,<3'
      - name: Build checkpoint
        run: |
          set -euxo pipefail
          python scripts/build_checkpoint_v126.py
          test -s docs/checkpoints/v126/CHECKPOINT_V126.json
          test -s docs/checkpoints/v126/RESEARCH_CHECKPOINT_V126_RU.md
          test -s docs/checkpoints/v126/ROBUST_TRIDENT_ANNUAL_RETURNS.csv
          test -s docs/checkpoints/v126/ROBUST_TRIDENT_BOOTSTRAP.csv
          test -s docs/checkpoints/v126/MANIFEST.json
          grep -q 'Current checkpoint: V126' docs/HANDOFF.md
      - name: Verify safety flags
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('docs/checkpoints/v126/CHECKPOINT_V126.json').read_text())
          assert value['live_ready'] is False
          assert value['real_leverage_authorized'] is False
          print(json.dumps(value,indent=2))
          PY
      - name: Commit checkpoint
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/checkpoints/v126 docs/HANDOFF.md scripts/build_checkpoint_v126.py
          git commit -m "Add research checkpoint V126 [skip ci]"
          git push origin HEAD:agent/checkpoint-v126
