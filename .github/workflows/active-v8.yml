name: Active V8 integrity

on:
  push:
    branches:
      - agent/active-v8-relative-trend
    paths:
      - "research/active_v8/**"
      - ".github/workflows/active-v8.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/active_v8/**"
      - ".github/workflows/active-v8.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/active_v8/canonical/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r research/active_v8/canonical/requirements.txt

      - name: Compile canonical source
        run: python -m py_compile research/active_v8/canonical/*.py

      - name: Validate deterministic signal construction
        run: python research/active_v8/canonical/run_candidate.py --self-test
