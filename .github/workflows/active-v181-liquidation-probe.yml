name: Active V181 COIN-M liquidation archive probe

on:
  push:
    branches: [agent/active-v181-v188-liquidation-flow]
    paths:
      - 'research/active_v181_v188/**'
      - '.github/workflows/active-v181-liquidation-probe.yml'
  workflow_dispatch:

concurrency:
  group: active-v181-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/active-v181-v188-liquidation-flow

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install, compile and self-test
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r research/active_v181_v188/requirements.txt
          python -m compileall -q research/active_v181_v188
          python research/active_v181_v188/probe.py --self-test

      - name: Run frozen checksum-aware coverage probe
        run: |
          set -euxo pipefail
          rm -rf research/active_v181_v188/probe_results \
                 research/active_v181_v188/MANIFEST.json
          python research/active_v181_v188/probe.py \
            --root research/active_v181_v188 \
            2>&1 | tee research/active_v181_v188/probe.log

      - name: Verify evidence and safety invariants
        run: |
          set -euxo pipefail
          test -s research/active_v181_v188/probe_results/summary.json
          test -s research/active_v181_v188/probe_results/coverage_gate.json
          test -s research/active_v181_v188/probe_results/coverage.csv
          test -s research/active_v181_v188/probe_results/REPORT_RU.md
          test -s research/active_v181_v188/MANIFEST.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('research/active_v181_v188')
          summary = json.loads((root / 'probe_results/summary.json').read_text())
          assert summary['full_backtest_run'] is False
          assert summary['selection_run'] is False
          assert summary['live_ready'] is False
          assert summary['real_leverage_authorized'] is False
          assert summary['profitability_proven'] is False
          print(json.dumps(summary, indent=2))
          PY

      - name: Commit direct probe evidence
        run: |
          set -euxo pipefail
          find research/active_v181_v188 -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find research/active_v181_v188 -type f -name '*.pyc' -delete || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/active_v181_v188
          if git diff --cached --quiet; then
            echo 'No V181 probe changes'
          else
            git commit -m 'Archive V181 liquidation archive probe [skip ci]'
            git push origin HEAD:agent/active-v181-v188-liquidation-flow
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-v181-liquidation-archive-probe
          path: |
            research/active_v181_v188/probe_results
            research/active_v181_v188/probe.log
            research/active_v181_v188/MANIFEST.json
          if-no-files-found: warn
          retention-days: 30
