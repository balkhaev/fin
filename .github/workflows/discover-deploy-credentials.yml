name: Discover FIN deploy credential availability

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/discover-deploy-credentials.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      S_DEPLOY_HOST: ${{ secrets.DEPLOY_HOST != '' }}
      S_SSH_HOST: ${{ secrets.SSH_HOST != '' }}
      S_SERVER_HOST: ${{ secrets.SERVER_HOST != '' }}
      S_PROD_HOST: ${{ secrets.PROD_HOST != '' }}
      S_VPS_HOST: ${{ secrets.VPS_HOST != '' }}
      S_FIN_DEPLOY_HOST: ${{ secrets.FIN_DEPLOY_HOST != '' }}
      S_DEPLOY_USER: ${{ secrets.DEPLOY_USER != '' }}
      S_SSH_USER: ${{ secrets.SSH_USER != '' }}
      S_SERVER_USER: ${{ secrets.SERVER_USER != '' }}
      S_PROD_USER: ${{ secrets.PROD_USER != '' }}
      S_VPS_USER: ${{ secrets.VPS_USER != '' }}
      S_FIN_DEPLOY_USER: ${{ secrets.FIN_DEPLOY_USER != '' }}
      S_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
      S_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
      S_SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY != '' }}
      S_PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY != '' }}
      S_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY != '' }}
      S_FIN_DEPLOY_KEY: ${{ secrets.FIN_DEPLOY_KEY != '' }}
      S_DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD != '' }}
      S_SSH_PASSWORD: ${{ secrets.SSH_PASSWORD != '' }}
      S_DEPLOY_PORT: ${{ secrets.DEPLOY_PORT != '' }}
      S_SSH_PORT: ${{ secrets.SSH_PORT != '' }}
      S_DEPLOY_PATH: ${{ secrets.DEPLOY_PATH != '' }}
      S_SERVICE_NAME: ${{ secrets.SERVICE_NAME != '' }}
      S_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      S_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN != '' }}
      S_TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY != '' }}
      V_DEPLOY_HOST: ${{ vars.DEPLOY_HOST != '' }}
      V_SSH_HOST: ${{ vars.SSH_HOST != '' }}
      V_SERVER_HOST: ${{ vars.SERVER_HOST != '' }}
      V_PROD_HOST: ${{ vars.PROD_HOST != '' }}
      V_VPS_HOST: ${{ vars.VPS_HOST != '' }}
      V_FIN_DEPLOY_HOST: ${{ vars.FIN_DEPLOY_HOST != '' }}
      V_DEPLOY_USER: ${{ vars.DEPLOY_USER != '' }}
      V_SSH_USER: ${{ vars.SSH_USER != '' }}
      V_DEPLOY_PORT: ${{ vars.DEPLOY_PORT != '' }}
      V_SSH_PORT: ${{ vars.SSH_PORT != '' }}
      V_DEPLOY_PATH: ${{ vars.DEPLOY_PATH != '' }}
      V_SERVICE_NAME: ${{ vars.SERVICE_NAME != '' }}
    steps:
      - name: Print presence only
        shell: bash
        run: |
          set -euo pipefail
          env | grep -E '^(S_|V_)' | sort
          present=$(env | grep -E '^(S_|V_).*=true$' || true)
          if [ -n "$present" ]; then
            echo 'DEPLOY_CREDENTIAL_CANDIDATES_PRESENT=true'
          else
            echo 'DEPLOY_CREDENTIAL_CANDIDATES_PRESENT=false'
          fi
