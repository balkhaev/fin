name: BTC Flow continuous evidence review
on:
  push:
    branches: [research/btc-flow-continuous]
    paths: [.github/workflows/btc-flow-continuous-review.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 33961676637
          name: btc-flow-continuous-research
          path: evidence
      - name: Inspect canonical result, exact tested source, tests and all candidates
        run: |
          python - <<'PY'
          import csv,hashlib,json,pathlib,xml.etree.ElementTree as ET
          base=pathlib.Path('evidence');reports=base/'continuous-report'
          r=json.loads((reports/'results.json').read_text())
          digest=lambda x:hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          assert digest(r)=='bc1a223e40eaf4416ef94b52ff2b4bdd7896db3c22d86c93cc1f4ffc46b5edee'
          tested=base/'continuous-delivery'
          for p in (tested/'research/btc_flow_continuous').glob('*.py'):
              assert p.read_bytes()==pathlib.Path('research/btc_flow_continuous',p.name).read_bytes(),p.name
          test_counts={}
          for name in ('continuous-tests.xml','all-tests.xml'):
              root=ET.parse(base/name).getroot()
              suites=[root] if root.tag=='testsuite' else root.findall('testsuite')
              counts={k:sum(int(x.get(k,'0')) for x in suites) for k in ('tests','failures','errors','skipped')}
              assert counts['failures']==counts['errors']==counts['skipped']==0
              test_counts[name]=counts
          print('TEST_COUNTS',json.dumps(test_counts))
          print('ROOT_TEST_LOG_TAIL','\n'.join((base/'all-tests.log').read_text().splitlines()[-5:]))
          train=json.loads((reports/'all_54_training.json').read_text())
          rows=[]
          for x in train:
              a,b=x['years']
              rows.append({'id':x['id'],'return_2022':a['return_pct'],'return_2023':b['return_pct'],
                 'trades_2022':a['trades'],'trades_2023':b['trades'],
                 'halt_2022':a['halted_at'],'halt_2023':b['halted_at']})
          with (reports/'all_candidates_compact.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          print('ALL_CANDIDATES_CSV\n'+(reports/'all_candidates_compact.csv').read_text())
          finalists=[]
          for x in r['selection']['finalists']:
              z=next(y for y in r['family_later'] if y['id']==x['id'])
              finalists.append({'id':x['id'],'admitted':x['admitted'],
                 'validation':{k:x['validation'][k] for k in ('return_pct','trades','profit_factor','halted_at')},
                 'continuous':{k:z[k] for k in ('return_pct','trades','profit_factor','halted_at','missing_funding_marks')}})
          info={'tests':test_counts,'candidates':len(rows),
                'positive_both_training_years':sum(all(y['return_pct'] is not None and y['return_pct']>0 for y in x['years']) for x in train),
                'finalists':finalists,'result_hash':digest(r),'same_tested_code':True,
                'independent_recalculation':False,'annual_target_proven':False}
          print('EVIDENCE_REVIEW',json.dumps(info))
          (reports/'evidence_review.json').write_text(json.dumps(info,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: btc-flow-continuous-reviewed-evidence
          path: |
            evidence/continuous-report/evidence_review.json
            evidence/continuous-report/all_candidates_compact.csv
          retention-days: 90
