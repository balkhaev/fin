name: Apply runtime causality edge-case refinements

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/agent-runtime-causality-edgecases-fix.yml'

permissions:
  contents: write

jobs:
  refine:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and validate edge-case refinements
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          journal = Path('src/finruntime/journal/atomic.py')
          text = journal.read_text(encoding='utf-8')
          start = text.index('    @staticmethod\n    def _verify_semantics(')
          end = text.index('\n    @staticmethod\n    def _verify_events(', start)
          replacement = indent(
              dedent(
                  '''\
          @staticmethod
          def _verify_semantics(events: Sequence[Mapping[str, Any]]) -> None:
              last_sequence: dict[str, int] = {}
              last_time: dict[str, Any] = {}
              phase_by_cycle: dict[tuple[str, int], int] = {}
              seen_by_cycle: dict[tuple[str, int], set[str]] = {}
              halted: set[str] = set()
              for line_number, event in enumerate(events, 1):
                  strategy_id = str(event["strategy_id"])
                  sequence = int(event["sequence"])
                  event_type = str(event["event_type"])
                  event_time = parse_utc(str(event["event_time_utc"]))
                  previous_sequence = last_sequence.get(strategy_id)
                  if previous_sequence is not None and sequence < previous_sequence:
                      raise JournalCorruptionError(
                          f"journal sequence moved backward on line {line_number}"
                      )
                  last_sequence[strategy_id] = sequence

                  cycle_key = (strategy_id, sequence)
                  seen = seen_by_cycle.setdefault(cycle_key, set())
                  phase = _RUNTIME_EVENT_PHASES.get(event_type)
                  if phase is not None:
                      prior_phase = phase_by_cycle.get(cycle_key, -1)
                      if phase < prior_phase:
                          raise JournalCorruptionError(
                              f"runtime event phase moved backward on line {line_number}"
                          )
                      previous_time = last_time.get(strategy_id)
                      if (
                          previous_time is not None
                          and phase > prior_phase
                          and event_time < previous_time
                      ):
                          raise JournalCorruptionError(
                              f"journal event time moved backward across phases on line {line_number}"
                          )
                      if previous_time is None or event_time > previous_time:
                          last_time[strategy_id] = event_time
                      required = _RUNTIME_EVENT_PREDECESSORS.get(event_type, set())
                      missing = required - seen
                      if missing:
                          raise JournalCorruptionError(
                              f"runtime event {event_type} lacks predecessors {sorted(missing)} "
                              f"on line {line_number}"
                          )
                      phase_by_cycle[cycle_key] = phase
                      seen.add(event_type)
                  elif event_type == "HALT_CLEARED":
                      previous_time = last_time.get(strategy_id)
                      if previous_time is not None and event_time < previous_time:
                          raise JournalCorruptionError(
                              f"HALT_CLEARED moved backward in time on line {line_number}"
                          )
                      last_time[strategy_id] = event_time

                  if event_type == "HALT_RAISED":
                      halted.add(strategy_id)
                  elif event_type == "HALT_CLEARED":
                      if strategy_id not in halted:
                          raise JournalCorruptionError(
                              f"HALT_CLEARED without HALT_RAISED on line {line_number}"
                          )
                      halted.remove(strategy_id)
          '''
              ),
              '    ',
          )
          journal.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          journal_tests = Path('tests/runtime/test_journal.py')
          text = journal_tests.read_text(encoding='utf-8')
          marker = '    def test_corruption_fails_closed(self) -> None:\n'
          if text.count(marker) != 1:
              raise SystemExit('journal test insertion marker changed')
          method = indent(
              dedent(
                  '''\
          def test_same_phase_fill_times_may_arrive_out_of_order(self) -> None:
              prefix = [
                  {
                      "event_type": "SNAPSHOT_ACCEPTED",
                      "event_time_utc": "2026-07-27T00:05:00Z",
                      "strategy_id": "v75_atlas_nx",
                      "sequence": 1,
                      "payload": {"snapshot": 1},
                  },
                  {
                      "event_type": "TARGET_COMPUTED",
                      "event_time_utc": "2026-07-27T00:05:00Z",
                      "strategy_id": "v75_atlas_nx",
                      "sequence": 1,
                      "payload": {"target": 1},
                  },
                  {
                      "event_type": "PLAN_CREATED",
                      "event_time_utc": "2026-07-27T00:05:00Z",
                      "strategy_id": "v75_atlas_nx",
                      "sequence": 1,
                      "payload": {"plan": 1},
                  },
                  {
                      "event_type": "FILL_RECORDED",
                      "event_time_utc": "2026-07-27T00:07:00Z",
                      "strategy_id": "v75_atlas_nx",
                      "sequence": 1,
                      "payload": {"fill": 1},
                  },
                  {
                      "event_type": "FILL_RECORDED",
                      "event_time_utc": "2026-07-27T00:06:00Z",
                      "strategy_id": "v75_atlas_nx",
                      "sequence": 1,
                      "payload": {"fill": 2},
                  },
              ]
              with tempfile.TemporaryDirectory() as directory:
                  journal = AppendOnlyJournal(Path(directory) / "events.jsonl")
                  events = journal.append_many(
                      prefix
                      + [
                          {
                              "event_type": "STATE_COMMITTED",
                              "event_time_utc": "2026-07-27T00:07:00Z",
                              "strategy_id": "v75_atlas_nx",
                              "sequence": 1,
                              "payload": {"state": 1},
                          },
                          {
                              "event_type": "RECONCILIATION_COMPLETED",
                              "event_time_utc": "2026-07-27T00:07:00Z",
                              "strategy_id": "v75_atlas_nx",
                              "sequence": 1,
                              "payload": {"reconciliation": 1},
                          },
                      ]
                  )
                  self.assertEqual(len(events), 7)
                  self.assertEqual(len(journal.verify()), 7)

                  bad = AppendOnlyJournal(Path(directory) / "bad-events.jsonl")
                  bad.append_many(prefix)
                  with self.assertRaises(JournalCorruptionError):
                      bad.append(
                          event_type="STATE_COMMITTED",
                          event_time_utc="2026-07-27T00:06:30Z",
                          strategy_id="v75_atlas_nx",
                          sequence=1,
                          payload={"state": "too-early"},
                      )
                  self.assertEqual(len(bad.verify()), 5)
          '''
              ),
              '    ',
          ) + '\n'
          journal_tests.write_text(text.replace(marker, method + marker, 1), encoding='utf-8')

          integrity_tests = Path('tests/runtime/test_runtime_integrity.py')
          text = integrity_tests.read_text(encoding='utf-8')
          old_import = 'from finruntime.canonical import ContractError\n'
          new_import = 'from finruntime.canonical import ContractError, sha256_id\n'
          if text.count(old_import) != 1:
              raise SystemExit('integrity import marker changed')
          text = text.replace(old_import, new_import, 1)
          marker = 'class PaperExecutionIntegrityTests(unittest.TestCase):\n'
          if text.count(marker) != 1:
              raise SystemExit('compatibility test insertion marker changed')
          compatibility = dedent(
              '''\
          class PaperAccountCompatibilityTests(unittest.TestCase):
              def test_legacy_schema_1_0_hash_and_serialization_remain_valid(self) -> None:
                  current = PaperAccountState.empty(
                      strategy_id="v75_atlas_nx",
                      as_of_utc="2026-07-27T00:05:00Z",
                      starting_cash="10000",
                  )
                  payload = current.to_dict()
                  payload["schema_version"] = "1.0"
                  payload.pop("active_plan_filled_quantities")
                  payload.pop("active_plan_fill_event_ids")
                  payload["account_hash"] = sha256_id(
                      {
                          key: value
                          for key, value in payload.items()
                          if key != "account_hash"
                      }
                  )

                  legacy = PaperAccountState(**payload)
                  legacy.validate()
                  self.assertEqual(legacy.to_dict(), payload)


          '''
          )
          integrity_tests.write_text(text.replace(marker, compatibility + marker, 1), encoding='utf-8')
          PY
          git diff --check
          PYTHONPATH=src python -m compileall -q src/finruntime tests/runtime
          PYTHONPATH=src python -m unittest discover -s tests/runtime -p 'test_*.py' -v
          python scripts/verify_runtime.py --contracts-only
          rm .github/workflows/agent-runtime-causality-edgecases.yml
          rm .github/workflows/agent-runtime-causality-edgecases-fix.yml
          git config user.name 'OpenAI Agent'
          git config user.email 'agent@openai.com'
          git add -A
          git commit -m 'Refine runtime causality edge cases'
          git push origin HEAD:"$HEAD_REF"
