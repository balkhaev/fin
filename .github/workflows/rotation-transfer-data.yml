name: Rotation transfer public data
on:
  push:
    branches: [research/rotation-venue-transfer-20260906]
    paths: [.github/workflows/rotation-transfer-data.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r research/btc_flow/requirements.txt
      - run: python -m pytest -q tests/test_rotation_venue_data.py --junitxml=source-tests.xml
      - name: Official public spot history only, no credentials or exchange actions
        run: python -m research.rotation_venue_transfer.data --out okx-data > acquisition.log 2>&1 || { cat acquisition.log; exit 1; }
      - name: Read back and hash-verify normalized sources
        run: |
          python - <<'PY'
          import json,pathlib
          from research.rotation_venue_transfer.data import load
          frames,audit=load(pathlib.Path('okx-data'))
          pathlib.Path('source-audit.json').write_text(json.dumps(audit,indent=2))
          print(json.dumps(audit))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rotation-transfer-okx-source
          path: |
            okx-data/
            acquisition.log
            source-tests.xml
            source-audit.json
          retention-days: 90
