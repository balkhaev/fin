name: Diagnose exact V75 historical transports

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/agent-runtime-v75-materialize.yml'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect V138 contents and partial V87 XZ stream
        run: |
          set -euxo pipefail
          git fetch origin agent/runtime-v75-materialization:refs/remotes/origin/agent/runtime-v75-materialization
          mkdir -p scripts
          git show origin/agent/runtime-v75-materialization:scripts/recover_v75_v138.py \
            > scripts/recover_v75_v138.py
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import importlib.util
          import io
          import json
          import lzma
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          spec = importlib.util.spec_from_file_location(
              'recover_v75', root / 'scripts/recover_v75_v138.py'
          )
          if spec is None or spec.loader is None:
              raise SystemExit('cannot load recovery module')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          report: dict[str, object] = {}
          archive, metadata = module.load_v138_archive()
          with tempfile.TemporaryDirectory(prefix='v138-diagnostic-') as directory:
              extracted_root = Path(directory)
              extracted, skipped = module.safe_extract(archive, extracted_root)
              matches: dict[str, object] = {}
              for destination, expected_sha in module.EXPECTED_TARGETS.items():
                  exact = module.matching_files(extracted_root, destination, expected_sha)
                  basename = Path(destination).name
                  same_name = sorted(
                      {
                          str(path.relative_to(extracted_root)): {
                              'bytes': path.stat().st_size,
                              'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                          }
                          for path in extracted_root.rglob(basename)
                          if path.is_file()
                      }.items()
                  )
                  matches[destination] = {
                      'expected_sha256': expected_sha,
                      'exact_matches': [str(path.relative_to(extracted_root)) for path in exact],
                      'same_basename_candidates': [
                          {'path': path, **details} for path, details in same_name
                      ],
                  }
              report['v138'] = {
                  'metadata': metadata,
                  'extracted_count': len(extracted),
                  'skipped_count': len(skipped),
                  'matches': matches,
              }

          def git_bytes(commit: str, path: str) -> bytes:
              return module.git_show(commit, path)

          v87_encoded = b''.join(
              git_bytes(module.V87B_COMMIT, '.bootstrap_v87/payload/part_000.txt').split()
          )
          v87_prefix = base64.b85decode(v87_encoded)
          part0_encoded = b''.join(
              git_bytes(module.V87B_COMMIT, '.bootstrap_v87b/payload/part_000.txt').split()
          )
          part1_encoded = b''.join(
              git_bytes(module.V87B_COMMIT, '.bootstrap_v87b/payload/part_001.txt').split()
          )
          part0 = base64.b64decode(part0_encoded, validate=True)
          part1 = base64.b64decode(part1_encoded, validate=True)
          stream = part0 + part1

          common = 0
          for left, right in zip(v87_prefix, stream):
              if left != right:
                  break
              common += 1

          overlap = 0
          maximum = min(len(v87_prefix), len(part1))
          for size in range(maximum, 0, -1):
              if v87_prefix[-size:] == part1[:size]:
                  overlap = size
                  break

          def partial_xz(payload: bytes) -> dict[str, object]:
              decompressor = lzma.LZMADecompressor(format=lzma.FORMAT_XZ)
              output = bytearray()
              error: str | None = None
              error_offset: int | None = None
              for offset in range(0, len(payload), 256):
                  try:
                      output.extend(decompressor.decompress(payload[offset:offset + 256]))
                  except lzma.LZMAError as exc:
                      error = repr(exc)
                      error_offset = offset
                      break
              return {
                  'compressed_bytes': len(payload),
                  'ends_with_xz_footer_magic': payload.endswith(b'YZ'),
                  'eof': bool(getattr(decompressor, 'eof', False)),
                  'unused_data_bytes': len(getattr(decompressor, 'unused_data', b'')),
                  'error': error,
                  'error_offset': error_offset,
                  'decompressed_prefix_bytes': len(output),
                  'decompressed_prefix_sha256': hashlib.sha256(output).hexdigest(),
                  'decompressed_prefix': bytes(output),
              }

          def parse_tar_prefix(payload: bytes) -> list[dict[str, object]]:
              rows: list[dict[str, object]] = []
              offset = 0
              while offset + 512 <= len(payload):
                  header = payload[offset:offset + 512]
                  if not any(header):
                      break
                  name = header[:100].split(b'\0', 1)[0]
                  prefix = header[345:500].split(b'\0', 1)[0]
                  full_name = b'/'.join(part for part in (prefix, name) if part)
                  try:
                      size_text = header[124:136].split(b'\0', 1)[0].strip() or b'0'
                      size = int(size_text, 8)
                  except ValueError:
                      break
                  data_start = offset + 512
                  data_end = data_start + size
                  complete = data_end <= len(payload)
                  data = payload[data_start:data_end] if complete else b''
                  rows.append(
                      {
                          'path': full_name.decode('utf-8', errors='replace'),
                          'size': size,
                          'complete': complete,
                          'sha256': hashlib.sha256(data).hexdigest() if complete else None,
                      }
                  )
                  if not complete:
                      break
                  offset = data_start + ((size + 511) // 512) * 512
              return rows

          trials: dict[str, object] = {}
          for label, payload in {
              'v87_prefix': v87_prefix,
              'v87b_stream': stream,
              'prefix_plus_part1': v87_prefix + part1,
              'prefix_plus_part1_without_overlap': v87_prefix + part1[overlap:],
          }.items():
              result = partial_xz(payload)
              decompressed = result.pop('decompressed_prefix')
              members = parse_tar_prefix(decompressed)
              result['tar_prefix_members'] = members
              result['expected_hash_matches'] = [
                  row
                  for row in members
                  if row.get('sha256') in set(module.EXPECTED_TARGETS.values())
              ]
              trials[label] = result

          report['v87'] = {
              'v87_prefix_bytes': len(v87_prefix),
              'v87b_part0_bytes': len(part0),
              'v87b_part1_bytes': len(part1),
              'v87b_stream_bytes': len(stream),
              'common_prefix_bytes': common,
              'prefix_equals_part0_prefix': v87_prefix == part0[:len(v87_prefix)],
              'suffix_prefix_overlap_bytes': overlap,
              'stream_ends_with_xz_footer_magic': stream.endswith(b'YZ'),
              'trials': trials,
          }
          print(json.dumps(report, ensure_ascii=False, indent=2, allow_nan=False))
          PY
