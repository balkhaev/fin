name: Materialize exact V75 evidence on main

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/agent-runtime-v75-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover, verify and commit direct V75 evidence
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euxo pipefail
          git fetch origin agent/runtime-v75-materialization:refs/remotes/origin/agent/runtime-v75-materialization
          mkdir -p scripts
          git show origin/agent/runtime-v75-materialization:scripts/recover_v75_v138.py \
            > scripts/recover_v75_v138.py
          chmod +x scripts/recover_v75_v138.py
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/recover_v75_v138.py')
          text = path.read_text(encoding='utf-8')
          old = 'archive_sources = [load_v138_archive(), load_v87b_archive()]'
          new = 'archive_sources = [load_v138_archive()]'
          if text.count(old) != 1:
              raise SystemExit('recovery archive source marker changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python scripts/recover_v75_v138.py --write \
            2>&1 | tee /tmp/v75-recovery.log

          test "$(sha256sum research/active_v131_v138/dependencies/atlas/source/v75_operational_feedback_engine.py | cut -d' ' -f1)" = \
            '3303cd91511bca0be81ade21272e1e8ba6f76adf826d238e9c4bd7cbe78f69fc'
          test "$(sha256sum research/active_v131_v138/results/v136/v75_original_stress_equity.csv | cut -d' ' -f1)" = \
            '0f578a56132ec9858031cc6ad5cc919f732e66990625c2fdd6ff91143e44956b'
          test "$(sha256sum research/active_v131_v138/results/v136/v75_original_annual_returns.csv | cut -d' ' -f1)" = \
            'e3de37108b5d459ad9f8324388a3a34571f29c5c594a77d82477cb812c8e0d25'

          python -m py_compile \
            research/active_v131_v138/dependencies/atlas/source/v75_operational_feedback_engine.py
          bad=$(find research/active_v131_v138/dependencies/atlas/source \
            research/active_v131_v138/results/v136 docs/checkpoints/runtime-v1 \
            -type f \( -name '*.zip' -o -name '*.tar' -o -name '*.xz' -o -name '*.b64' -o -name '*.pyfrag' \) \
            -print || true)
          test -z "$bad" || { printf '%s\n' "$bad"; exit 1; }

          PYTHONPATH=src python -m compileall -q src/finruntime tests/runtime scripts/recover_v75_v138.py
          PYTHONPATH=src python -m unittest discover -s tests/runtime -p 'test_*.py' -v
          PYTHONPATH=src python -m finruntime self-test
          python scripts/verify_runtime.py --provenance-only --profile v75_atlas_nx
          python scripts/verify_runtime.py --contracts-only

          find research/active_v131_v138/dependencies/atlas/source \
            research/active_v131_v138/results/v136 docs/checkpoints/runtime-v1 \
            -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find research/active_v131_v138/dependencies/atlas/source \
            research/active_v131_v138/results/v136 docs/checkpoints/runtime-v1 \
            -type f -name '*.pyc' -delete || true
          rm .github/workflows/agent-runtime-v75-materialize.yml

          git config user.name 'OpenAI Agent'
          git config user.email 'agent@openai.com'
          git add -A
          git commit -m 'Materialize exact V75 source and regression evidence'
          git push origin HEAD:"$HEAD_REF"
