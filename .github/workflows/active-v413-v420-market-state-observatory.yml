name: Active V413-V420 market-state observatory

on:
  push:
    branches: [agent/active-v413-v420-market-state-observatory]
    paths:
      - 'research/market_state_v413_v420/**'
      - '.github/workflows/active-v413-v420-market-state-observatory.yml'
  pull_request:
    branches: [agent/refine-v405-v412-champion-execution]
    paths:
      - 'research/market_state_v413_v420/**'
      - '.github/workflows/active-v413-v420-market-state-observatory.yml'
  workflow_dispatch:

concurrency:
  group: active-v413-v420-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  observatory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/active-v413-v420-market-state-observatory

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install, compile and causal self-test
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r research/market_state_v413_v420/requirements.txt
          python -m compileall -q \
            research/market_state_v413_v420 \
            research/active_v9
          python research/market_state_v413_v420/run_observatory.py --self-test

      - name: Restore immutable V9 public archive cache
        uses: actions/cache@v4
        with:
          path: .cache/v9
          key: binance-usdm-daily-fixed-universe-2020-2026-v9

      - name: Build frozen market-state observatory
        run: |
          set -euxo pipefail
          rm -rf research/market_state_v413_v420/results \
                 research/market_state_v413_v420/MANIFEST.json \
                 docs/checkpoints/v420
          python research/market_state_v413_v420/run_observatory.py \
            --root research/market_state_v413_v420 \
            --cache .cache/v9 \
            2>&1 | tee research/market_state_v413_v420/run.log

      - name: Materialize V420 checkpoint
        run: |
          set -euxo pipefail
          root=research/market_state_v413_v420/results
          test -s "$root/coverage_gate.json"
          test -s "$root/STATE_MODEL.json"
          test -s "$root/FROZEN_DECISION.json"
          test -s "$root/state_quality.json"
          test -s "$root/market_state_daily.csv"
          test -s "$root/state_centroids.csv"
          test -s "$root/state_transition_matrix.csv"
          test -s "$root/REPORT_RU.md"
          mkdir -p docs/checkpoints/v420
          cp "$root/STATE_MODEL.json" docs/checkpoints/v420/STATE_MODEL_V420.json
          cp "$root/FROZEN_DECISION.json" docs/checkpoints/v420/FROZEN_DECISION_V420.json
          cp "$root/state_quality.json" docs/checkpoints/v420/STATE_QUALITY_V420.json
          cp "$root/REPORT_RU.md" docs/checkpoints/v420/MARKET_STATE_OBSERVATORY_V420_RU.md

      - name: Verify chronology, role and safety
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/market_state_v413_v420/results')
          model = json.loads((root / 'STATE_MODEL.json').read_text())
          decision = json.loads((root / 'FROZEN_DECISION.json').read_text())
          quality = json.loads((root / 'state_quality.json').read_text())
          assert model['state_count'] == 6
          assert model['selection_uses_strategy_returns'] is False
          assert model['selection_uses_2024'] is False
          assert model['selection_uses_2025'] is False
          assert model['selection_uses_2026'] is False
          assert decision['market_state_model_is_trading_signal'] is False
          assert decision['strategy_parameter_changes_permitted'] is False
          assert decision['allocation_changes_permitted'] is False
          assert decision['historical_parameter_search_closed'] is True
          assert decision['integration_permitted'] is False
          assert decision['live_ready'] is False
          assert decision['real_leverage_authorized'] is False
          assert decision['profitability_proven'] is False
          assert decision['status'] in {
              'observatory_ready_for_forward_attribution',
              'observatory_materialized_with_quality_warnings',
          }
          print(json.dumps({'decision': decision, 'quality': quality}, indent=2))
          PY
          find research/market_state_v413_v420 docs/checkpoints/v420 -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find research/market_state_v413_v420 docs/checkpoints/v420 -type f -name '*.pyc' -delete || true

      - name: Commit observatory evidence
        if: github.event_name != 'pull_request'
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A research/market_state_v413_v420 docs/checkpoints/v420
          if git diff --cached --quiet; then
            echo 'No V413-V420 changes'
          else
            git commit -m 'Archive V413-V420 market-state observatory evidence [skip ci]'
            git push origin HEAD:agent/active-v413-v420-market-state-observatory
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-v413-v420-market-state-observatory
          path: |
            research/market_state_v413_v420/results
            research/market_state_v413_v420/run.log
            docs/checkpoints/v420
          if-no-files-found: warn
          retention-days: 30
