name: Active V103-V110 global rotation research

on:
  push:
    branches: [agent/active-v103-v110-global-rotation]
    paths:
      - "research/active_v103_v110/**"
      - ".github/workflows/active-v103-v110-global-rotation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/active-v103-v110-global-rotation

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert direct ATLAS input and readable source
        run: |
          set -euxo pipefail
          test -s research/active_v88_v94/inputs/atlas/v75_stress_equity.csv
          bad=$(find research/active_v103_v110 -type f \( -name '*.zip' -o -name '*.b64' -o -name '*.pyfrag' \) -print || true)
          test -z "$bad"

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/active_v103_v110/requirements.txt
          python -m compileall -q research/active_v103_v110
          cd research/active_v103_v110
          python run_research.py --self-test

      - name: Restore fixed-universe Yahoo cache
        uses: actions/cache@v4
        with:
          path: .cache/v103_v110
          key: global-sector-country-yahoo-2007-2026-v1

      - name: Run full V103-V110 research
        run: |
          set -euxo pipefail
          rm -rf artifacts/active_v103_v110
          mkdir -p artifacts/active_v103_v110
          cd research/active_v103_v110
          python run_research.py \
            --cache ../../../.cache/v103_v110 \
            --atlas ../active_v88_v94/inputs/atlas/v75_stress_equity.csv \
            --output ../../../artifacts/active_v103_v110 \
            2>&1 | tee ../../../artifacts/active_v103_v110/run.log

      - name: Materialize raw data and readable results
        run: |
          set -euxo pipefail
          rm -rf research/active_v103_v110/results research/active_v103_v110/inputs
          mkdir -p research/active_v103_v110/results research/active_v103_v110/inputs/raw/yahoo
          cp -r artifacts/active_v103_v110/. research/active_v103_v110/results/
          cp .cache/v103_v110/*.json research/active_v103_v110/inputs/raw/yahoo/
          find research/active_v103_v110 -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find research/active_v103_v110 -type f -name '*.pyc' -delete || true

      - name: Verify frozen result contract
        run: |
          set -euxo pipefail
          test -s research/active_v103_v110/results/summary.json
          test -s research/active_v103_v110/results/selection_proof_before_post2020.json
          test -s research/active_v103_v110/results/yearly.csv
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('research/active_v103_v110/results/summary.json').read_text())
          assert summary['live_ready'] is False
          assert summary['real_leverage_authorized'] is False
          assert summary['selection_proof_sha256']
          print(json.dumps(summary,indent=2))
          PY

      - name: Commit source, raw data and results directly to fin
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/active_v103_v110
          git commit -m "Add Active V103-V110 global rotation results [skip ci]"
          git push origin HEAD:agent/active-v103-v110-global-rotation

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-v103-v110-global-rotation
          path: artifacts/active_v103_v110
          if-no-files-found: warn
          retention-days: 30
