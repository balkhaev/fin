name: Active V261-V268 fixed-universe liquidity quality

on:
  push:
    branches: [agent/active-v261-v268-liquidity-quality]
    paths:
      - 'research/active_v261_v268/**'
      - '.github/workflows/active-v261-v268-liquidity-quality.yml'
  pull_request:
    branches: [agent/active-v253-v260-low-risk-factor]
    paths:
      - 'research/active_v261_v268/**'
      - '.github/workflows/active-v261-v268-liquidity-quality.yml'
  workflow_dispatch:

concurrency:
  group: active-v261-v268-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/active-v261-v268-liquidity-quality

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install, compile and causal self-test
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r research/active_v261_v268/requirements.txt
          python -m compileall -q research/active_v261_v268 research/active_v253_v260 research/active_v9
          python research/active_v261_v268/run_research.py --self-test

      - name: Restore immutable V9 public archive cache
        uses: actions/cache@v4
        with:
          path: .cache/v9
          key: binance-usdm-daily-fixed-universe-2020-2026-v9

      - name: Run frozen 144-policy liquidity research
        run: |
          set -euxo pipefail
          rm -rf research/active_v261_v268/results \
                 research/active_v261_v268/MANIFEST.json \
                 docs/checkpoints/v268
          python research/active_v261_v268/run_research.py \
            --root research/active_v261_v268 \
            --cache .cache/v9 \
            2>&1 | tee research/active_v261_v268/run.log

      - name: Materialize V268 checkpoint
        run: |
          set -euxo pipefail
          test -s research/active_v261_v268/results/summary.json
          test -s research/active_v261_v268/results/FROZEN_DECISION.json
          test -s research/active_v261_v268/results/coverage_gate.json
          test -s research/active_v261_v268/results/selection_proof_before_validation.json
          test -s research/active_v261_v268/results/REPORT_RU.md
          mkdir -p docs/checkpoints/v268
          cp research/active_v261_v268/results/summary.json docs/checkpoints/v268/CHECKPOINT_V268.json
          cp research/active_v261_v268/results/REPORT_RU.md docs/checkpoints/v268/RESEARCH_CHECKPOINT_V268_RU.md
          if test -s research/active_v261_v268/results/ANNUAL_RETURNS.csv; then
            cp research/active_v261_v268/results/ANNUAL_RETURNS.csv docs/checkpoints/v268/ANNUAL_RETURNS.csv
          fi

      - name: Verify frozen evidence and safety
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/active_v261_v268')
          summary = json.loads((root / 'results/summary.json').read_text())
          proof = json.loads((root / 'results/selection_proof_before_validation.json').read_text())
          if not proof.get('selection_not_run'):
              assert proof['selection_uses_2024'] is False
              assert proof['selection_uses_2025'] is False
              assert proof['selection_uses_2026'] is False
          assert summary['integration_permitted'] is False
          assert summary['live_ready'] is False
          assert summary['real_leverage_authorized'] is False
          assert summary['profitability_proven'] is False
          print(json.dumps(summary, indent=2))
          PY
          find research/active_v261_v268 docs/checkpoints/v268 -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find research/active_v261_v268 docs/checkpoints/v268 -type f -name '*.pyc' -delete || true

      - name: Commit readable source and frozen decision
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A research/active_v261_v268 docs/checkpoints/v268
          if git diff --cached --quiet; then
            echo 'No V261-V268 changes'
          else
            git commit -m 'Archive V261-V268 liquidity quality evidence [skip ci]'
            git push origin HEAD:agent/active-v261-v268-liquidity-quality
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-v261-v268-liquidity-quality
          path: |
            research/active_v261_v268/results
            research/active_v261_v268/run.log
            docs/checkpoints/v268
          if-no-files-found: warn
          retention-days: 30
