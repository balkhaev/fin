name: BTC Frontier V2 replay
on:
  push:
    branches: [research/btc-frontier-v2]
    paths:
      - research/btc_frontier_v2/**
      - tests/test_btc_frontier_v2.py
      - .github/workflows/btc-frontier-v2-replay.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btc-frontier-v2-replay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r research/btc_flow/requirements.txt
      - run: python -m pytest -q tests/test_btc_flow.py tests/test_btc_frontier_v2.py --junitxml=v2-tests.xml
      - name: Re-download checksum-verified discovery data
        run: python -m research.btc_flow.download --out btc-evidence
      - name: Reproduce selection using pre-2025 data only
        run: python -m research.btc_frontier_v2.study --phase discover --data btc-evidence --out v2-discovery
      - name: Compare selection to pre-test commitment
        run: |
          python - <<'PY'
          import json,pathlib
          lock=json.loads(pathlib.Path('research/btc_frontier_v2/selection_lock.json').read_text())
          actual=json.loads(pathlib.Path('v2-discovery/selection.json').read_text())
          assert actual['selected']['config']==lock['selected']
          assert [x['config'] for x in actual['families']]==lock['family_configs']
          assert actual['admitted_count']==0
          assert actual['fresh_data_used_for_selection'] is False
          assert actual['post_2024_used_for_selection'] is False
          PY
      - name: Fetch August evidence after selection
        run: python -m research.btc_frontier_v2.download_fresh --out fresh-evidence
      - name: Reproduce evaluation and execution stresses
        run: python -m research.btc_frontier_v2.study --phase evaluate --data btc-evidence --selection v2-discovery/selection.json --fresh fresh-evidence --out v2-report
      - name: Compare numerical evidence; not a profitability pass
        run: |
          python - <<'PY'
          import json,math,pathlib
          expected=json.loads(pathlib.Path('research/btc_frontier_v2/summary.json').read_text())
          actual=json.loads(pathlib.Path('v2-report/results.json').read_text())
          assert actual['fresh_data']==expected['fresh_data']
          for row in expected['annual_selected']:
              got=next(x for x in actual['annual'] if x['scenario']=='selected' and x['year']==row['year'])
              for key in ('return_pct','trades','max_drawdown_pct'):
                  assert math.isclose(got[key],row[key],abs_tol=1e-6),(key,got[key],row[key])
          for row in expected['evaluations']:
              got=next(x for x in actual['runs'] if x['scenario']==row['scenario'] and x['period']==row['period'])
              for key,value in row.items():
                  if value is None: assert got[key] is None
                  elif isinstance(value,str): assert got[key]==value
                  else: assert math.isclose(got[key],value,abs_tol=1e-6),(key,got[key],value)
          assert actual['target_achieved'] is False and actual['live_ready'] is False
          print('Numerical evidence reproduced. No 500% or live-readiness claim.')
          PY
      - name: Bundle source and manifests
        if: always()
        run: |
          mkdir -p v2-report/source/research v2-report/source/tests
          cp -r research/btc_frontier_v2 research/btc_flow v2-report/source/research/
          cp tests/test_btc_frontier_v2.py tests/test_btc_flow.py v2-report/source/tests/
          find v2-report/source -type d -name __pycache__ -prune -exec rm -rf '{}' +
          cp btc-evidence/manifest.json v2-report/old_source_manifest.json || true
          cp fresh-evidence/manifest.json v2-report/fresh_source_manifest.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-frontier-v2-reproducible-results
          path: |
            v2-discovery/
            v2-report/
            v2-tests.xml
          retention-days: 90
