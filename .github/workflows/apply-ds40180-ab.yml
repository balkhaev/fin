name: Apply DS-40/180 forward A-B observatory

on:
  push:
    branches: [agent/ds40180-forward-ab]
    paths:
      - '.github/workflows/apply-ds40180-ab.yml'
      - 'scripts/apply_ds40180_ab.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-ds40180-ab.yml'
      - 'scripts/apply_ds40180_ab.py'
      - 'src/finruntime/strategies/_ds40180_ab.py'
      - 'src/finruntime/strategies/_ds40180_v1_*.py'
      - 'tests/runtime/test_ds40180_ab.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-ds40180-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-commit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ds40180-forward-ab
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply forward A-B integration
        run: |
          set -euxo pipefail
          python scripts/apply_ds40180_ab.py

      - name: Validate complete repository
        run: |
          set -euxo pipefail
          python -m compileall -q src/finruntime tests/runtime scripts/check_paper_stack.py
          python -m unittest discover -s tests/runtime -p 'test_ds40180_t50c3_paper.py' -v
          python -m unittest discover -s tests/runtime -p 'test_ds40180_ab.py' -v
          python -m unittest tests.runtime.test_strategy_hub -v
          python scripts/verify_runtime.py --full
          python -m finruntime.strategies.ds40180_t50c3_paper --help | grep -F -- '--ab-snapshot'

      - name: Commit integrated source
        run: |
          set -euxo pipefail
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/finruntime/strategies/ds40180_t50c3_paper.py \
            src/finruntime/observability/strategy_hub.py \
            scripts/check_paper_stack.py \
            config/strategies/ds40180_t50c3_okx_paper.json \
            docs/DS40180_T50C3_PAPER_RU.md
          if git diff --cached --quiet; then
            echo 'DS-40/180 A-B source is already integrated'
          else
            git diff --cached --stat
            git commit -m 'Integrate DS-40/180 forward A-B observatory'
            git push origin HEAD:agent/ds40180-forward-ab
          fi
