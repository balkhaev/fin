name: Rotation venue transfer validation
on:
  push:
    branches: [research/rotation-venue-transfer-20260906]
    paths:
      - research/rotation_venue_transfer/*.py
      - tests/test_rotation_venue*.py
      - .github/workflows/rotation-transfer-validation.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: rotation-transfer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . -r research/btc_flow/requirements.txt scipy
      - name: Source and evaluation tests, then full repository regression
        run: |
          python -m pytest -q tests/test_rotation_venue*.py --junitxml=transfer-tests.xml
          python -m pytest -q tests --junitxml=root-tests.xml > root-tests.log 2>&1 || { tail -n 80 root-tests.log; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34023478462
          name: rotation-stability-complete-package
          path: prior
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34024495798
          name: rotation-transfer-okx-source
          path: new-source
      - name: Run fixed cross-venue arms without changing signal rules
        run: python -m research.rotation_venue_transfer.study --binance prior/rotation-data --okx new-source/okx-data --prior prior --out report > research.log 2>&1 || { tail -n 100 research.log; exit 1; }
      - name: Read numerical evidence and retain every scenario
        run: |
          python - <<'PY'
          import pathlib,json
          p=pathlib.Path
          print(p('research.log').read_text())
          r=json.loads(p('report/results.json').read_text())
          for row in r['rows']:
              if row['arm']=='okx_to_okx' and row['scenario']=='base':
                  print('PURE_TRANSFER_YEARS',row['period'],json.dumps(row['annual']))
                  print('PURE_TRANSFER_MONTHS',row['period'],json.dumps(row['monthly']))
          print('ROOT_TESTS',p('root-tests.log').read_text().splitlines()[-1])
          PY
      - name: Retain exact source and checksum identities
        if: always()
        run: |
          mkdir -p delivery/research delivery/tests
          cp -r research/rotation_venue_transfer research/rotation_stability research/annual_rotation delivery/research/
          cp tests/test_rotation_venue*.py delivery/tests/
          cp research/btc_flow/requirements.txt delivery/requirements.txt
          git rev-parse HEAD > delivery/TESTED_COMMIT.txt
          find delivery -type d -name __pycache__ -prune -exec rm -rf '{}' +
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rotation-transfer-research-evidence
          path: |
            delivery/
            report/
            new-source/okx-data/
            prior/rotation-data/
            prior/static-report/results.json
            prior/delivery/research/annual_rotation/
            research.log
            transfer-tests.xml
            root-tests.xml
            root-tests.log
          retention-days: 90
  reproduce:
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r research/btc_flow/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: rotation-transfer-research-evidence
          path: first
      - name: Independent clean-run full recomputation on same hashed inputs
        run: python -m research.rotation_venue_transfer.study --binance first/prior/rotation-data --okx first/new-source/okx-data --prior first/prior --out reproduced > reproduce.log 2>&1 || { tail -n 100 reproduce.log; exit 1; }
      - name: Compare all numerical reports and exact exported execution ledgers
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path
          a=json.loads(p('first/report/results.json').read_text());b=json.loads(p('reproduced/results.json').read_text())
          assert a==b,'Numerical report disagreement'
          files=sorted(p('first/report').glob('*_fills.csv'))
          assert len(files)==18
          for path in files:assert path.read_bytes()==(p('reproduced')/path.name).read_bytes(),path.name
          assert len(a['rows'])==18 and a['live_orders'] is False
          verify=json.loads(p('reproduced/verification.json').read_text())
          verify.update(clean_runner_full_result_equal=True,exported_ledgers_equal=len(files),
              independent_market_time=False,independent_implementation=False,local_execution=False,live_orders=False)
          p('REPRODUCTION.json').write_text(json.dumps(verify,indent=2))
          print(json.dumps(verify))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rotation-transfer-independent-reproduction
          path: |
            REPRODUCTION.json
            reproduced/
            reproduce.log
          retention-days: 90
