name: Runtime V517 shadow profile

on:
  push:
    branches: [agent/runtime-v517-shadow-profile]
    paths:
      - 'src/finruntime/profiles/**'
      - 'src/finruntime/registry.py'
      - 'config/strategies/v517_tristate_guard_shadow.json'
      - 'tests/runtime/test_v517_risk_budget.py'
      - 'scripts/build_v517_shadow_snapshot.py'
      - 'docs/checkpoints/runtime-v1/V517_*'
      - 'docs/checkpoints/runtime-v1/STRATEGY_REGISTRY.json'
      - '.github/workflows/runtime-v517-profile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/finruntime/profiles/**'
      - 'src/finruntime/registry.py'
      - 'config/strategies/v517_tristate_guard_shadow.json'
      - 'tests/runtime/test_v517_risk_budget.py'
      - 'scripts/build_v517_shadow_snapshot.py'
      - 'docs/checkpoints/runtime-v1/V517_*'
      - 'docs/checkpoints/runtime-v1/STRATEGY_REGISTRY.json'
      - '.github/workflows/runtime-v517-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install and compile
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check -e .
          python -m compileall -q src scripts tests

      - name: Run complete runtime suite
        run: |
          set -euxo pipefail
          python -m unittest discover -s tests/runtime -p 'test_*.py' -v

      - name: Verify provenance, registry and no-live contract
        run: |
          set -euxo pipefail
          python scripts/verify_runtime.py --full

      - name: Exercise V517 snapshot builder end to end
        run: |
          set -euxo pipefail
          rm -rf /tmp/v517-fixture
          mkdir -p /tmp/v517-fixture
          python - <<'PY'
          import csv
          from datetime import datetime, timedelta, timezone
          from decimal import Decimal
          from pathlib import Path
          from finruntime.canonical import canonical_json_text
          from finruntime.models import StrategySnapshot

          root=Path('/tmp/v517-fixture')
          start=datetime(2026,1,1,tzinfo=timezone.utc)
          decision=(start+timedelta(days=90,hours=1)).isoformat().replace('+00:00','Z')
          primary=StrategySnapshot.create(
              strategy_id='v75_atlas_nx',
              strategy_version='runtime-v1',
              decision_time_utc=decision,
              market_snapshot_id='sha256:'+'a'*64,
              state_sequence=90,
              targets={'spot':{'BTC/USDT':'0.20'},'perp':{'ETH/USDT:USDT':'-0.10'}},
              gross_target='0.30',
              cash_target='0.70',
          )
          (root/'primary.json').write_text(canonical_json_text(primary.to_dict())+'\n')
          value=Decimal('10000')
          with (root/'history.csv').open('w',newline='') as handle:
              writer=csv.DictWriter(handle,fieldnames=['as_of_utc','equity','source_sha256'])
              writer.writeheader()
              for number in range(90):
                  value*=Decimal('1.01')
                  writer.writerow({
                      'as_of_utc':(start+timedelta(days=number)).isoformat().replace('+00:00','Z'),
                      'equity':format(value,'f'),
                      'source_sha256':'sha256:'+format(number+1,'064x'),
                  })
          PY
          python scripts/build_v517_shadow_snapshot.py \
            --primary-snapshot /tmp/v517-fixture/primary.json \
            --equity-history /tmp/v517-fixture/history.csv \
            --initialize-state \
            --profile-equity 10000 \
            --profile-high-water 10000 \
            --maximum-runtime-leverage 1.10 \
            --output-snapshot /tmp/v517-fixture/shadow.json \
            --output-decision /tmp/v517-fixture/decision.json \
            --output-state /tmp/v517-fixture/state.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/v517-fixture')
          snapshot=json.loads((root/'shadow.json').read_text())
          decision=json.loads((root/'decision.json').read_text())
          assert snapshot['strategy_id']=='v517_tristate_guard_shadow'
          assert snapshot['risk']['live_execution_permitted'] is False
          assert decision['requested_leverage']=='2.075'
          assert decision['selected_leverage']=='1.1'
          assert decision['runtime_cap_applied'] is True
          PY
