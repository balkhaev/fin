name: Active V149-V154 official dated VIX research

on:
  push:
    branches: [agent/active-v147-v154-cme-dated-contracts]
    paths:
      - 'research/active_v147_v154/source/**'
      - 'research/active_v147_v154/requirements.txt'
      - '.github/workflows/active-v149-v154-dated-vix-research.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/active_v147_v154/source/**'
      - 'research/active_v147_v154/requirements.txt'
      - '.github/workflows/active-v149-v154-dated-vix-research.yml'
  workflow_dispatch:

concurrency:
  group: active-v149-v154-dated-vix-research
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/active-v147-v154-cme-dated-contracts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install, compile and causal smoke tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/active_v147_v154/requirements.txt
          python -m compileall -q research/active_v147_v154/source
          python research/active_v147_v154/source/canonical_runner.py --self-test
      - name: Assert V147/V148 data-access gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cme=json.loads(Path('research/active_v147_v154/probe_results/summary.json').read_text())
          cboe=json.loads(Path('research/active_v147_v154/cboe_probe_results/summary.json').read_text())
          assert cme['status'] == 'official_dated_settlement_access_blocked'
          assert cboe['status'] == 'official_cboe_dated_contract_access_confirmed'
          assert cboe['full_v149_v154_permitted'] is True
          PY
      - name: Restore official Cboe contract cache
        uses: actions/cache@v4
        with:
          path: .cache/v147_v154
          key: v147-v154-cboe-vx-monthly-2004-2026-v1
      - name: Run frozen V149-V154 research
        run: |
          set -euxo pipefail
          rm -rf research/active_v147_v154/results \
                 research/active_v147_v154/inputs/processed \
                 research/active_v147_v154/inputs/provenance
          python research/active_v147_v154/source/canonical_runner.py \
            --root research/active_v147_v154 \
            --cache .cache/v147_v154 \
            --atlas research/active_v139_v146/inputs/v75_stress_equity.csv \
            2>&1 | tee research/active_v147_v154/run.log
      - name: Materialize checkpoint V154
        run: |
          set -euxo pipefail
          test -s research/active_v147_v154/results/summary.json
          test -s research/active_v147_v154/results/selection_proof_before_2021.json
          test -s research/active_v147_v154/results/ANNUAL_RETURNS.csv
          test -s research/active_v147_v154/inputs/processed/vx_monthly_contracts.csv
          test -s research/active_v147_v154/inputs/processed/vx_term_structure_daily.csv
          mkdir -p docs/checkpoints/v154
          cp research/active_v147_v154/results/summary.json docs/checkpoints/v154/CHECKPOINT_V154.json
          cp research/active_v147_v154/results/REPORT_RU.md docs/checkpoints/v154/RESEARCH_CHECKPOINT_V154_RU.md
          cp research/active_v147_v154/results/ANNUAL_RETURNS.csv docs/checkpoints/v154/ANNUAL_RETURNS.csv
      - name: Verify frozen output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research/active_v147_v154')
          value=json.loads((root/'results/summary.json').read_text())
          assert value['live_ready'] is False
          assert value['real_leverage_authorized'] is False
          assert value['selection']['selection_uses_2021_or_later'] is False
          assert 'V75_original' in (root/'results/ANNUAL_RETURNS.csv').read_text().splitlines()[0]
          print(json.dumps(value,indent=2))
          PY
          find research/active_v147_v154 -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find research/active_v147_v154 -type f -name '*.pyc' -delete || true
          bad=$(find research/active_v147_v154 docs/checkpoints/v154 -type f \( -name '*.zip' -o -name '*.tar' -o -name '*.xz' -o -name '*.b64' -o -name '*.pyfrag' \) -print || true)
          test -z "$bad" || { printf '%s\n' "$bad"; exit 1; }
      - name: Commit direct source, official data and results
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/active_v147_v154 docs/checkpoints/v154
          git commit -m 'Add Active V147-V154 official dated VIX results [skip ci]'
          git push origin HEAD:agent/active-v147-v154-cme-dated-contracts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-v147-v154-dated-vix-research
          path: |
            research/active_v147_v154/results
            research/active_v147_v154/run.log
          if-no-files-found: warn
          retention-days: 30
