name: Guard constant-budget followup
on:
  push:
    branches: [research/funding-crowding-20260906]
    paths:
      - research/guard_execution_audit/budget.py
      - .github/workflows/guard-budget-followup.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r research/btc_flow/requirements.txt
      - run: python -m pytest -q tests/test_guard_execution_audit.py --junitxml=budget-tests.xml
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34030758810
          name: guard-execution-evidence
          path: original
      - name: Existing engine, all position budgets and native cost scenarios
        run: python -m research.guard_execution_audit.budget --original original --out report > budget.log 2>&1 || { tail -n 100 budget.log; exit 1; }
      - run: cat budget.log
      - name: Save exact tested orchestration code
        if: always()
        run: |
          mkdir -p delivery/research
          cp -r research/guard_execution_audit delivery/research/
          git rev-parse HEAD > delivery/TESTED_COMMIT.txt
          find delivery -type d -name __pycache__ -prune -exec rm -rf '{}' +
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard-budget-followup-evidence
          path: |
            report/
            delivery/
            budget.log
            budget-tests.xml
          retention-days: 90
  reproduce:
    needs: compare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r research/btc_flow/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34030758810
          name: guard-execution-evidence
          path: original
      - uses: actions/download-artifact@v4
        with:
          name: guard-budget-followup-evidence
          path: first
      - run: python -m research.guard_execution_audit.budget --original original --out repeated > repeat.log 2>&1 || { tail -n 100 repeat.log; exit 1; }
      - name: Full report and all91 native filled-order files
        run: |
          python - <<'PY'
          import pathlib,json
          p=pathlib.Path
          a=json.loads(p('first/report/results.json').read_text());b=json.loads(p('repeated/results.json').read_text());assert a==b
          files=sorted(p('first/report').glob('*_fills.csv'));assert len(files)==91
          for f in files:assert f.read_bytes()==(p('repeated')/f.name).read_bytes(),f.name
          v=json.loads(p('repeated/verification.json').read_text());assert v['reports']==91
          v.update(all_reports_exact=True,all91_fill_files_exact=True,independent_execution=True,
                   independent_model=False,independent_market=False,post_result_exploratory=True,local_execution=False)
          p('REPRODUCTION.json').write_text(json.dumps(v,indent=2));print(json.dumps(v))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard-budget-followup-reproduction
          path: |
            REPRODUCTION.json
            repeated/comparison.csv
            repeated/annual.csv
            repeat.log
          retention-days: 90
