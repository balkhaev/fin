name: BTC Spot regime research
on:
  push:
    branches: [research/btc-spot-regime]
    paths:
      - research/btc_spot_regime/*.py
      - tests/test_btc_spot*.py
      - .github/workflows/btc-spot-regime.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: btc-spot-regime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . -r research/btc_flow/requirements.txt scipy
      - name: New unit tests and full repository tests
        run: |
          python -m pytest -q tests/test_btc_spot*.py --junitxml=spot-tests.xml
          python -m pytest -q tests --junitxml=all-tests.xml > all-tests.log 2>&1
      - name: Download fixed official history and execute precommitted study
        shell: bash
        run: |
          set -euo pipefail
          python -m research.btc_spot_regime.study --data spot-data --out spot-report --download > research.log 2>&1 || { tail -n 80 research.log; exit 1; }
      - name: Print numerical evidence, not a forecast
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path
          r=json.loads(p('spot-report/results.json').read_text())
          print('SOURCE_AUDIT',json.dumps(r['data']))
          print('SELECTION',r['selection']['primary'],r['selection']['challenger'])
          fields=('policy','period','scenario','return_pct','cagr_pct','max_close_drawdown_pct','round_trips','fees','accounting_complete','halted_at')
          for x in r['results']:print('RESULT',json.dumps({k:x[k] for k in fields}))
          for name in {r['selection']['primary'],r['selection']['challenger'],'buy_hold'}:
              if name:print('YEARS',name,json.dumps([{k:x[k] for k in ('year','return_pct','round_trips','accounting_complete')} for x in r['annual_reset'] if x['policy']==name]))
          print('500_YEARS',json.dumps(r['observed_full_years_above_500']))
          print('UNCERTAINTY',json.dumps(r['uncertainty']))
          print('TEST_SUMMARY',p('all-tests.log').read_text().splitlines()[-1])
          print('RESULT_HASH',json.loads(p('spot-report/summary.json').read_text())['result_sha256'])
          PY
      - name: Preserve tested source and logs
        if: always()
        run: |
          mkdir -p spot-delivery/research spot-delivery/tests
          cp -r research/btc_spot_regime spot-delivery/research/
          cp tests/test_btc_spot*.py spot-delivery/tests/
          cp research/btc_flow/requirements.txt spot-delivery/requirements.txt
          git rev-parse HEAD > spot-delivery/TESTED_COMMIT.txt
          find spot-delivery -type d -name __pycache__ -prune -exec rm -rf '{}' +
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-spot-regime-evidence
          path: |
            spot-data/
            spot-report/
            spot-delivery/
            spot-tests.xml
            all-tests.xml
            all-tests.log
            research.log
          retention-days: 90
  reproduce:
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r research/btc_flow/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: btc-spot-regime-evidence
          path: original
      - name: Recompute every scenario on a fresh runner with identical input hashes
        run: python -m research.btc_spot_regime.study --data original/spot-data --out reproduced > reproduce.log 2>&1 || { tail -n 80 reproduce.log; exit 1; }
      - name: Compare complete numerical result and independently reconcile all exported fills
        run: |
          python - <<'PY'
          import hashlib,json,math,pathlib
          import pandas as pd
          p=pathlib.Path
          first=json.loads(p('original/spot-report/results.json').read_text())
          second=json.loads(p('reproduced/results.json').read_text())
          assert first==second,'Numerical reproduction mismatch'
          count=0
          for f in p('reproduced').glob('*_fills.csv'):
              if f.stat().st_size<5:continue
              x=pd.read_csv(f)
              if x.empty:continue
              assert set(x.side)<= {'buy','sell'}
              q=0.;cash=1000.
              for row in x.itertuples():
                  q+=(1 if row.side=='buy' else -1)*row.quantity
                  cash+=(1 if row.side=='sell' else -1)*row.quantity*row.price-row.fee
                  assert q>=-1e-9 and cash>=-1e-6
              assert abs(q)<1e-8
              trades=pd.read_csv(str(f).replace('_fills.csv','_trades.csv'))
              assert math.isclose(cash,1000+trades.net.sum(),abs_tol=1e-6)
              count+=len(x)
          digest=hashlib.sha256(json.dumps(second,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          verification=dict(full_result_exactly_reproduced=True,result_sha256=digest,
            exported_fill_rows_reconciled=count,independent_clean_runner=True,local_execution=False,
            live_orders=False,annual_500_proven=False)
          p('REPRODUCTION.json').write_text(json.dumps(verification,indent=2))
          print(json.dumps(verification))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-spot-regime-reproduced
          path: |
            REPRODUCTION.json
            reproduced/summary.json
            reproduced/comparison.csv
            reproduced/annual_reset.csv
            reproduce.log
          retention-days: 90
