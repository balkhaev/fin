name: Validate OI archive fallback

on:
  push:
    branches: [agent/fix-backtests-dyn-profiles]
    paths:
      - 'scripts/apply_agent_oi_fallback_fix.py'
      - '.github/workflows/agent-oi-fallback-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-backtests-dyn-profiles
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply, validate and publish
        shell: bash
        run: |
          set +e
          log=agent-production-validation.log
          : >"$log"
          run_check() {
            title="$1"; shift
            { echo; echo "===== ${title} ====="; "$@"; } >>"$log" 2>&1
            status=$?; echo "exit_status=${status}" >>"$log"; return $status
          }
          status=0
          run_check "apply OI patch" python scripts/apply_agent_oi_fallback_fix.py || status=$?
          if [ "$status" -eq 0 ]; then
            rm scripts/apply_agent_oi_fallback_fix.py .github/workflows/agent-oi-fallback-fix.yml
            run_check "git diff check" git diff --check || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_check "compile" python -m compileall -q src/finruntime tests/runtime scripts/run_paper_stack.py || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_check "runtime tests" python -m unittest discover -s tests/runtime -v || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_check "runtime verification" python scripts/verify_runtime.py --full || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_check "Consensus archive and OI fallback" python - <<'PY'
          from datetime import date
          from finruntime.observability.factor_backtests import run_consensus_backtest
          result = run_consensus_backtest(date(2026, 6, 15), date(2026, 7, 31))
          diagnostics = result['diagnostics']
          assert diagnostics['wif_klines'] > 0
          assert diagnostics['wif_premium_klines'] > 0
          assert diagnostics['dot_klines'] > 0
          assert diagnostics['wif_open_interest_points'] > 0
          print({
              'missing_archives': len(diagnostics['archive_missing_urls']),
              'oi_points': diagnostics['wif_open_interest_points'],
              'trades': len(result['trades']),
              'ending_nav': result['metrics']['ending_nav_usd'],
          })
          PY
            status=$?
          fi
          git config user.name 'OpenAI Agent'
          git config user.email 'openai-agent@users.noreply.github.com'
          if [ "$status" -eq 0 ]; then
            rm -f "$log"
            git add -A
            git commit -m 'Make OI REST augmentation fail closed'
          else
            rm -f scripts/apply_agent_oi_fallback_fix.py .github/workflows/agent-oi-fallback-fix.yml
            git add -A
            git commit -m 'Record OI fallback validation failure'
          fi
          git push origin HEAD:agent/fix-backtests-dyn-profiles
          exit "$status"
