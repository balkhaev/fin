name: Active V333-V340 corrected coskewness BTC-ETH hedge

on:
  push:
    branches: [agent/active-v333-v340-corrected-coskew-hedge]
    paths:
      - 'research/active_v333_v340/**'
      - '.github/workflows/active-v333-v340-corrected-coskew-hedge.yml'
  pull_request:
    branches: [agent/active-v325-v332-coskewness-correction]
    paths:
      - 'research/active_v333_v340/**'
      - '.github/workflows/active-v333-v340-corrected-coskew-hedge.yml'
  workflow_dispatch:

concurrency:
  group: active-v333-v340-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/active-v333-v340-corrected-coskew-hedge

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize corrected exact-hedge source
        run: |
          set -euxo pipefail
          python research/active_v333_v340/bootstrap_corrected_coskew_hedge.py
          test -s research/active_v333_v340/run_research.py
          grep -q 'ACTIVE_V333_CORRECTED_COSKEW_BETA_HEDGE' research/active_v333_v340/run_research.py
          grep -q 'low_systematic_coskewness_l365_k3_r14_beta' research/active_v333_v340/run_research.py
          grep -q 'active_v325_v332' research/active_v333_v340/run_research.py

      - name: Install, compile and causal self-test
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r research/active_v333_v340/requirements.txt
          python -m compileall -q \
            research/active_v333_v340 \
            research/active_v325_v332 \
            research/active_v317_v324 \
            research/active_v301_v308 \
            research/active_v269_v276 \
            research/active_v253_v260 \
            research/active_v9
          python research/active_v333_v340/run_research.py --self-test

      - name: Restore immutable V9 public archive cache
        uses: actions/cache@v4
        with:
          path: .cache/v9
          key: binance-usdm-daily-fixed-universe-2020-2026-v9

      - name: Run corrected exact development reproof and guarded OOS
        run: |
          set -euxo pipefail
          rm -rf research/active_v333_v340/results \
                 research/active_v333_v340/MANIFEST.json \
                 docs/checkpoints/v340
          python research/active_v333_v340/run_research.py \
            --root research/active_v333_v340 \
            --cache .cache/v9 \
            2>&1 | tee research/active_v333_v340/run.log

      - name: Materialize V340 checkpoint
        run: |
          set -euxo pipefail
          test -s research/active_v333_v340/results/summary.json
          test -s research/active_v333_v340/results/FROZEN_DECISION.json
          test -s research/active_v333_v340/results/coverage_gate.json
          test -s research/active_v333_v340/results/selection_proof_before_oos.json
          test -s research/active_v333_v340/results/REPORT_RU.md
          mkdir -p docs/checkpoints/v340
          cp research/active_v333_v340/results/summary.json docs/checkpoints/v340/CHECKPOINT_V340.json
          cp research/active_v333_v340/results/REPORT_RU.md docs/checkpoints/v340/RESEARCH_CHECKPOINT_V340_RU.md
          if test -s research/active_v333_v340/results/ANNUAL_RETURNS.csv; then
            cp research/active_v333_v340/results/ANNUAL_RETURNS.csv docs/checkpoints/v340/ANNUAL_RETURNS.csv
          fi

      - name: Verify chronology and safety
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/active_v333_v340')
          summary = json.loads((root / 'results/summary.json').read_text())
          proof = json.loads((root / 'results/selection_proof_before_oos.json').read_text())
          if not proof.get('selection_not_run'):
              assert proof['selection_uses_2024'] is False
              assert proof['selection_uses_2025'] is False
              assert proof['selection_uses_2026'] is False
              assert proof['neighboring_alpha_parameters_tested'] == 0
              assert proof['neighboring_hedge_parameters_tested'] == 0
              assert proof['corrected_coskewness_moment'] is True
              assert proof['hedge_specification_source'] == 'V317-V324 preregistration'
              assert proof['source_policy'] == 'low_systematic_coskewness_l365_k3_r14_beta'
              assert proof['oos_opened'] == proof['development_reproof_passed']
          assert summary['integration_permitted'] is False
          assert summary['live_ready'] is False
          assert summary['real_leverage_authorized'] is False
          assert summary['profitability_proven'] is False
          print(json.dumps(summary, indent=2))
          PY
          find research/active_v333_v340 docs/checkpoints/v340 -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find research/active_v333_v340 docs/checkpoints/v340 -type f -name '*.pyc' -delete || true

      - name: Commit readable source and frozen decision
        if: github.event_name != 'pull_request'
        run: |
          set -euxo pipefail
          rm -f research/active_v333_v340/bootstrap_corrected_coskew_hedge.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A research/active_v333_v340 docs/checkpoints/v340
          if git diff --cached --quiet; then
            echo 'No V333-V340 changes'
          else
            git commit -m 'Archive V333-V340 corrected coskewness hedge evidence [skip ci]'
            git push origin HEAD:agent/active-v333-v340-corrected-coskew-hedge
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-v333-v340-corrected-coskew-hedge
          path: |
            research/active_v333_v340/results
            research/active_v333_v340/run.log
            docs/checkpoints/v340
          if-no-files-found: warn
          retention-days: 30
