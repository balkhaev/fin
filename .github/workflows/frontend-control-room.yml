name: FIN frontend, scheduler and live control plane

on:
  push:
    branches: [main, agent/live-control-plane, agent/paper-scheduler]
    paths:
      - 'frontend/**'
      - 'src/finruntime/observability/**'
      - 'src/finruntime/scheduler/**'
      - 'src/finruntime/operations/**'
      - 'src/finruntime/journal/**'
      - 'src/finruntime/locking.py'
      - 'src/finruntime/io.py'
      - 'src/finruntime/portfolio/risk.py'
      - 'scripts/build_frontend_data.py'
      - 'scripts/run_control_room.py'
      - 'scripts/run_paper_scheduler.py'
      - 'tests/frontend/**'
      - 'tests/runtime/**'
      - 'docs/CONTROL_ROOM_RUNTIME_RU.md'
      - 'docs/PAPER_SCHEDULER_RU.md'
      - 'deploy/systemd/fin-control-room.service.example'
      - 'deploy/systemd/fin-paper-scheduler.service.example'
      - 'pyproject.toml'
      - '.github/workflows/frontend-control-room.yml'
      - 'docs/checkpoints/v138/CHECKPOINT_V138.json'
      - 'research/v75_tristate_guard_v517_v524/results/**'
      - 'research/v75_trend_hysteresis_v509_v516/results/**'
      - 'research/market_state_v413_v420/results/market_state_daily.csv'
      - 'research/state_telemetry_v429_v436/FORWARD_INSTRUMENTATION_DECISION.json'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'src/finruntime/observability/**'
      - 'src/finruntime/scheduler/**'
      - 'src/finruntime/operations/**'
      - 'src/finruntime/journal/**'
      - 'src/finruntime/locking.py'
      - 'src/finruntime/io.py'
      - 'src/finruntime/portfolio/risk.py'
      - 'scripts/run_control_room.py'
      - 'scripts/run_paper_scheduler.py'
      - 'tests/frontend/**'
      - 'tests/runtime/**'
      - 'docs/CONTROL_ROOM_RUNTIME_RU.md'
      - 'docs/PAPER_SCHEDULER_RU.md'
      - 'deploy/systemd/**'
      - 'pyproject.toml'
      - '.github/workflows/frontend-control-room.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-scheduler-control-room-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install, compile and build evidence bundle
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check -e .
          python -m compileall -q src scripts tests
          python scripts/build_frontend_data.py --output /tmp/dashboard.json
          python scripts/build_frontend_data.py --check --output /tmp/dashboard.json

      - name: Run runtime and frontend suites
        run: |
          set -euxo pipefail
          python -m unittest discover -s tests/runtime -p 'test_*.py' -v
          python -m unittest discover -s tests/frontend -p 'test_*.py' -v
          python scripts/verify_runtime.py --full
          node --check frontend/app.js
          node --check frontend/live.js
          ! grep -R -E 'https?://(cdn|unpkg|jsdelivr)' frontend
          ! grep -R -E 'submit_order|create_order|/api/v1/orders' frontend src/finruntime/observability src/finruntime/scheduler

      - name: Build sealed scheduler request and execute one paper cycle
        run: |
          set -euxo pipefail
          rm -rf /tmp/fin-runtime /tmp/fin-inputs
          mkdir -p /tmp/fin-inputs
          python - <<'PY'
          import json
          from pathlib import Path
          from finruntime.execution import PaperQuote
          from finruntime.journal import write_atomic_json
          from finruntime.models import MarketSnapshot, SourceObservation, StrategySnapshot
          from finruntime.operations import PaperCyclePaths
          from finruntime.portfolio import PaperAccountState

          runtime=Path('/tmp/fin-runtime')
          inputs=Path('/tmp/fin-inputs')
          account=PaperAccountState.empty(
              strategy_id='v75_atlas_nx',
              as_of_utc='2026-07-29T00:00:00Z',
              starting_cash='10000',
          )
          write_atomic_json(PaperCyclePaths.under(runtime, account.strategy_id).account_state, account.to_dict())
          source=SourceObservation(
              source='spot_daily',
              source_timestamp_utc='2026-07-29T00:00:00Z',
              available_at_utc='2026-07-29T00:01:00Z',
              payload_sha256='sha256:'+'1'*64,
          )
          market=MarketSnapshot.create(
              as_of_utc='2026-07-29T00:00:00Z',
              decision_time_utc='2026-07-29T00:05:00Z',
              sources={'spot_daily': source},
              spot={'BTC/USDT': {'reference_price':'100'}},
          )
          strategy=StrategySnapshot.create(
              strategy_id='v75_atlas_nx',
              strategy_version='runtime-v1',
              decision_time_utc=market.decision_time_utc,
              market_snapshot_id=market.snapshot_id,
              state_sequence=1,
              targets={'spot': {'BTC/USDT':'0.1'}, 'perp': {}},
              gross_target='0.1',
              cash_target='0.9',
              risk={'gross_cap':'1.05'},
          )
          quote=PaperQuote(
              instrument='BTC/USDT', market_type='spot',
              observed_at_utc='2026-07-29T00:06:00Z',
              source_observation_hash='sha256:'+'2'*64,
              bid='99.95', ask='100.05', mid='100', available_quantity='1000',
          )
          write_atomic_json(inputs/'market.json', market.to_dict())
          write_atomic_json(inputs/'strategy.json', strategy.to_dict())
          write_atomic_json(inputs/'quotes.json', [quote.__dict__ if hasattr(quote,'__dict__') else {
              'instrument':quote.instrument,'market_type':quote.market_type,
              'observed_at_utc':quote.observed_at_utc,
              'source_observation_hash':quote.source_observation_hash,
              'bid':quote.bid,'ask':quote.ask,'mid':quote.mid,
              'available_quantity':quote.available_quantity,'quality':quote.quality,
          }])
          write_atomic_json(inputs/'prices.json', {'spot':{'BTC/USDT':{'reference_price':'100'}},'perp':{}})
          PY
          fin-paper-scheduler enqueue \
            --runtime-root /tmp/fin-runtime \
            --market-snapshot /tmp/fin-inputs/market.json \
            --strategy-snapshot /tmp/fin-inputs/strategy.json \
            --quotes /tmp/fin-inputs/quotes.json \
            --reference-prices /tmp/fin-inputs/prices.json \
            --critical-source spot_daily \
            --created-at-utc 2026-07-29T00:06:00Z \
            --expires-at-utc 2026-07-30T00:06:00Z \
            --modelled-cost 1 \
            --modelled-slippage-bps 8 \
            >/tmp/enqueue.json
          fin-paper-scheduler run-once \
            --runtime-root /tmp/fin-runtime \
            --max-items 5 \
            >/tmp/scheduler-run.json
          fin-paper-scheduler verify --runtime-root /tmp/fin-runtime >/tmp/scheduler-verify.json

      - name: Exercise read-only HTTP API and SSE
        run: |
          set -euxo pipefail
          fin-control-room \
            --host 127.0.0.1 \
            --port 8765 \
            --frontend-root frontend \
            --dashboard /tmp/dashboard.json \
            --runtime-root /tmp/fin-runtime \
            --stale-after-seconds 1000000000 \
            >/tmp/control-room.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/api/v1/health >/tmp/health.json && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8765/api/v1/dashboard >/tmp/live-dashboard.json
          curl -fsS http://127.0.0.1:8765/api/v1/scheduler >/tmp/scheduler-api.json
          curl -fsS 'http://127.0.0.1:8765/api/v1/events?once=1' >/tmp/events.txt
          curl -fsS http://127.0.0.1:8765/live.html >/tmp/live.html
          status=$(curl -sS -o /tmp/post.json -w '%{http_code}' -X POST http://127.0.0.1:8765/api/v1/orders)
          test "$status" = 405
          python - <<'PY'
          import json
          from pathlib import Path
          dashboard=json.loads(Path('/tmp/live-dashboard.json').read_text())
          health=json.loads(Path('/tmp/health.json').read_text())
          scheduler=json.loads(Path('/tmp/scheduler-api.json').read_text())
          rejected=json.loads(Path('/tmp/post.json').read_text())
          assert dashboard['runtime']['aggregate']['observation_count']==1
          assert dashboard['runtime']['scheduler']['completed']==1
          assert dashboard['environment']['live_ready'] is False
          assert health['read_only'] is True
          assert health['exchange_submission_available'] is False
          assert scheduler['scheduler']['completed']==1
          assert scheduler['exchange_submission_available'] is False
          assert rejected['exchange_submission_available'] is False
          assert 'event: snapshot' in Path('/tmp/events.txt').read_text()
          assert 'FIN Runtime Control Plane' in Path('/tmp/live.html').read_text()
          PY

      - name: Assemble preview artifact
        run: |
          set -euxo pipefail
          cp /tmp/dashboard.json frontend/data/dashboard.json
          python -m zipfile -c /tmp/fin-control-room.zip \
            frontend \
            docs/CONTROL_ROOM_RUNTIME_RU.md \
            docs/PAPER_SCHEDULER_RU.md \
            deploy/systemd/fin-control-room.service.example \
            deploy/systemd/fin-paper-scheduler.service.example

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fin-control-room
          path: |
            /tmp/fin-control-room.zip
            /tmp/control-room.log
            /tmp/live-dashboard.json
            /tmp/health.json
            /tmp/scheduler-api.json
            /tmp/scheduler-run.json
            /tmp/scheduler-verify.json
            /tmp/events.txt
          if-no-files-found: warn
          retention-days: 30
